function TransaccionesTab() {
  const [items, setItems] = useState([]);
  const [cuentas, setCuentas] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState({ tipo: 'gasto', categoria: '', subcategoria: '', monto: '', cuenta: '', nota: '' });
  const [adding, setAdding] = useState(false);
  const [busyId, setBusyId] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [filtros, setFiltros] = useState({ cuenta: '', categoria: '', mes: '', texto: '' });
  const [asignando, setAsignando] = useState(null);
  const [categoriaRapida, setCategoriaRapida] = useState({});
  const [vinculando, setVinculando] = useState(false);
  const [resultadoVinculo, setResultadoVinculo] = useState(null);
  const [sincronizando, setSincronizando] = useState(false);
  const [resultadoSync, setResultadoSync] = useState(null);
  const [depurando, setDepurando] = useState(false);
  const [posiblesDuplicados, setPosiblesDuplicados] = useState(null);

  function buscarDuplicados() {
    setDepurando(true);
    apiCall('eliminarDuplicados', {}).then(res => {
      setDepurando(false);
      if (res && !res.error) setPosiblesDuplicados(res.detalle || []);
    });
  }

  function vincularTransferencias() {
    setVinculando(true);
    apiCall('vincularTransferencias', {}).then(res => {
      setVinculando(false);
      if (res && !res.error) {
        setResultadoVinculo(`✓ ${res.vinculadas} transferencia(s) vinculada(s)${res.pendientesSalida || res.pendientesEntrada ? ` · ${res.pendientesSalida} salida(s) y ${res.pendientesEntrada} entrada(s) sin pareja` : ''}`);
        load();
      }
      setTimeout(() => setResultadoVinculo(null), 6000);
    });
  }

  function sincronizarCategorias() {
    setSincronizando(true);
    apiCall('sincronizarCategorias', {}).then(res => {
      setSincronizando(false);
      if (res && !res.error) {
        setResultadoSync(`✓ ${res.actualizadas} movimiento(s) recategorizado(s) según tus reglas guardadas`);
        load();
      }
      setTimeout(() => setResultadoSync(null), 6000);
    });
  }


  function asignarCategoria(it, guardarRegla) {
    const val = categoriaRapida[it.id];
    if (!val) return;
    const [categoria, subcategoria] = val.split('|');
    setAsignando(it.id);
    apiCall('update', { sheet: 'Transacciones', data: { id: it.id, categoria, subcategoria: subcategoria || '' } }).then(() => {
      if (guardarRegla && it.nota) {
        const palabra = normalizarComercioFrontend_(it.nota);
        if (palabra) apiCall('create', { sheet: 'Reglas_Categorizacion', data: { palabra_clave: palabra, categoria, subcategoria: subcategoria || '' } });
      }
      setAsignando(null);
      load();
    });
  }

  function load() {
    setLoading(true);
    apiCall('list', { sheet: 'Transacciones' }).then(res => { setItems(Array.isArray(res) ? res : []); setLoading(false); });
    apiCall('list', { sheet: 'Cuentas_Bancarias' }).then(res => setCuentas(Array.isArray(res) ? res : []));
  }
  useEffect(load, []);

  function addTransaccion(e) {
    e.preventDefault();
    if (!form.monto || adding) return;
    setAdding(true);
    apiCall('create', { sheet: 'Transacciones', data: { ...form, fecha: new Date().toISOString().slice(0, 10) } }).then(() => {
      setForm({ tipo: 'gasto', categoria: '', subcategoria: '', monto: '', cuenta: '', nota: '' });
      setAdding(false);
      setShowForm(false);
      load();
    });
  }

  function remove(id) {
    if (busyId) return;
    setBusyId(id);
    apiCall('delete', { sheet: 'Transacciones', id }).then(() => { setBusyId(null); load(); });
  }

  function monedaDeCuenta(nombreCuenta) {
    const c = cuentas.find(c => c.nombre === nombreCuenta);
    return (c && c.moneda) || 'EUR';
  }
  function simboloMoneda(moneda) {
    return moneda === 'EUR' ? '€' : moneda === 'COP' ? 'COP' : moneda === 'USD' ? 'USD' : moneda;
  }

  const meses = [...new Set(items.map(it => (it.fecha || '').slice(0, 7)).filter(Boolean))].sort().reverse();
  const categorias = [...new Set(items.map(it => it.categoria).filter(Boolean))];

  const visibles = items.filter(it => {
    if (filtros.cuenta && it.cuenta !== filtros.cuenta) return false;
    if (filtros.categoria && it.categoria !== filtros.categoria) return false;
    if (filtros.mes && (it.fecha || '').slice(0, 7) !== filtros.mes) return false;
    if (filtros.texto && !((it.nota || '') + (it.categoria || '')).toLowerCase().includes(filtros.texto.toLowerCase())) return false;
    return true;
  }).sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

  // El balance solo suma cuentas en EUR — mezclar monedas distintas en una
  // sola cifra no tendría ningún significado real (2.000.000 COP + 500 EUR
  // no son "2.000.500 de nada"). Las cuentas en otra moneda se resumen aparte.
  const visiblesEUR = visibles.filter(it => monedaDeCuenta(it.cuenta) === 'EUR');
  const balance = visiblesEUR.reduce((acc, it) => {
    const monto = parseFloat(it.monto) || 0;
    if (it.tipo === 'ingreso') return acc + monto;
    if (it.tipo === 'gasto') return acc - monto;
    return acc;
  }, 0);
  const totalTransferencias = visiblesEUR.filter(it => it.tipo === 'transferencia').reduce((acc, it) => acc + (parseFloat(it.monto) || 0), 0);
  const sinCategoria = items.filter(it => !it.categoria && it.tipo !== 'transferencia').length;

  const monedasNoEUR = [...new Set(cuentas.filter(c => c.moneda && c.moneda !== 'EUR').map(c => c.moneda))];
  const balancesPorOtraMoneda = monedasNoEUR.map(moneda => {
    const cuentasDeEsaMoneda = cuentas.filter(c => c.moneda === moneda).map(c => c.nombre);
    const movs = visibles.filter(it => cuentasDeEsaMoneda.includes(it.cuenta));
    const bal = movs.reduce((acc, it) => {
      const monto = parseFloat(it.monto) || 0;
      if (it.tipo === 'ingreso') return acc + monto;
      if (it.tipo === 'gasto') return acc - monto;
      return acc;
    }, 0);
    return { moneda, balance: bal };
  });

  return (
    <div>
      <div className="topbar">
        <span className="entry-meta">Balance en EUR (sin transferencias internas)</span>
        <span className="entry-amount" style={{ color: balance >= 0 ? 'var(--green)' : 'var(--red)' }}>{balance.toFixed(2)} €</span>
      </div>
      {balancesPorOtraMoneda.length > 0 && (
        <div className="topbar" style={{ marginTop: -8 }}>
          <span className="entry-meta">
            {balancesPorOtraMoneda.map(b => `Balance en ${b.moneda}: ${b.balance.toFixed(2)} ${simboloMoneda(b.moneda)}`).join(' · ')}
            {' '}(no se suma al de EUR — monedas distintas)
          </span>
        </div>
      )}
      {totalTransferencias > 0 && (
        <div className="entry-meta" style={{ marginBottom: 6 }}>Transferencias entre tus cuentas (no contadas): {totalTransferencias.toFixed(2)} €</div>
      )}
      {sinCategoria > 0 && (
        <div className="entry-meta" style={{ marginBottom: 14, color: 'var(--red)' }}>⚠ {sinCategoria} movimiento(s) sin categoría — asígnala abajo en cada uno</div>
      )}

      <button className={`add-toggle-btn ${showForm ? 'cancel' : ''}`} onClick={() => setShowForm(!showForm)}>
        {showForm ? 'Cancelar' : '+ Añadir movimiento'}
      </button>
      <button className="add-toggle-btn" disabled={vinculando} onClick={vincularTransferencias} style={{ marginLeft: 8 }}>
        {vinculando ? 'Vinculando…' : '🔗 Vincular transferencias'}
      </button>
      <button className="add-toggle-btn" disabled={sincronizando} onClick={sincronizarCategorias} style={{ marginLeft: 8 }}>
        {sincronizando ? 'Sincronizando…' : '🔄 Sincronizar categorías'}
      </button>
      <button className="add-toggle-btn" disabled={depurando} onClick={buscarDuplicados} style={{ marginLeft: 8 }}>
        {depurando ? 'Buscando…' : '🔍 Buscar posibles duplicados'}
      </button>
      {resultadoVinculo && <div className="entry-meta" style={{ marginTop: 8, color: 'var(--accent)' }}>{resultadoVinculo}</div>}
      {resultadoSync && <div className="entry-meta" style={{ marginTop: 8, color: 'var(--accent)' }}>{resultadoSync}</div>}

      {posiblesDuplicados !== null && (
        <div className="releve-history" style={{ marginBottom: 20 }}>
          <div className="entry-meta">
            {posiblesDuplicados.length === 0 ? 'No se encontraron coincidencias exactas.' :
              `⚠ ${posiblesDuplicados.length} grupo(s) con la misma cuenta, fecha, monto y descripción — revisa cada uno antes de borrar, pueden ser cargos reales repetidos (ej. dos viajes de metro al mismo precio)`}
          </div>
          {posiblesDuplicados.map((d, i) => (
            <div key={i} className="releve-history-item no-coincide">
              <span>{d.fecha} · {d.cuenta} · {d.repetidas}× · {d.nota.slice(0, 45)}</span>
              <span>{parseFloat(d.monto).toFixed(2)} €</span>
            </div>
          ))}
        </div>
      )}

      {showForm && (
        <form className="entry-form" onSubmit={addTransaccion}>

function BolsaPosicionesTab() {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [cotizaciones, setCotizaciones] = useState({});
  const [syncStatus, setSyncStatus] = useState(null);
  const [cuentasBolsa, setCuentasBolsa] = useState([]);
  const [form, setForm] = useState({ ticker: '', nombre: '', cantidad: '', precio_promedio_compra: '', moneda: '', cuenta_broker: '' });
  const [adding, setAdding] = useState(false);
  const [busyId, setBusyId] = useState(null);
  const [showForm, setShowForm] = useState(false);

  function load() {
    setLoading(true);
    apiCall('list', { sheet: 'Bolsa_Posiciones' }).then(res => {
      const lista = Array.isArray(res) ? res : [];
      setItems(lista);
      setLoading(false);
      cargarCotizaciones(lista);
    });
    apiCall('list', { sheet: 'Cuentas_Bolsa' }).then(res => setCuentasBolsa(Array.isArray(res) ? res : []));
  }
  useEffect(load, []);

  function cargarCotizaciones(lista) {
    const tickers = [...new Set(lista.map(it => it.ticker).filter(Boolean))];
    if (tickers.length === 0) return;
    setSyncStatus('cargando');
    apiCall('stockQuotes', { tickers }).then(res => {
      if (res && !res.error) {
        setCotizaciones(res);
        setSyncStatus('ok');
      } else {
        setSyncStatus('error');
      }
      setTimeout(() => setSyncStatus(null), 2500);
    });
  }

  function addPosicion(e) {
    e.preventDefault();
    if (!form.ticker || adding) return;
    setAdding(true);
    apiCall('create', { sheet: 'Bolsa_Posiciones', data: form }).then(() => {
      setForm({ ticker: '', nombre: '', cantidad: '', precio_promedio_compra: '', moneda: '', cuenta_broker: '' });
      setAdding(false);
      setShowForm(false);
      load();
    });
  }

  function remove(id) {
    if (busyId) return;
    setBusyId(id);
    apiCall('delete', { sheet: 'Bolsa_Posiciones', id }).then(() => { setBusyId(null); load(); });
  }

  const valorTotal = items.reduce((acc, it) => {
    const q = cotizaciones[it.ticker];
    const precio = q ? q.precio : parseFloat(it.precio_promedio_compra) || 0;
    return acc + precio * (parseFloat(it.cantidad) || 0);
  }, 0);
  const gananciaTotal = items.reduce((acc, it) => {
    const q = cotizaciones[it.ticker];
    if (!q) return acc;
    return acc + (q.precio - (parseFloat(it.precio_promedio_compra) || 0)) * (parseFloat(it.cantidad) || 0);
  }, 0);

  return (
    <div>
      <div className="topbar">
        <span className="entry-meta">Valor total (cotización en vivo)</span>
        <div style={{ display: 'flex', gap: 12, alignItems: 'baseline' }}>
          <span className="entry-amount">{valorTotal.toFixed(2)}</span>
          <button className="ghost" onClick={() => cargarCotizaciones(items)}>
            {syncStatus === 'cargando' ? '⟳ …' : syncStatus === 'ok' ? '✓' : syncStatus === 'error' ? '✕ Error' : '⟳ Sincronizar'}
          </button>
        </div>
      </div>
      <div className="entry-meta" style={{ marginBottom: 16 }}>
        Ganancia/pérdida no realizada: <span style={{ color: gananciaTotal >= 0 ? 'var(--green)' : 'var(--red)', fontFamily: 'IBM Plex Mono, monospace' }}>{gananciaTotal >= 0 ? '+' : ''}{gananciaTotal.toFixed(2)}</span>
      </div>

      {items.length > 0 && (
        <div className="kanban-card-meta" style={{ marginBottom: 16 }}>
          {[...new Set(items.map(it => it.ticker))].map(t => <span key={t} className="chip">{t}</span>)}
        </div>
      )}

      <button className={`add-toggle-btn ${showForm ? 'cancel' : ''}`} onClick={() => setShowForm(!showForm)}>
        {showForm ? 'Cancelar' : '+ Añadir posición'}
      </button>

      {showForm && (
        <form className="entry-form" onSubmit={addPosicion}>
          <input placeholder="Ticker (ej. AAPL)" value={form.ticker} onChange={e => setForm({ ...form, ticker: e.target.value.toUpperCase() })} />
          <input placeholder="Nombre" value={form.nombre} onChange={e => setForm({ ...form, nombre: e.target.value })} />
          <input type="number" step="0.0001" placeholder="Cantidad" value={form.cantidad} onChange={e => setForm({ ...form, cantidad: e.target.value })} />
          <input type="number" step="0.01" placeholder="Precio promedio de compra" value={form.precio_promedio_compra} onChange={e => setForm({ ...form, precio_promedio_compra: e.target.value })} />
          <input placeholder="Moneda" value={form.moneda} onChange={e => setForm({ ...form, moneda: e.target.value })} />
          <select value={form.cuenta_broker} onChange={e => setForm({ ...form, cuenta_broker: e.target.value })}>
            <option value="">Cuenta / broker</option>
            {cuentasBolsa.map(c => <option key={c.id} value={c.nombre}>{c.nombre}</option>)}
          </select>
          <button type="submit" disabled={adding}>{adding ? 'Añadiendo…' : 'Añadir posición'}</button>
        </form>
      )}

      {loading ? <div className="empty">Cargando…</div> :
        items.length === 0 ? <div className="empty">Sin posiciones registradas.</div> :
        <div className="log">
          {items.map(it => {
            const q = cotizaciones[it.ticker];
            const cantidad = parseFloat(it.cantidad) || 0;
            const compra = parseFloat(it.precio_promedio_compra) || 0;
            const ganancia = q ? (q.precio - compra) * cantidad : null;
            return (
              <div key={it.id} className="entry">
                <div className="entry-main">
                  <div className="entry-title">{it.ticker} {it.nombre && `· ${it.nombre}`}</div>
                  <div className="entry-meta">
                    {cantidad} uds · compra {compra.toFixed(2)} {it.moneda || ''}
                    {q ? ` · actual ${q.precio.toFixed(2)} ${q.moneda || ''}` : ' · sin cotización'}
                  </div>
                </div>
                {ganancia !== null && (
                  <span className="entry-amount" style={{ color: ganancia >= 0 ? 'var(--green)' : 'var(--red)' }}>
                    {ganancia >= 0 ? '+' : ''}{ganancia.toFixed(2)}
                  </span>
                )}
                <div className="entry-actions">
                  <button className="ghost" disabled={busyId === it.id} onClick={() => remove(it.id)}>{busyId === it.id ? '…' : 'Borrar'}</button>
                </div>
              </div>
            );
          })}
        </div>
      }
    </div>
  );
}

function normalizarComercioFrontend_(descripcion) {
  let d = (descripcion === null || descripcion === undefined) ? '' : String(descripcion);
  d = d.replace(/^CARTE\s+\d{2}[\/.]\d{2}[\/.]?\d{0,4}\s+/i, '');
  d = d.replace(/\s*CB\*\d+\s*$/i, '');
  d = d.replace(/\s+\d+\s*$/, '');
  return d.trim().toUpperCase();
}

function DonutChart({ datos, size }) {
  const total = datos.reduce((s, [, v]) => s + v, 0) || 1;
  const colores = ['var(--accent)', 'var(--green)', 'var(--red)', '#8b5cf6', '#f59e0b', '#06b6d4', '#ec4899', '#84cc16', '#64748b', '#a855f7'];
  let acumulado = 0;
  const segmentos = datos.map(([nombre, valor], i) => {
    const pct = (valor / total) * 100;
    const desde = acumulado;
    acumulado += pct;
    return `${colores[i % colores.length]} ${desde}% ${acumulado}%`;
  });
  const gradient = `conic-gradient(${segmentos.join(', ')})`;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
      <div style={{ width: size || 140, height: size || 140, borderRadius: '50%', background: gradient, flexShrink: 0, position: 'relative' }}>
        <div style={{ position: 'absolute', top: '18%', left: '18%', width: '64%', height: '64%', borderRadius: '50%', background: 'var(--surface)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column' }}>
          <span style={{ fontSize: 11, color: 'var(--ink-faint)' }}>Total</span>
          <span style={{ fontSize: 14, fontWeight: 600 }}>{total.toFixed(0)} €</span>
        </div>
      </div>
      <div style={{ flex: 1, minWidth: 160 }}>
        {datos.map(([nombre, valor], i) => (
          <div key={nombre} style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4, fontSize: 12 }}>
            <span style={{ width: 9, height: 9, borderRadius: '50%', background: colores[i % colores.length], flexShrink: 0 }}></span>
            <span style={{ flex: 1 }}>{nombre}</span>
            <span className="entry-meta">{((valor / total) * 100).toFixed(0)}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function GraficoLineaMultiple({ series, etiquetas }) {
  if (!etiquetas || etiquetas.length < 2) {
    return <div className="empty">Necesitas al menos 2 periodos para ver la evolución.</div>;
  }
  const W = 640, H = 220, PAD = 30;
  const todosValores = series.flatMap(s => s.puntos);
  const min = Math.min(0, ...todosValores), max = Math.max(...todosValores, 1);
  const rango = (max - min) || 1;
  const x = i => PAD + (i / (etiquetas.length - 1)) * (W - PAD * 2);
  const y = v => H - PAD - ((v - min) / rango) * (H - PAD * 2);
  const yCero = y(0);

  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 220 }}>
        <line x1={PAD} y1={yCero} x2={W - PAD} y2={yCero} stroke="var(--line)" strokeWidth="1" />
        {series.map((s, si) => {
          const lineaPuntos = s.puntos.map((v, i) => `${x(i)},${y(v)}`).join(' ');
          return (
            <g key={si}>
              <polyline points={lineaPuntos} fill="none" stroke={s.color} strokeWidth="2" />
              {s.puntos.map((v, i) => <circle key={i} cx={x(i)} cy={y(v)} r="3" fill={s.color} />)}
            </g>
          );
        })}
        {etiquetas.map((et, i) => (
          <text key={i} x={x(i)} y={H - 8} fontSize="9" fill="var(--ink-faint)" textAnchor="middle">{et.slice(5)}</text>
        ))}
      </svg>
      <div style={{ display: 'flex', gap: 14, marginTop: 6, flexWrap: 'wrap' }}>
        {series.map((s, i) => (
          <span key={i} className="entry-meta" style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
            <span style={{ width: 9, height: 9, borderRadius: '50%', background: s.color }}></span>{s.label}
          </span>
        ))}
      </div>
    </div>
  );
}

function AnalisisFinancieroTab() {
  const [movs, setMovs] = useState(null);
  const [cuentas, setCuentas] = useState([]);
  const [releves, setReleves] = useState([]);
  const [presupuestos, setPresupuestos] = useState([]);
  const [suscripciones, setSuscripciones] = useState([]);
  const [nuevoPresupuesto, setNuevoPresupuesto] = useState({ categoria: '', monto_objetivo: '' });
  const [guardandoPresupuesto, setGuardandoPresupuesto] = useState(false);
  const [busyPresupuestoId, setBusyPresupuestoId] = useState(null);
  const [granularidadCategoria, setGranularidadCategoria] = useState('total');
  const [periodoCategoria, setPeriodoCategoria] = useState(null);
  const [categoriaExpandida, setCategoriaExpandida] = useState(null);

  function load() {
    apiCall('list', { sheet: 'Transacciones' }).then(res => setMovs(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Cuentas_Bancarias' }).then(res => setCuentas(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Releves_Subidos' }).then(res => setReleves(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Presupuestos' }).then(res => setPresupuestos(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Suscripciones' }).then(res => setSuscripciones(Array.isArray(res) ? res : []));
  }
  useEffect(load, []);

  function guardarPresupuesto(e) {
    e.preventDefault();
    if (!nuevoPresupuesto.categoria || !nuevoPresupuesto.monto_objetivo || guardandoPresupuesto) return;
    setGuardandoPresupuesto(true);
    apiCall('create', { sheet: 'Presupuestos', data: nuevoPresupuesto }).then(() => {
      setNuevoPresupuesto({ categoria: '', monto_objetivo: '' });
      setGuardandoPresupuesto(false);
      load();
    });
  }

  function borrarPresupuesto(id) {
    if (busyPresupuestoId) return;
    setBusyPresupuestoId(id);
    apiCall('delete', { sheet: 'Presupuestos', id }).then(() => { setBusyPresupuestoId(null); load(); });
  }

  if (!movs) return <div className="empty">Cargando…</div>;
  if (movs.length === 0) return <div className="empty">Sin movimientos registrados todavía — sube un relevé o añade movimientos manualmente.</div>;

  const monedaDeCuenta = nombreCuenta => {
    const c = cuentas.find(c => c.nombre === nombreCuenta);
    return (c && c.moneda) || 'EUR';
  };
  const movsEUR = movs.filter(m => monedaDeCuenta(m.cuenta) === 'EUR');
  const cuentasNoEUR = [...new Set(cuentas.filter(c => c.moneda && c.moneda !== 'EUR').map(c => c.nombre))];

  const porMes = {};
  movsEUR.forEach(m => {
    const mes = (m.fecha || '').slice(0, 7);
    if (!mes) return;
    if (!porMes[mes]) porMes[mes] = { gasto: 0, ingreso: 0 };
    const monto = parseFloat(m.monto) || 0;
    if (m.tipo === 'ingreso') porMes[mes].ingreso += monto; else if (m.tipo === 'gasto') porMes[mes].gasto += monto;
  });

  // Un mes solo se considera con información completa si el PERIODO REAL de
  // los relevés de tu cuenta principal (BNP) cubre el mes de punta a punta.
  function mesesFrANumero(nombre) {
    const mapa = { janvier: 1, février: 2, mars: 3, avril: 4, mai: 5, juin: 6, juillet: 7, août: 8, septembre: 9, octobre: 10, novembre: 11, décembre: 12 };
    return mapa[(nombre || '').toLowerCase()] || null;
  }
  function parsearRangoPeriodoBNP(periodoTexto) {
    if (!periodoTexto) return null;
    const m = periodoTexto.match(/du\s+(\d{1,2})\s+([A-Za-zÀ-ÿ]+)\s+(\d{4})\s+au\s+(\d{1,2})\s+([A-Za-zÀ-ÿ]+)\s+(\d{4})/i);
    if (!m) return null;
    const mes1 = mesesFrANumero(m[2]), mes2 = mesesFrANumero(m[5]);
    if (!mes1 || !mes2) return null;
    return { inicio: new Date(+m[3], mes1 - 1, +m[1]), fin: new Date(+m[6], mes2 - 1, +m[4]) };
  }

  const cuentaBNP = cuentas.find(c => (c.banco || '').toLowerCase().includes('bnp'));
  const rangosBNP = cuentaBNP
    ? releves.filter(r => r.cuenta_id === cuentaBNP.id).map(r => parsearRangoPeriodoBNP(r.periodo)).filter(Boolean).sort((a, b) => a.inicio - b.inicio)
    : [];
  const cobertura = [];
  rangosBNP.forEach(r => {
    const ultimo = cobertura[cobertura.length - 1];
    if (ultimo && r.inicio <= new Date(ultimo.fin.getTime() + 86400000)) {
      if (r.fin > ultimo.fin) ultimo.fin = r.fin;
    } else {
      cobertura.push({ inicio: r.inicio, fin: r.fin });
    }
  });
  function mesCubiertoPorBNP(mesStr) {
    if (!cuentaBNP) return false;
    const [anio, mesNum] = mesStr.split('-').map(Number);
    const inicioMes = new Date(anio, mesNum - 1, 1);
    const finMes = new Date(anio, mesNum, 0);
    return cobertura.some(c => c.inicio <= inicioMes && c.fin >= finMes);
  }

  const mesesConMovimientos = Object.keys(porMes).sort();
  const meses = mesesConMovimientos.filter(mesCubiertoPorBNP);
  const mesesIncompletos = mesesConMovimientos.filter(m => !meses.includes(m));
  const maxGasto = Math.max(...meses.map(m => porMes[m].gasto), ...meses.map(m => porMes[m].ingreso), 1);

  const ahorroNeto = meses.map(mes => ({ mes, valor: porMes[mes].ingreso - porMes[mes].gasto }));
  const maxAbsAhorro = Math.max(...ahorroNeto.map(b => Math.abs(b.valor)), 1);

  const mesActual = meses[meses.length - 1];
  const mesAnterior = meses[meses.length - 2];
  const comparacion = (mesActual && mesAnterior) ? {
    gastoActual: porMes[mesActual].gasto,
    gastoAnterior: porMes[mesAnterior].gasto,
    ingresoActual: porMes[mesActual].ingreso,
    ingresoAnterior: porMes[mesAnterior].ingreso,
    cambioPct: porMes[mesAnterior].gasto > 0 ? Math.round(((porMes[mesActual].gasto - porMes[mesAnterior].gasto) / porMes[mesAnterior].gasto) * 100) : null,
  } : null;

  // ── 1. RESUMEN EJECUTIVO (KPIs) ──────────────────────────────────────────
  const ingresoTotalHist = meses.reduce((s, m) => s + porMes[m].ingreso, 0);
  const gastoTotalHist = meses.reduce((s, m) => s + porMes[m].gasto, 0);
  const ahorroTotalHist = ingresoTotalHist - gastoTotalHist;
  const tasaAhorroHist = ingresoTotalHist > 0 ? (ahorroTotalHist / ingresoTotalHist) * 100 : 0;

  const ingresoMesActual = mesActual ? porMes[mesActual].ingreso : 0;
  const gastoMesActual = mesActual ? porMes[mesActual].gasto : 0;
  const ahorroMesActual = ingresoMesActual - gastoMesActual;
  const tasaAhorroMesActual = ingresoMesActual > 0 ? (ahorroMesActual / ingresoMesActual) * 100 : 0;

  // ── 4. COMERCIOS + FRECUENCIA ────────────────────────────────────────────
  const comercioInfo = {};
  movsEUR.filter(m => m.tipo === 'gasto').forEach(m => {
    const clave = normalizarComercioFrontend_(m.nota) || 'OTRO';
    if (!comercioInfo[clave]) comercioInfo[clave] = { total: 0, fechas: [] };
    comercioInfo[clave].total += parseFloat(m.monto) || 0;
    comercioInfo[clave].fechas.push(m.fecha);
  });
  const topComercios = Object.entries(comercioInfo).sort((a, b) => b[1].total - a[1].total).slice(0, 10).map(([nombre, info]) => {
    const fechasOrdenadas = info.fechas.slice().sort();
    let frecuenciaDias = null;
    if (fechasOrdenadas.length >= 2) {
      const intervalos = [];
      for (let i = 1; i < fechasOrdenadas.length; i++) {
        intervalos.push((new Date(fechasOrdenadas[i]) - new Date(fechasOrdenadas[i - 1])) / 86400000);
      }
      frecuenciaDias = Math.round(intervalos.reduce((a, b) => a + b, 0) / intervalos.length);
    }
    return { nombre, total: info.total, cantidad: info.fechas.length, frecuenciaDias };
  });
  const maxComercio = topComercios.length ? topComercios[0].total : 1;

  // ── 3. CATEGORÍAS (con desglose de subcategoría) ────────────────────────
  const gastosEUR = movsEUR.filter(m => m.tipo === 'gasto');
  const periodosDisponiblesCategoria = [...new Set(gastosEUR.map(m => claveDePeriodo(m.fecha, granularidadCategoria)))].filter(Boolean).sort().reverse();
  const periodoActivoCategoria = periodoCategoria && periodosDisponiblesCategoria.includes(periodoCategoria) ? periodoCategoria : periodosDisponiblesCategoria[0];
  const mesesConDatosCategoria = [...new Set(gastosEUR.map(m => (m.fecha || '').slice(0, 7)))].filter(Boolean).length || 1;

  const gastosFiltrados = gastosEUR.filter(m => {
    if (granularidadCategoria === 'total' || granularidadCategoria === 'promedio') return true;
    return claveDePeriodo(m.fecha, granularidadCategoria) === periodoActivoCategoria;
  });
  const porCategoria = {};
  const porSubcategoria = {};
  gastosFiltrados.forEach(m => {
    const divisor = granularidadCategoria === 'promedio' ? mesesConDatosCategoria : 1;
    const clave = m.categoria || 'Sin categoría';
    porCategoria[clave] = (porCategoria[clave] || 0) + (parseFloat(m.monto) || 0) / divisor;
    if (!porSubcategoria[clave]) porSubcategoria[clave] = {};
    const subclave = m.subcategoria || '(sin subcategoría)';
    porSubcategoria[clave][subclave] = (porSubcategoria[clave][subclave] || 0) + (parseFloat(m.monto) || 0) / divisor;
  });
  const topCategorias = Object.entries(porCategoria).sort((a, b) => b[1] - a[1]);
  const maxCategoria = topCategorias.length ? topCategorias[0][1] : 1;
  const sinCategoriaCount = movsEUR.filter(m => m.tipo === 'gasto' && !m.categoria).length;

  const gastoCategoriaMesActual = {};
  movsEUR.filter(m => m.tipo === 'gasto' && (m.fecha || '').slice(0, 7) === mesActual).forEach(m => {
    const clave = m.categoria || 'Sin categoría';
    gastoCategoriaMesActual[clave] = (gastoCategoriaMesActual[clave] || 0) + (parseFloat(m.monto) || 0);
  });

  // ── 6. FLUJO ENTRE CUENTAS / TRANSFERENCIAS ─────────────────────────────
  const transferenciasEUR = movsEUR.filter(m => m.tipo === 'transferencia');
  const flujoPorSubcategoria = {};
  transferenciasEUR.forEach(m => {
    const clave = m.subcategoria || 'Sin especificar';
    if (!flujoPorSubcategoria[clave]) flujoPorSubcategoria[clave] = { entrada: 0, salida: 0 };
    const monto = parseFloat(m.monto) || 0;
    if (m.direccion === 'entrada') flujoPorSubcategoria[clave].entrada += monto;
    else flujoPorSubcategoria[clave].salida += monto;
  });
  const aTercerosGasto = movsEUR.filter(m => m.tipo === 'gasto' && m.categoria === 'Transferencias').reduce((s, m) => s + (parseFloat(m.monto) || 0), 0);

  // ── 7. RECURRENCIAS NO MARCADAS COMO SUSCRIPCIÓN ────────────────────────
  const nombresSuscripciones = suscripciones.map(s => (s.nombre || '').toUpperCase());
  const recurrenciasCandidatas = Object.entries(comercioInfo)
    .filter(([nombre, info]) => info.fechas.length >= 2)
    .map(([nombre, info]) => {
      const fechasOrdenadas = info.fechas.slice().sort();
      const intervalos = [];
      for (let i = 1; i < fechasOrdenadas.length; i++) {
        intervalos.push((new Date(fechasOrdenadas[i]) - new Date(fechasOrdenadas[i - 1])) / 86400000);
      }
      const promedioDias = intervalos.reduce((a, b) => a + b, 0) / intervalos.length;
      return { nombre, cantidad: info.fechas.length, promedioDias, montoPromedio: info.total / info.fechas.length };
    })
    .filter(r => r.promedioDias >= 25 && r.promedioDias <= 35 && r.cantidad >= 2)
    .filter(r => !nombresSuscripciones.some(n => n.includes(r.nombre) || r.nombre.includes(n)))
    .sort((a, b) => b.cantidad - a.cantidad);

  // ── 8. SALUD FINANCIERA ──────────────────────────────────────────────────
  const ultimos3 = ahorroNeto.slice(-3);
  let tendenciaSalud = 'estable';
  if (ultimos3.length === 3) {
    if (ultimos3[2].valor > ultimos3[1].valor && ultimos3[1].valor > ultimos3[0].valor) tendenciaSalud = 'mejorando';
    else if (ultimos3[2].valor < ultimos3[1].valor && ultimos3[1].valor < ultimos3[0].valor) tendenciaSalud = 'empeorando';
  }
  const tasaAhorroPromedio3m = ultimos3.length > 0
    ? ultimos3.reduce((s, b) => {
        const ing = porMes[b.mes].ingreso;
        return s + (ing > 0 ? (b.valor / ing) * 100 : 0);
      }, 0) / ultimos3.length
    : 0;
  let calificacionSalud = 'Sin datos suficientes';
  if (ultimos3.length > 0) {
    if (tasaAhorroPromedio3m >= 20) calificacionSalud = 'Excelente';
    else if (tasaAhorroPromedio3m >= 10) calificacionSalud = 'Buena';
    else if (tasaAhorroPromedio3m >= 0) calificacionSalud = 'Ajustada';
    else calificacionSalud = 'En números rojos';
  }

  return (
    <div className="dashboard-grid">

      {/* ── 1. RESUMEN EJECUTIVO ── */}
      <div className="dash-card full">
        <div className="dash-label">📊 Resumen ejecutivo — {mesActual || 'sin datos'}</div>
        {cuentasNoEUR.length > 0 && (
          <div className="entry-meta" style={{ marginBottom: 10 }}>ℹ Excluidas de este análisis (otra moneda): {cuentasNoEUR.join(', ')}</div>
        )}
        {mesesIncompletos.length > 0 && (
          <div className="entry-meta" style={{ color: 'var(--red)', marginBottom: 10 }}>⚠ {mesesIncompletos.length} mes(es) sin cobertura completa de BNP, excluidos de todo este análisis: {mesesIncompletos.join(', ')}</div>
        )}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))', gap: 12, marginBottom: 16 }}>
          <div>
            <div className="entry-meta">Ingreso ({mesActual || '—'})</div>
            <div style={{ fontSize: 22, fontWeight: 600, color: 'var(--green)' }}>{ingresoMesActual.toFixed(2)} €</div>
            {comparacion && <div className="entry-meta">antes: {comparacion.ingresoAnterior.toFixed(2)} €</div>}
          </div>
          <div>
            <div className="entry-meta">Gasto ({mesActual || '—'})</div>
            <div style={{ fontSize: 22, fontWeight: 600, color: 'var(--red)' }}>{gastoMesActual.toFixed(2)} €</div>
            {comparacion && (
              <div className="entry-meta" style={{ color: comparacion.cambioPct === null ? 'var(--ink-soft)' : comparacion.cambioPct > 0 ? 'var(--red)' : 'var(--green)' }}>
                {comparacion.cambioPct !== null ? `${comparacion.cambioPct > 0 ? '+' : ''}${comparacion.cambioPct}% vs mes anterior` : ''}
              </div>
            )}
          </div>
          <div>
            <div className="entry-meta">Ahorro neto ({mesActual || '—'})</div>
            <div style={{ fontSize: 22, fontWeight: 600, color: ahorroMesActual >= 0 ? 'var(--green)' : 'var(--red)' }}>{ahorroMesActual >= 0 ? '+' : ''}{ahorroMesActual.toFixed(2)} €</div>
            <div className="entry-meta">tasa de ahorro: {tasaAhorroMesActual.toFixed(0)}%</div>
          </div>
          <div>
            <div className="entry-meta">Histórico completo ({meses.length} mes(es))</div>
            <div style={{ fontSize: 22, fontWeight: 600, color: ahorroTotalHist >= 0 ? 'var(--green)' : 'var(--red)' }}>{ahorroTotalHist >= 0 ? '+' : ''}{ahorroTotalHist.toFixed(2)} €</div>
            <div className="entry-meta">tasa de ahorro promedio: {tasaAhorroHist.toFixed(0)}%</div>
          </div>
        </div>
      </div>

      {/* ── 8. SALUD FINANCIERA ── */}
      <div className="dash-card full">
        <div className="dash-label">💚 Salud financiera</div>
        <details style={{ marginBottom: 10 }}>
          <summary className="entry-meta" style={{ cursor: 'pointer' }}>¿Cómo se calcula esto?</summary>
          <div className="entry-meta" style={{ marginTop: 6, lineHeight: 1.5 }}>
            La tendencia compara el ahorro neto de los últimos 3 meses completos, mes a mes. La calificación usa tu tasa de ahorro promedio de esos mismos 3 meses: 20%+ excelente, 10-20% buena, 0-10% ajustada, negativa en números rojos. Es una guía orientativa, no un consejo financiero.
          </div>
        </details>
        <div style={{ display: 'flex', gap: 24, flexWrap: 'wrap', alignItems: 'center' }}>
          <div>
            <div className="entry-meta">Calificación (últimos 3 meses)</div>
            <div style={{ fontSize: 20, fontWeight: 600, color: calificacionSalud === 'Excelente' ? 'var(--green)' : calificacionSalud === 'Buena' ? 'var(--accent)' : calificacionSalud === 'Ajustada' ? 'var(--ink-soft)' : calificacionSalud === 'En números rojos' ? 'var(--red)' : 'var(--ink-faint)' }}>
              {calificacionSalud}
            </div>
          </div>
          <div>
            <div className="entry-meta">Tendencia</div>
            <div style={{ fontSize: 20, fontWeight: 600 }}>
              {tendenciaSalud === 'mejorando' ? '📈 Mejorando' : tendenciaSalud === 'empeorando' ? '📉 Empeorando' : '➡ Estable'}
            </div>
          </div>
          <div>
            <div className="entry-meta">Tasa de ahorro promedio (3m)</div>
            <div style={{ fontSize: 20, fontWeight: 600 }}>{tasaAhorroPromedio3m.toFixed(0)}%</div>
          </div>
        </div>
      </div>

      {/* ── 2. EVOLUCIÓN EN EL TIEMPO ── */}
      <div className="dash-card full">
        <div className="dash-label">📈 Evolución en el tiempo</div>
        <details style={{ marginBottom: 10 }}>
          <summary className="entry-meta" style={{ cursor: 'pointer' }}>¿Qué significa este gráfico?</summary>
          <div className="entry-meta" style={{ marginTop: 6, lineHeight: 1.5 }}>
            Ingreso (verde) y gasto (rojo) real de cada mes completo, uno junto al otro para ver la tendencia de ambos a la vez — no acumulado. Solo meses con cobertura completa de BNP, solo cuentas en EUR.
          </div>
        </details>
        {meses.length < 2 ? <div className="empty">Necesitas al menos 2 meses completos para ver la evolución.</div> : (
          <GraficoLineaMultiple
            etiquetas={meses}
            series={[
              { label: 'Ingreso', color: 'var(--green)', puntos: meses.map(m => porMes[m].ingreso) },
              { label: 'Gasto', color: 'var(--red)', puntos: meses.map(m => porMes[m].gasto) },
            ]}
          />
        )}
      </div>

      {/* ── Ahorro neto por mes (mantenido de la versión anterior) ── */}
      <div className="dash-card full">
        <div className="dash-label">Ahorro neto por mes</div>
        <details style={{ marginBottom: 10 }}>
          <summary className="entry-meta" style={{ cursor: 'pointer' }}>¿Qué significa este gráfico?</summary>
          <div className="entry-meta" style={{ marginTop: 6, lineHeight: 1.5 }}>
            Ingreso real menos gasto real de CADA mes, por separado — no acumulado. Un mes en rojo significa que ese mes concreto gastaste más de lo que ingresaste; un mes en verde, que te sobró dinero.
          </div>
        </details>
        {ahorroNeto.length === 0 ? <div className="empty">Ningún mes con cobertura completa de BNP todavía.</div> :
          ahorroNeto.map(b => (
            <div key={b.mes} style={{ marginBottom: 10 }}>
              <div className="dash-row" style={{ borderTop: 'none', paddingBottom: 2 }}>
                <span>{b.mes}</span><span className="entry-meta" style={{ color: b.valor >= 0 ? 'var(--green)' : 'var(--red)' }}>{b.valor >= 0 ? '+' : ''}{b.valor.toFixed(2)} €</span>
              </div>
              <div className="bar-centro">
                <div className="bar-centro-fill" style={{
                  background: b.valor >= 0 ? 'var(--green)' : 'var(--red)',
                  width: `${(Math.abs(b.valor) / maxAbsAhorro) * 50}%`,
                  left: b.valor >= 0 ? '50%' : `${50 - (Math.abs(b.valor) / maxAbsAhorro) * 50}%`,
                }}></div>
              </div>
            </div>
          ))
        }
      </div>

      {/* ── 5. PRESUPUESTOS ── */}
      <div className="dash-card full">
        <div className="dash-label">🎯 Presupuestos por categoría ({mesActual || 'mes actual'})</div>
        <form className="entry-form" onSubmit={guardarPresupuesto} style={{ marginBottom: 14 }}>
          <select value={nuevoPresupuesto.categoria} onChange={e => setNuevoPresupuesto({ ...nuevoPresupuesto, categoria: e.target.value })}>
            <option value="">Categoría</option>
            {Object.keys(CATEGORIAS_TRANSACCIONES).map(c => <option key={c} value={c}>{c}</option>)}
          </select>
          <input type="number" step="0.01" placeholder="Objetivo mensual (€)" value={nuevoPresupuesto.monto_objetivo} onChange={e => setNuevoPresupuesto({ ...nuevoPresupuesto, monto_objetivo: e.target.value })} />
          <button type="submit" disabled={guardandoPresupuesto} className="full">{guardandoPresupuesto ? 'Guardando…' : '+ Definir objetivo'}</button>
        </form>
        {presupuestos.length === 0 ? <div className="empty">Sin objetivos de presupuesto definidos.</div> :
          presupuestos.map(p => {
            const gastado = gastoCategoriaMesActual[p.categoria] || 0;
            const objetivo = parseFloat(p.monto_objetivo) || 0;
            const pct = objetivo > 0 ? Math.round((gastado / objetivo) * 100) : 0;
            const excedido = gastado > objetivo;
            const restante = objetivo - gastado;
            return (
              <div key={p.id} className="meta-row">
                <div className="meta-row-top">
                  <span>{p.categoria} <button className="ghost" style={{ marginLeft: 8, padding: '2px 7px', fontSize: 10 }} disabled={busyPresupuestoId === p.id} onClick={() => borrarPresupuesto(p.id)}>{busyPresupuestoId === p.id ? '…' : 'Borrar'}</button></span>
                  <span className="entry-meta" style={{ color: excedido ? 'var(--red)' : 'var(--ink-soft)' }}>
                    {gastado.toFixed(2)} € / {objetivo.toFixed(2)} € ({pct}%) {excedido ? `· excedido ${Math.abs(restante).toFixed(2)}€` : `· quedan ${restante.toFixed(2)}€`}
                  </span>
                </div>
                <div className="progress-bar"><div className="progress-fill" style={{ width: `${Math.min(100, pct)}%`, background: excedido ? 'var(--red)' : 'var(--accent)' }}></div></div>
              </div>
            );
          })
        }
      </div>

      {/* ── 3. CATEGORÍAS (anillo + subcategorías) ── */}
      <div className="dash-card full">
        <div className="dash-label">🏷 Gasto por categoría {sinCategoriaCount > 0 && <span style={{ color: 'var(--red)' }}>· {sinCategoriaCount} movimiento(s) sin categoría</span>}</div>
        <details style={{ marginBottom: 10 }}>
          <summary className="entry-meta" style={{ cursor: 'pointer' }}>¿Qué significa este gráfico?</summary>
          <div className="entry-meta" style={{ marginTop: 6, lineHeight: 1.5 }}>
            "Transferencias" aquí son envíos reales a otras personas (no entre tus cuentas) — sí cuentan como gasto porque el dinero salió de tu bolsillo. Los créditos/hipoteca tienen categoría "Créditos" separada de "Vivienda", porque son pago de deuda, no consumo. Haz clic en una categoría para ver sus subcategorías.
          </div>
        </details>
        <div style={{ display: 'flex', gap: 6, marginBottom: 14, flexWrap: 'wrap' }}>
          {[['mes', 'Mensual'], ['trimestre', 'Trimestral'], ['año', 'Anual'], ['promedio', 'Promedio/mes'], ['total', 'Total']].map(([val, label]) => (
            <button key={val} className={granularidadCategoria === val ? '' : 'ghost'} onClick={() => { setGranularidadCategoria(val); setPeriodoCategoria(null); }}>{label}</button>
          ))}
          {(granularidadCategoria === 'mes' || granularidadCategoria === 'trimestre' || granularidadCategoria === 'año') && periodosDisponiblesCategoria.length > 0 && (
            <select value={periodoActivoCategoria || ''} onChange={e => setPeriodoCategoria(e.target.value)} style={{ marginLeft: 6 }}>
              {periodosDisponiblesCategoria.map(p => <option key={p} value={p}>{p}</option>)}
            </select>
          )}
        </div>
        {topCategorias.length === 0 ? <div className="empty">Sin datos para este periodo.</div> : (
          <React.Fragment>
            <DonutChart datos={topCategorias} />
            <div style={{ marginTop: 16 }}>
              {topCategorias.map(([nombre, total]) => (
                <div key={nombre} style={{ marginBottom: 10 }}>
                  <div className="dash-row" style={{ borderTop: 'none', paddingBottom: 2, cursor: 'pointer' }} onClick={() => setCategoriaExpandida(categoriaExpandida === nombre ? null : nombre)}>
                    <span>{categoriaExpandida === nombre ? '▾' : '▸'} {nombre}</span>
                    <span className="entry-meta">{total.toFixed(2)} € · {((total / topCategorias.reduce((s, [, v]) => s + v, 0)) * 100).toFixed(0)}%</span>
                  </div>
                  <div className="progress-bar"><div className="progress-fill" style={{ width: `${(total / maxCategoria) * 100}%`, background: nombre === 'Sin categoría' ? 'var(--red)' : 'var(--accent)' }}></div></div>
                  {categoriaExpandida === nombre && porSubcategoria[nombre] && (
                    <div style={{ marginTop: 8, marginLeft: 16, paddingLeft: 10, borderLeft: '2px solid var(--line)' }}>
                      {Object.entries(porSubcategoria[nombre]).sort((a, b) => b[1] - a[1]).map(([sub, val]) => (
                        <div key={sub} className="dash-row" style={{ borderTop: 'none', padding: '3px 0' }}>
                          <span className="entry-meta">{sub}</span><span className="entry-meta">{val.toFixed(2)} €</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              ))}
            </div>
          </React.Fragment>
        )}
      </div>

      {/* ── 4. COMERCIOS + FRECUENCIA ── */}
      <div className="dash-card full">
        <div className="dash-label">🏪 Top 10 comercios por gasto acumulado</div>
        {topComercios.map(c => (
          <div key={c.nombre} style={{ marginBottom: 10 }}>
            <div className="dash-row" style={{ borderTop: 'none', paddingBottom: 2 }}>
              <span>{c.nombre}</span>
              <span className="entry-meta">{c.total.toFixed(2)} € · {c.cantidad}× {c.frecuenciaDias ? `· cada ~${c.frecuenciaDias} días` : ''}</span>
            </div>
            <div className="progress-bar"><div className="progress-fill" style={{ width: `${(c.total / maxComercio) * 100}%` }}></div></div>
          </div>
        ))}
      </div>

      {/* ── 6. FLUJO ENTRE CUENTAS / TRANSFERENCIAS ── */}
      <div className="dash-card full">
        <div className="dash-label">🔀 Flujo entre cuentas y transferencias</div>
        <details style={{ marginBottom: 10 }}>
          <summary className="entry-meta" style={{ cursor: 'pointer' }}>¿Qué significa esto?</summary>
          <div className="entry-meta" style={{ marginTop: 6, lineHeight: 1.5 }}>
            El dinero que se mueve entre tus propias cuentas no es gasto ni ingreso real — pero vale la pena ver cuánto se mueve. Lo que sale hacia terceros (a otras personas, no a tus cuentas) sí es gasto real, y ya está incluido en "Gasto por categoría" bajo "Transferencias".
          </div>
        </details>
        {Object.keys(flujoPorSubcategoria).length === 0 && aTercerosGasto === 0 ? <div className="empty">Sin transferencias registradas.</div> : (
          <React.Fragment>
            {Object.entries(flujoPorSubcategoria).map(([sub, v]) => (
              <div key={sub} className="dash-row">
                <span>{sub}</span>
                <span className="entry-meta">entrada +{v.entrada.toFixed(2)}€ · salida −{v.salida.toFixed(2)}€ · neto {(v.entrada - v.salida >= 0 ? '+' : '')}{(v.entrada - v.salida).toFixed(2)}€</span>
              </div>
            ))}
            {aTercerosGasto > 0 && (
              <div className="dash-row">
                <span>A terceros (gasto real)</span>
                <span className="entry-meta" style={{ color: 'var(--red)' }}>−{aTercerosGasto.toFixed(2)}€</span>
              </div>
            )}
          </React.Fragment>
        )}
      </div>

      {/* ── 7. RECURRENCIAS NO MARCADAS COMO SUSCRIPCIÓN ── */}
      <div className="dash-card full">
        <div className="dash-label">🔁 Posibles recurrencias sin marcar como suscripción</div>
        <details style={{ marginBottom: 10 }}>
          <summary className="entry-meta" style={{ cursor: 'pointer' }}>¿Cómo se detecta esto?</summary>
          <div className="entry-meta" style={{ marginTop: 6, lineHeight: 1.5 }}>
            Comercios donde gastaste 2 o más veces con un intervalo cercano a un mes (25-35 días), que todavía no están en tu lista de Suscripciones. Puede ser una suscripción real que no has registrado, o simplemente un comercio que visitas seguido — revísalo tú.
          </div>
        </details>
        {recurrenciasCandidatas.length === 0 ? <div className="empty">No se detectaron patrones recurrentes sin marcar.</div> :
          recurrenciasCandidatas.map(r => (
            <div key={r.nombre} className="dash-row">
              <span>{r.nombre}</span>
              <span className="entry-meta">{r.cantidad}× · cada ~{Math.round(r.promedioDias)} días · ~{r.montoPromedio.toFixed(2)}€ c/u</span>
            </div>
          ))
        }
      </div>

    </div>
  );
}


function GenericTab({ config }) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [adding, setAdding] = useState(false);
  const [busyId, setBusyId] = useState(null);
  const [showForm, setShowForm] = useState(false);

  function emptyForm() {
    const obj = {};
    config.fields.forEach(field => { obj[field.name] = field.type === 'checkbox' ? false : ''; });
    return obj;
  }
  const [form, setForm] = useState(emptyForm());

  function load() {
    setLoading(true);
    apiCall('list', { sheet: config.key }).then(res => { setItems(Array.isArray(res) ? res : []); setLoading(false); });
  }
  useEffect(load, [config.key]);

  function add(e) {
    e.preventDefault();
    if (adding) return;
    setAdding(true);
    apiCall('create', { sheet: config.key, data: form }).then(() => { setForm(emptyForm()); setAdding(false); setShowForm(false); load(); });
  }

  function remove(id) {
    if (busyId) return;
    setBusyId(id);
    apiCall('delete', { sheet: config.key, id }).then(() => { setBusyId(null); load(); });
  }

  function renderField(field) {
    const value = form[field.name];
    const onChange = e => setForm({ ...form, [field.name]: e.target.value });
    if (field.type === 'select') {
      return (
        <select key={field.name} value={value} onChange={onChange}>
          <option value="">{field.label}</option>
          {field.options.map(o => <option key={o} value={o}>{o}</option>)}
        </select>
      );
    }
    if (field.type === 'checkbox') {
      return (
        <label key={field.name} className="checkbox-field">
          <input type="checkbox" checked={!!value} onChange={e => setForm({ ...form, [field.name]: e.target.checked })} />
          {field.label}
        </label>
      );
    }
    if (field.type === 'multiselect') {
      const seleccionados = (value || '').split(',').filter(Boolean);
      function toggle(opt) {
        const next = seleccionados.includes(opt) ? seleccionados.filter(o => o !== opt) : [...seleccionados, opt];
        setForm({ ...form, [field.name]: next.join(',') });
      }
      return (
        <div key={field.name} className="full multiselect-field">
          <span className="entry-meta">{field.label}</span>
          <div className="multiselect-options">
            {field.options.map(opt => (
              <label key={opt} className="checkbox-field">
                <input type="checkbox" checked={seleccionados.includes(opt)} onChange={() => toggle(opt)} />
                {opt}
              </label>
            ))}
          </div>
        </div>
      );
    }
    return (
      <input key={field.name} type={field.type === 'number' ? 'number' : field.type === 'date' ? 'date' : field.type === 'time' ? 'time' : 'text'}
        step={field.type === 'number' ? '0.01' : undefined}
        placeholder={field.label} value={value} onChange={onChange} />
    );
  }

  return (
    <div>
      <button className={`add-toggle-btn ${showForm ? 'cancel' : ''}`} onClick={() => setShowForm(!showForm)}>
        {showForm ? 'Cancelar' : '+ Añadir'}
      </button>

      {showForm && (
        <form className="entry-form" onSubmit={add}>
          {config.fields.map(renderField)}
          <button type="submit" disabled={adding}>{adding ? 'Añadiendo…' : 'Añadir'}</button>
        </form>
      )}
      {loading ? <div className="empty">Cargando…</div> :
        items.length === 0 ? <div className="empty">Sin registros.</div> :
        <div className="log">
          {items.map((it, i) => (
            <div key={it.id || i} className="entry">
              <div className="entry-main">
                <div className="entry-title">{it[config.fields[0].name] || '(sin título)'}</div>
                <div className="entry-meta">{config.fields.slice(1, 4).map(fld => it[fld.name]).filter(Boolean).join(' · ')}</div>
                {it.progreso_pct !== undefined && it.progreso_pct !== '' && (
                  <div className="progress-bar"><div className="progress-fill" style={{ width: `${Math.min(100, parseFloat(it.progreso_pct) || 0)}%` }}></div></div>
                )}
              </div>
              <div className="entry-actions">
                <button className="ghost" disabled={busyId === it.id} onClick={() => remove(it.id)}>{busyId === it.id ? '…' : 'Borrar'}</button>
              </div>
            </div>
          ))}
        </div>
      }
    </div>
  );
}

function App() {
  const [authed, setAuthed] = useState(!!localStorage.getItem('bitacora_token'));
  const [category, setCategory] = useState('Dashboard');
  const [currentModule, setCurrentModule] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(false);

  if (API_URL.indexOf('PEGA_AQUI') !== -1) {
    return (
      <div className="login-shell">
        <div className="login-card">
          <h1>Falta configurar la API</h1>
          <p>Edita la constante API_URL en el código con la URL /exec de tu Apps Script antes de continuar.</p>
        </div>
      </div>
    );
  }

  if (!authed) return <Login onLogin={() => setAuthed(true)} />;

  function selectCategory(cat) {
    setCategory(cat);
    if (cat === 'Dashboard') {
      setCurrentModule(null);
    } else {
      const mods = modulesForCategory(cat);
      setCurrentModule(mods.length ? mods[0].key : null);
    }
    setSidebarOpen(false);
  }

  function goTo(cat, moduleKey) {
    setCategory(cat);
    setCurrentModule(moduleKey);
  }

  const categoryModules = modulesForCategory(category);
  const genericConfig = MODULES_GENERIC.find(m => m.key === currentModule);
  const activeLabel = currentModule ? (NAV.find(m => m.key === currentModule) || {}).label : category;

  return (
    <div className="shell">
      {sidebarOpen && <div className="backdrop" onClick={() => setSidebarOpen(false)} />}

      <div className={`sidebar ${sidebarOpen ? 'open' : ''}`}>
        <div className="brand"><span className="dot"></span>Bitácora</div>
        {TOP_CATEGORIES.map(cat => {
          const mods = modulesForCategory(cat);
          const isExpanded = category === cat;
          return (
            <div key={cat}>
              <button className={`nav-item ${isExpanded ? 'active' : ''}`} onClick={() => selectCategory(cat)}>
                {cat}
              </button>
              {isExpanded && mods.length > 0 && (
                <div className="nav-sub">
                  {mods.map(m => (
                    <button key={m.key} className={`nav-sub-item ${currentModule === m.key ? 'active' : ''}`}
                      onClick={() => { setCurrentModule(m.key); setSidebarOpen(false); }}>
                      {m.label}
                    </button>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div className="main">
        <div className="topbar-mobile">
          <button className="menu-btn" onClick={() => setSidebarOpen(true)}>☰</button>
          <span style={{ fontFamily: 'Space Grotesk, sans-serif', fontWeight: 600 }}>Bitácora</span>
        </div>

        <div className="content">
          <div className="page-title">{category === 'Dashboard' ? 'Dashboard' : activeLabel}</div>
          <div className="page-sub">
            {category === 'Dashboard' ? 'Resumen general' : category}
          </div>

          {category === 'Dashboard' ? <Dashboard onNavigate={goTo} /> :
            currentModule === 'Agenda' ? <AgendaTab /> :
            currentModule === 'Correo' ? <CorreoTab /> :
            currentModule === 'Tareas' ? <TareasTab /> :
            currentModule === 'Metas' ? <MetasTab /> :
            currentModule === 'Cuentas_Bancarias' ? <CuentasHub /> :
            currentModule === 'Bolsa_Posiciones' ? <BolsaHub /> :
            currentModule === 'Patrimonio_Snapshot' ? <PatrimonioHub /> :
            currentModule === 'AnalisisFinanciero' ? <AnalisisFinancieroTab /> :
            currentModule === 'Transacciones' ? <TransaccionesTab /> :
            genericConfig ? <GenericTab config={genericConfig} /> : null}

          <div className="footer">Bitácora {FRONTEND_VERSION}</div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
