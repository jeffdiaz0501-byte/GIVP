<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Bitácora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDEEE9;
    --surface: #F7F7F3;
    --ink: #1B1F1D;
    --ink-soft: #5B5F58;
    --line: #D8D9D0;
    --teal: #1F5F5B;
    --teal-dark: #133F3C;
    --ochre: #C97D2A;
    --red: #B4432E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
  .brand {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: -0.02em;
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 28px;
  }
  .brand small {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 400;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 24px;
  }
  .login-card { max-width: 360px; margin: 80px auto 0; }
  .login-card h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    margin: 0 0 4px;
  }
  .login-card p { color: var(--ink-soft); font-size: 13px; margin: 0 0 20px; }
  input, select, textarea {
    width: 100%;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: #fff;
    color: var(--ink);
  }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--teal);
    outline-offset: -1px;
  }
  button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    padding: 10px 16px;
    border-radius: 3px;
    border: none;
    background: var(--teal);
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: var(--teal-dark); }
  button.ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  button:disabled { opacity: 0.5; cursor: default; }
  .error-msg { color: var(--red); font-size: 13px; margin-top: 10px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
  .tab {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 10px 14px;
    cursor: pointer;
    color: var(--ink-soft);
    border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--teal-dark); border-bottom-color: var(--teal); }
  .entry-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  .entry-form .full { grid-column: 1 / -1; }
  .entry-form button { grid-column: 1 / -1; }
  .log { display: flex; flex-direction: column; gap: 8px; }
  .entry {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--teal);
    border-radius: 3px;
  }
  .entry.done { border-left-color: var(--line); opacity: 0.55; }
  .entry.gasto { border-left-color: var(--red); }
  .entry.ingreso { border-left-color: var(--teal); }
  .entry-main { flex: 1; }
  .entry-title { font-size: 14px; font-weight: 500; }
  .entry-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 3px;
  }
  .entry-amount {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 500;
  }
  .entry-actions { display: flex; gap: 6px; }
  .entry-actions button { padding: 5px 9px; font-size: 11px; }
  .empty { color: var(--ink-soft); font-size: 13px; padding: 20px 0; text-align: center; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .logbook-no {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    min-width: 34px;
  }
  .footer {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: center;
    margin-top: 40px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

// EDITA ESTA LÍNEA con la URL /exec de tu Apps Script
const API_URL = 'PEGA_AQUI_TU_URL_DE_APPS_SCRIPT';
const FRONTEND_VERSION = 'v1.0.1';

const CATEGORIAS_TAREAS = ['Trabajo', 'Personal', 'Hogar', 'Salud', 'Finanzas', 'Ocio', 'Estudio', 'Otro'];

function apiCall(action, extra) {
  const token = localStorage.getItem('bitacora_token');
  return fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(Object.assign({ action, token }, extra)),
  }).then(r => r.json());
}

function Login({ onLogin }) {
  const [password, setPassword] = useState('');
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(false);

  function submit(e) {
    e.preventDefault();
    setLoading(true);
    setError(null);
    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'login', password }),
    })
      .then(r => r.json())
      .then(res => {
        setLoading(false);
        if (res.token) {
          localStorage.setItem('bitacora_token', res.token);
          onLogin();
        } else if (res.error === 'locked') {
          setError(`Bloqueado. Intenta en ${res.minutesLeft} min.`);
        } else {
          setError('Contraseña incorrecta.');
        }
      })
      .catch(() => { setLoading(false); setError('No se pudo conectar.'); });
  }

  return (
    <div className="wrap">
      <div className="card login-card">
        <h1>Bitácora</h1>
        <p>Registro personal — acceso privado</p>
        <form onSubmit={submit}>
          <input
            type="password"
            placeholder="Contraseña"
            value={password}
            onChange={e => setPassword(e.target.value)}
            autoFocus
          />
          <div style={{ height: 12 }} />
          <button type="submit" disabled={loading}>{loading ? 'Entrando...' : 'Entrar'}</button>
        </form>
        {error && <div className="error-msg">{error}</div>}
      </div>
    </div>
  );
}

function TareasTab() {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState({ titulo: '', categoria: '', prioridad: 'media', fecha_limite: '' });

  function load() {
    setLoading(true);
    apiCall('getTareas').then(res => { setItems(res || []); setLoading(false); });
  }
  useEffect(load, []);

  function addTarea(e) {
    e.preventDefault();
    if (!form.titulo) return;
    apiCall('addTarea', { data: form }).then(() => {
      setForm({ titulo: '', categoria: '', prioridad: 'media', fecha_limite: '' });
      load();
    });
  }

  function toggleEstado(item) {
    const nuevoEstado = item.estado === 'hecha' ? 'pendiente' : 'hecha';
    apiCall('updateTarea', { data: { id: item.id, estado: nuevoEstado } }).then(load);
  }

  function remove(id) {
    apiCall('deleteTarea', { id }).then(load);
  }

  return (
    <div>
      <form className="entry-form" onSubmit={addTarea}>
        <input className="full" placeholder="Título de la tarea" value={form.titulo}
          onChange={e => setForm({ ...form, titulo: e.target.value })} />
        <select value={form.categoria} onChange={e => setForm({ ...form, categoria: e.target.value })}>
          <option value="">Sin categoría</option>
          {CATEGORIAS_TAREAS.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
        <select value={form.prioridad} onChange={e => setForm({ ...form, prioridad: e.target.value })}>
          <option value="baja">Prioridad baja</option>
          <option value="media">Prioridad media</option>
          <option value="alta">Prioridad alta</option>
        </select>
        <input type="date" value={form.fecha_limite}
          onChange={e => setForm({ ...form, fecha_limite: e.target.value })} />
        <button type="submit">Añadir tarea</button>
      </form>

      {loading ? <div className="empty">Cargando…</div> :
        items.length === 0 ? <div className="empty">No hay tareas registradas.</div> :
        <div className="log">
          {items.map((it, i) => (
            <div key={it.id} className={`entry ${it.estado === 'hecha' ? 'done' : ''}`}>
              <span className="logbook-no">{String(i + 1).padStart(3, '0')}</span>
              <div className="entry-main">
                <div className="entry-title">{it.titulo}</div>
                <div className="entry-meta">
                  {it.categoria || 'sin categoría'} · {it.prioridad} {it.fecha_limite && `· vence ${it.fecha_limite}`}
                </div>
              </div>
              <div className="entry-actions">
                <button className="ghost" onClick={() => toggleEstado(it)}>
                  {it.estado === 'hecha' ? 'Reabrir' : 'Hecha'}
                </button>
                <button className="ghost" onClick={() => remove(it.id)}>Borrar</button>
              </div>
            </div>
          ))}
        </div>
      }
    </div>
  );
}

function TransaccionesTab() {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState({ tipo: 'gasto', categoria: '', monto: '', cuenta: '', nota: '' });

  function load() {
    setLoading(true);
    apiCall('getTransacciones').then(res => { setItems(res || []); setLoading(false); });
  }
  useEffect(load, []);

  function addTransaccion(e) {
    e.preventDefault();
    if (!form.monto) return;
    apiCall('addTransaccion', { data: form }).then(() => {
      setForm({ tipo: 'gasto', categoria: '', monto: '', cuenta: '', nota: '' });
      load();
    });
  }

  function remove(id) {
    apiCall('deleteTransaccion', { id }).then(load);
  }

  const balance = items.reduce((acc, it) => {
    const monto = parseFloat(it.monto) || 0;
    return acc + (it.tipo === 'ingreso' ? monto : -monto);
  }, 0);

  return (
    <div>
      <div className="topbar">
        <span className="entry-meta">Balance registrado</span>
        <span className="entry-amount" style={{ color: balance >= 0 ? 'var(--teal-dark)' : 'var(--red)' }}>
          {balance.toFixed(2)} €
        </span>
      </div>

      <form className="entry-form" onSubmit={addTransaccion}>
        <select value={form.tipo} onChange={e => setForm({ ...form, tipo: e.target.value })}>
          <option value="gasto">Gasto</option>
          <option value="ingreso">Ingreso</option>
        </select>
        <input type="number" step="0.01" placeholder="Monto" value={form.monto}
          onChange={e => setForm({ ...form, monto: e.target.value })} />
        <input placeholder="Categoría" value={form.categoria}
          onChange={e => setForm({ ...form, categoria: e.target.value })} />
        <input placeholder="Cuenta" value={form.cuenta}
          onChange={e => setForm({ ...form, cuenta: e.target.value })} />
        <input className="full" placeholder="Nota (opcional)" value={form.nota}
          onChange={e => setForm({ ...form, nota: e.target.value })} />
        <button type="submit">Añadir movimiento</button>
      </form>

      {loading ? <div className="empty">Cargando…</div> :
        items.length === 0 ? <div className="empty">No hay movimientos registrados.</div> :
        <div className="log">
          {items.map((it, i) => (
            <div key={it.id} className={`entry ${it.tipo}`}>
              <span className="logbook-no">{String(i + 1).padStart(3, '0')}</span>
              <div className="entry-main">
                <div className="entry-title">{it.categoria || it.nota || 'Sin categoría'}</div>
                <div className="entry-meta">{it.fecha} · {it.cuenta || 'sin cuenta'}</div>
              </div>
              <span className="entry-amount">
                {it.tipo === 'gasto' ? '-' : '+'}{parseFloat(it.monto || 0).toFixed(2)} €
              </span>
              <div className="entry-actions">
                <button className="ghost" onClick={() => remove(it.id)}>Borrar</button>
              </div>
            </div>
          ))}
        </div>
      }
    </div>
  );
}

function App() {
  const [authed, setAuthed] = useState(!!localStorage.getItem('bitacora_token'));
  const [tab, setTab] = useState('tareas');

  if (!authed) return <Login onLogin={() => setAuthed(true)} />;

  return (
    <div className="wrap">
      <div className="brand">Bitácora <small>registro personal</small></div>
      <div className="tabs">
        <div className={`tab ${tab === 'tareas' ? 'active' : ''}`} onClick={() => setTab('tareas')}>Tareas</div>
        <div className={`tab ${tab === 'transacciones' ? 'active' : ''}`} onClick={() => setTab('transacciones')}>Transacciones</div>
      </div>
      {tab === 'tareas' ? <TareasTab /> : <TransaccionesTab />}
      <div className="footer">Bitácora {FRONTEND_VERSION}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
