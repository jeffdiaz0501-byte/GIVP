function OrganizadorAgendaTab() {
  const [proyectos, setProyectos] = useState(null);
  const [disponibilidad, setDisponibilidad] = useState([]);
  const [sueno, setSueno] = useState([]);
  const [actividadesDeporte, setActividadesDeporte] = useState([]);
  const [actividadesOcio, setActividadesOcio] = useState([]);
  const [generando, setGenerando] = useState(false);
  const [resultadoGeneracion, setResultadoGeneracion] = useState(null);
  const [vistaPrevia, setVistaPrevia] = useState(null);
  const [cargandoVista, setCargandoVista] = useState(false);

  function load() {
    apiCall('list', { sheet: 'Proyectos' }).then(res => setProyectos(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Disponibilidad' }).then(res => setDisponibilidad(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Sueno' }).then(res => setSueno(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Actividades_Deporte' }).then(res => setActividadesDeporte(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Actividades_Ocio' }).then(res => setActividadesOcio(Array.isArray(res) ? res : []));
  }
  useEffect(load, []);

  function actualizarPorcentaje(id, valor) {
    apiCall('update', { sheet: 'Proyectos', data: { id, porcentaje_tiempo: valor } }).then(load);
  }

  function verVistaPrevia() {
    if (cargandoVista) return;
    setCargandoVista(true);
    setVistaPrevia(null);
    apiCall('generarEventosProyectos', { soloVista: true }).then(res => { setVistaPrevia(res); setCargandoVista(false); });
  }

  function generarEventos() {
    if (generando) return;
    if (!window.confirm('Esto va a crear eventos nuevos en tu Google Calendar para este mes. ¿Continuar?')) return;
    setGenerando(true);
    setResultadoGeneracion(null);
    apiCall('generarEventosProyectos', {}).then(res => { setResultadoGeneracion(res); setGenerando(false); });
  }

  if (!proyectos) return <div className="empty">Cargando…</div>;

  const horasOcupacionProfesional = disponibilidad.reduce((s, d) => s + (parseFloat(d.horas_semana) || 0), 0);
  const conObjetivoSueno = sueno.filter(e => e.horas_objetivo).slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
  const objetivoSuenoDiario = conObjetivoSueno.length > 0 ? parseFloat(conObjetivoSueno[0].horas_objetivo) || 0 : 0;
  const horasSueno = objetivoSuenoDiario * 7;
  const horasDeporte = actividadesDeporte.filter(a => a.estado === 'Activo').reduce((s, a) => s + (parseFloat(a.horas_objetivo_semanales) || 0), 0);
  const horasOcio = actividadesOcio.filter(a => a.estado === 'Activo').reduce((s, a) => s + (parseFloat(a.horas_objetivo_semanales) || 0), 0);

  const horasComprometidasTotal = horasOcupacionProfesional + horasSueno + horasDeporte + horasOcio;
  const horasLibresSemana = Math.max(0, 168 - horasComprometidasTotal);

  const proyectosActivos = proyectos.filter(p => p.estado === 'Activo');
  const sumaPesosIdeales = proyectosActivos.reduce((s, p) => s + (parseFloat(p.porcentaje_tiempo) || 0), 0);

  return (
    <div className="dashboard-grid">
      <div className="dash-card full">
        <div className="dash-label">📅 Organizador de agenda — distribución semanal (168 h)</div>
        <details style={{ marginBottom: 10 }}>
          <summary className="entry-meta" style={{ cursor: 'pointer' }}>¿Cómo se calcula esto?</summary>
          <div className="entry-meta" style={{ marginTop: 6, lineHeight: 1.5 }}>
            De las 168 horas de la semana se reservan, en este orden: Ocupación profesional (Disponibilidad), Sueño, Deporte y Ocio — cada uno con su objetivo editable en su propia pestaña. Lo que sobra son tus horas libres reales, que repartes por % entre tus proyectos activos.
          </div>
        </details>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))', gap: 12, marginBottom: 16 }}>
          <div><div className="entry-meta">Ocupación profesional</div><div style={{ fontSize: 18, fontWeight: 600 }}>{horasOcupacionProfesional.toFixed(1)} h</div></div>
          <div><div className="entry-meta">Sueño</div><div style={{ fontSize: 18, fontWeight: 600 }}>{horasSueno.toFixed(1)} h</div></div>
          <div><div className="entry-meta">Deporte</div><div style={{ fontSize: 18, fontWeight: 600 }}>{horasDeporte.toFixed(1)} h</div></div>
          <div><div className="entry-meta">Ocio</div><div style={{ fontSize: 18, fontWeight: 600 }}>{horasOcio.toFixed(1)} h</div></div>
          <div><div className="entry-meta">Libres para proyectos</div><div style={{ fontSize: 18, fontWeight: 600, color: 'var(--accent)' }}>{horasLibresSemana.toFixed(1)} h</div></div>
        </div>
      </div>

      <div className="dash-card full">
        <div className="dash-label">🎯 Reparto entre proyectos activos</div>
        <details style={{ marginBottom: 10 }}>
          <summary className="entry-meta" style={{ cursor: 'pointer' }}>¿Qué es "ideal" vs "real"?</summary>
          <div className="entry-meta" style={{ marginTop: 6, lineHeight: 1.5 }}>
            El % que escribes es un peso ideal, no un porcentaje directo — no tienes que preocuparte de que sumen exactamente 100%. El sistema calcula solo el % real: tu peso dividido entre la suma de todos los pesos activos, así siempre se usa el 100% de tus horas libres, repartido según tus prioridades relativas.
          </div>
        </details>
        {proyectosActivos.length === 0 ? <div className="empty">Sin proyectos activos — ve a Proyectos para crear o activar alguno.</div> : (
          <React.Fragment>
            <div className="entry-meta" style={{ marginBottom: 10 }}>Suma de pesos ideales: {sumaPesosIdeales}</div>
            {proyectosActivos.map(p => {
              const pesoIdeal = parseFloat(p.porcentaje_tiempo) || 0;
              const porcentajeReal = sumaPesosIdeales > 0 ? (pesoIdeal / sumaPesosIdeales) * 100 : 0;
              const horasAsignadas = horasLibresSemana * porcentajeReal / 100;
              return (
                <div key={p.id} className="dash-row">
                  <span>{p.nombre}</span>
                  <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <input type="number" min="0" value={p.porcentaje_tiempo || ''} onChange={e => actualizarPorcentaje(p.id, e.target.value)} style={{ width: 55 }} />
                    <span className="entry-meta">ideal → <strong style={{ color: 'var(--accent)' }}>{porcentajeReal.toFixed(0)}% real</strong> · {horasAsignadas.toFixed(1)} h/semana</span>
                  </span>
                </div>
              );
            })}
          </React.Fragment>
        )}
      </div>

      <div className="dash-card full">
        <div className="dash-label">🗓 Generar en Google Calendar</div>
        <div style={{ marginBottom: 16, display: 'flex', gap: 10, flexWrap: 'wrap' }}>
          <button className="ghost" onClick={verVistaPrevia} disabled={cargandoVista || proyectosActivos.length === 0}>
            {cargandoVista ? 'Calculando…' : '👁 Ver vista previa del mes'}
          </button>
          <button onClick={generarEventos} disabled={generando || proyectosActivos.length === 0}>
            {generando ? 'Generando…' : '📅 Generar eventos de este mes en Google Calendar'}
          </button>
        </div>
        {vistaPrevia && (
          <div style={{ marginBottom: 16, padding: 12, border: '1px solid var(--line)', borderRadius: 8 }}>
            <div className="entry-meta" style={{ marginBottom: 8, fontWeight: 600 }}>Vista previa — nada de esto está creado todavía en tu calendario:</div>
            {vistaPrevia.detalle && vistaPrevia.detalle.length > 0 ? (
              Object.entries(
                vistaPrevia.detalle.reduce((acc, ev) => {
                  const dia = new Date(ev.inicio).toLocaleDateString('es-ES', { weekday: 'short', day: '2-digit', month: '2-digit' });
                  (acc[dia] = acc[dia] || []).push(ev);
                  return acc;
                }, {})
              ).map(([dia, evs]) => (
                <div key={dia} className="dash-row">
                  <span>{dia}</span>
                  <span className="entry-meta">{evs.map(e => e.proyecto + ' (' + new Date(e.inicio).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) + '-' + new Date(e.fin).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) + ')').join(', ')}</span>
                </div>
              ))
            ) : <div className="empty">Sin sesiones calculadas.</div>}
            {vistaPrevia.avisos && vistaPrevia.avisos.length > 0 && (
              <div style={{ color: 'var(--red)', marginTop: 8 }}>{vistaPrevia.avisos.map((a, i) => <div key={i} className="entry-meta">⚠ {a}</div>)}</div>
            )}
          </div>
        )}
        {resultadoGeneracion && (
          <div className="entry-meta">
            {resultadoGeneracion.eventosCreados} evento(s) creado(s) de verdad en tu calendario.
            {resultadoGeneracion.avisos && resultadoGeneracion.avisos.length > 0 && (
              <div style={{ color: 'var(--red)', marginTop: 4 }}>{resultadoGeneracion.avisos.map((a, i) => <div key={i}>⚠ {a}</div>)}</div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState({ nombre: '', banco: '', tipo: 'corriente', dia_relave_desde: '', dia_relave_hasta: '', saldo_manual: '', fecha_saldo_manual: '', nota: '', moneda: 'EUR' });
  const [adding, setAdding] = useState(false);
  const [busyId, setBusyId] = useState(null);
  const [uploadingId, setUploadingId] = useState(null);
  const [textoExtraido, setTextoExtraido] = useState({});
  const [showForm, setShowForm] = useState(false);
  const [expandedId, setExpandedId] = useState(null);
  const [historialAbiertoId, setHistorialAbiertoId] = useState(null);
  const [editForm, setEditForm] = useState({});
  const [savingEdit, setSavingEdit] = useState(false);
  const [releves, setReleves] = useState([]);
  const [saldos, setSaldos] = useState([]);
  const [movimientosCuentas, setMovimientosCuentas] = useState([]);
  const [montoSaldo, setMontoSaldo] = useState({});
  const [registrandoSaldo, setRegistrandoSaldo] = useState(null);
  const [reparando, setReparando] = useState(false);
  const [resultadoReparacion, setResultadoReparacion] = useState(null);

  function repararMeses() {
    setReparando(true);
    apiCall('repararMesesReleves', {}).then(res => {
      setReparando(false);
      if (res && !res.error) {
        setResultadoReparacion(`✓ ${res.reparadas} relevé(s) reparado(s)`);
        load();
      }
      setTimeout(() => setResultadoReparacion(null), 6000);
    });
  }

  function load() {
    setLoading(true);
    apiCall('list', { sheet: 'Cuentas_Bancarias' }).then(res => { setItems(Array.isArray(res) ? res : []); setLoading(false); });
    apiCall('list', { sheet: 'Releves_Subidos' }).then(res => setReleves(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Saldos_Registrados' }).then(res => setSaldos(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Transacciones' }).then(res => setMovimientosCuentas(Array.isArray(res) ? res : []));
  }
  useEffect(load, []);

  function registrarSaldo(cuentaId) {
    const monto = montoSaldo[cuentaId];
    if (!monto || registrandoSaldo) return;
    setRegistrandoSaldo(cuentaId);
    apiCall('create', { sheet: 'Saldos_Registrados', data: { cuenta_id: cuentaId, saldo: monto, nota: '' } }).then(() => {
      setMontoSaldo({ ...montoSaldo, [cuentaId]: '' });
      setRegistrandoSaldo(null);
      load();
    });
  }

  function calcularVerificacionSaldos(cuentaNombre, saldosCuenta) {
    const ordenados = saldosCuenta.slice().sort((a, b) => new Date(a.fecha_registro) - new Date(b.fecha_registro));
    return ordenados.map((s, idx) => {
      if (idx === 0) return { ...s, verif: null };
      const anterior = ordenados[idx - 1];
      const movs = movimientosCuentas.filter(m => m.cuenta === cuentaNombre && m.fecha > anterior.fecha_registro && m.fecha <= s.fecha_registro);
      const cambio = movs.reduce((acc, m) => {
        const monto = parseFloat(m.monto) || 0;
        if (m.tipo === 'ingreso') return acc + monto;
        if (m.tipo === 'gasto') return acc - monto;
        if (m.tipo === 'transferencia') return acc + (m.direccion === 'entrada' ? monto : -monto);
        return acc;
      }, 0);
      const calculado = Math.round((parseFloat(anterior.saldo) + cambio) * 100) / 100;
      const coincide = Math.abs(calculado - parseFloat(s.saldo)) < 0.5;
      return { ...s, verif: { calculado, coincide } };
    });
  }

  function addCuenta(e) {
    e.preventDefault();
    if (!form.nombre || adding) return;
    setAdding(true);
    apiCall('create', { sheet: 'Cuentas_Bancarias', data: form }).then(() => {
      setForm({ nombre: '', banco: '', tipo: 'corriente', dia_relave_desde: '', dia_relave_hasta: '', saldo_manual: '', fecha_saldo_manual: '', nota: '', moneda: 'EUR' });
      setAdding(false);
      setShowForm(false);
      load();
    });
  }

  function remove(id) {
    if (busyId) return;
    setBusyId(id);
    apiCall('delete', { sheet: 'Cuentas_Bancarias', id }).then(() => { setBusyId(null); load(); });
  }

  function abrirCuenta(it) {
    if (expandedId === it.id) { setExpandedId(null); return; }
    setExpandedId(it.id);
    setEditForm({ nombre: it.nombre, banco: it.banco, tipo: it.tipo, dia_relave_desde: it.dia_relave_desde, dia_relave_hasta: it.dia_relave_hasta, saldo_manual: it.saldo_manual, fecha_saldo_manual: it.fecha_saldo_manual, nota: it.nota, moneda: it.moneda || 'EUR' });
  }

  function guardarEdicion(id) {
    setSavingEdit(true);
    apiCall('update', { sheet: 'Cuentas_Bancarias', data: { id, ...editForm } }).then(() => { setSavingEdit(false); load(); });
  }

  function subirArchivo(cuentaId, file, forzar) {
    if (!file) return;
    setUploadingId(cuentaId);
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = reader.result.split(',')[1];
      apiCall('subirReleve', { cuentaId, filename: file.name, mimeType: file.type, base64, forzar: !!forzar }).then(res => {
        setUploadingId(null);
        if (res && res.error === 'mes_ya_subido') {
          const meses = ['', 'enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
          const [anio, mesNum] = res.mesDetectado.split('-');
          const nombreMes = meses[parseInt(mesNum, 10)] + ' ' + anio;
          const confirmar = window.confirm(`Ya hay un relevé subido para ${nombreMes} en esta cuenta (${res.releveExistente.movimientos_importados} movimientos). ¿Subir de todas formas? (se añadirá como un relevé más, sin borrar el anterior)`);
          if (confirmar) subirArchivo(cuentaId, file, true);
          return;
        }
        if (res && !res.error) {
          const nuevasSusc = res.nuevasSuscripciones && res.nuevasSuscripciones.length
            ? ` · nuevas suscripciones detectadas: ${res.nuevasSuscripciones.join(', ')}`
            : '';
          const v = res.verificacion;
          const verifTexto = v
            ? ` · saldo ${v.soldeInicial.toFixed(2)}€ → ${v.soldeFinal.toFixed(2)}€ ${v.coincide ? '✓ cuadra' : '✕ NO cuadra (calculado ' + v.calculado.toFixed(2) + '€)'}`
            : '';
          const vt = res.verificacionTotal;
          const verifTotalTexto = vt
            ? (vt.coincide !== null
                ? `\nVerificación independiente contra el total del relevé — Débito: interpretado ${vt.debitCalculado.toFixed(2)}€ vs declarado ${vt.debitDeclarado.toFixed(2)}€ · Crédito: interpretado ${vt.creditCalculado.toFixed(2)}€ vs declarado ${vt.creditDeclarado.toFixed(2)}€ ${vt.coincide ? '✓ coincide exacto' : '✕ NO COINCIDE — revisar'}`
                : `\nTotal calculado por el sistema (este banco no declara un total propio para comparar) — Débito: ${vt.debitCalculado.toFixed(2)}€ · Crédito: ${vt.creditCalculado.toFixed(2)}€`)
            : '';
          let diagTexto = '';
          if (res.movimientosImportados === 0 && res.diagnostico) {
            const d = res.diagnostico;
            diagTexto = `\nDIAGNÓSTICO — banco registrado: "${d.bancoRegistrado}" · líneas totales: ${d.totalLineas} · líneas tipo transacción Bourso: ${d.lineasTransaccionBourso} · líneas fecha sola BNP: ${d.lineasFechaSolaBNP} · líneas fecha sola Bourso: ${d.lineasFechaSolaBourso} · líneas monto: ${d.lineasMonto}`;
          }
          setTextoExtraido({
            ...textoExtraido,
            [cuentaId]: {
              resumen: `✓ ${res.movimientosImportados} movimientos importados (${res.mesDetectado || 'mes no detectado'}) · ${res.totalGastos.toFixed(2)} € gastos · ${res.totalIngresos.toFixed(2)} € ingresos${nuevasSusc}${verifTexto}${verifTotalTexto}${diagTexto}`,
              texto: res.texto,
            },
          });
          load();
        } else if (res && res.error === 'respuesta_invalida') {
          // Confirmado con casos reales: cuando esto pasa, el relevé a veces
          // sí se guardó bien en el Sheet — la respuesta llegó rota, no el
          // procesamiento. Recargar de inmediato para que se vea el estado
          // real en vez de dejar solo un mensaje de error que asusta.
          setTextoExtraido({ ...textoExtraido, [cuentaId]: { resumen: '⚠ La respuesta del servidor llegó incompleta, pero es posible que el relevé sí se haya guardado — revisando el historial…', texto: '' } });
          load();
        } else {
          setTextoExtraido({ ...textoExtraido, [cuentaId]: { resumen: 'Error: ' + ((res && res.message) || 'no se pudo procesar el archivo.'), texto: '' } });
        }
      });
    };
    reader.readAsDataURL(file);
  }

  return (
    <div>
      <button className={`add-toggle-btn ${showForm ? 'cancel' : ''}`} onClick={() => setShowForm(!showForm)}>
        {showForm ? 'Cancelar' : '+ Añadir cuenta'}
      </button>
      <button className="add-toggle-btn" disabled={reparando} onClick={repararMeses} style={{ marginLeft: 8 }}>
        {reparando ? 'Reparando…' : '🔧 Reparar meses corruptos'}
      </button>
      {resultadoReparacion && <div className="entry-meta" style={{ marginTop: 8, color: 'var(--accent)' }}>{resultadoReparacion}</div>}

      {showForm && (
        <form className="entry-form" onSubmit={addCuenta}>
          <input placeholder="Nombre de la cuenta" value={form.nombre} onChange={e => setForm({ ...form, nombre: e.target.value })} />
          <input placeholder="Banco" value={form.banco} onChange={e => setForm({ ...form, banco: e.target.value })} />
          <select value={form.tipo} onChange={e => setForm({ ...form, tipo: e.target.value })}>
            <option value="corriente">Corriente</option>
            <option value="ahorro">Ahorro</option>
          </select>
          <select value={form.moneda} onChange={e => setForm({ ...form, moneda: e.target.value })}>
            <option value="EUR">EUR (€)</option>
            <option value="COP">COP ($)</option>
            <option value="USD">USD ($)</option>
          </select>
          <input type="number" min="1" max="31" placeholder="Día relevé desde" value={form.dia_relave_desde} onChange={e => setForm({ ...form, dia_relave_desde: e.target.value })} />
          <input type="number" min="1" max="31" placeholder="Día relevé hasta" value={form.dia_relave_hasta} onChange={e => setForm({ ...form, dia_relave_hasta: e.target.value })} />
          <input className="full" placeholder="Nota (opcional)" value={form.nota} onChange={e => setForm({ ...form, nota: e.target.value })} />
          <button type="submit" disabled={adding}>{adding ? 'Añadiendo…' : 'Añadir cuenta'}</button>
        </form>
      )}

      {loading ? <div className="empty">Cargando…</div> :
        items.length === 0 ? <div className="empty">Sin cuentas registradas.</div> :
        items.map(it => {
          const isOpen = expandedId === it.id;
          const historialAbierto = historialAbiertoId === it.id;
          const relevesCuenta = releves.filter(r => r.cuenta_id === it.id).sort((a, b) => new Date(b.fecha_subida) - new Date(a.fecha_subida));
          const saldosCuentaResumen = saldos.filter(s => s.cuenta_id === it.id);
          const ultimoSaldoConocido = saldosCuentaResumen.length
            ? saldosCuentaResumen.reduce((max, s) => new Date(s.fecha_registro) > new Date(max.fecha_registro) ? s : max, saldosCuentaResumen[0])
            : null;
          const simboloMon = (it.moneda || 'EUR') === 'EUR' ? '€' : (it.moneda || 'EUR');
          return (
            <div key={it.id} className="account-row">
              <div className="account-row-top">
                <div className="entry-main">
                  <div className="entry-title">{it.nombre} {it.banco && `· ${it.banco}`}</div>
                  <div className="entry-meta">
                    {it.tipo} · relevé esperado días {it.dia_relave_desde || '?'}-{it.dia_relave_hasta || '?'} · último subido: {it.ultima_fecha_relave || 'nunca'} · {relevesCuenta.length} relevé(s) en historial
                    {ultimoSaldoConocido && (
                      <React.Fragment><br />Saldo conocido: {parseFloat(ultimoSaldoConocido.saldo).toFixed(2)} {simboloMon} (al {ultimoSaldoConocido.fecha_registro})</React.Fragment>
                    )}
                  </div>
                </div>
                <div className="entry-actions">
                  <button className="ghost" onClick={() => setHistorialAbiertoId(historialAbierto ? null : it.id)}>{historialAbierto ? 'Cerrar historial' : 'Historial'}</button>
                  <button className="ghost" onClick={() => abrirCuenta(it)}>{isOpen ? 'Cerrar edición' : 'Editar'}</button>
                  <button className="ghost" disabled={busyId === it.id} onClick={() => remove(it.id)}>{busyId === it.id ? '…' : 'Borrar'}</button>
                </div>
              </div>

              <div className="account-upload" style={{ marginTop: 10 }}>
                <input type="file" accept="application/pdf,image/*" disabled={uploadingId === it.id}
                  onChange={e => subirArchivo(it.id, e.target.files[0])} />
                {uploadingId === it.id && <span className="entry-meta">Procesando…</span>}
              </div>

              <div className="account-upload" style={{ marginTop: 8 }}>
                <input type="number" step="0.01" placeholder="Registrar saldo actual (€)" style={{ maxWidth: 200 }}
                  value={montoSaldo[it.id] || ''} onChange={e => setMontoSaldo({ ...montoSaldo, [it.id]: e.target.value })} />
                <button className="ghost" disabled={registrandoSaldo === it.id} onClick={() => registrarSaldo(it.id)}>
                  {registrandoSaldo === it.id ? 'Guardando…' : '+ Registrar saldo de hoy'}
                </button>
              </div>

              {textoExtraido[it.id] && (
                <div style={{ marginTop: 8 }}>
                  <div className="entry-meta" style={{ color: 'var(--accent)', whiteSpace: 'pre-wrap' }}>{textoExtraido[it.id].resumen}</div>
                  {textoExtraido[it.id].texto && (
                    <details>
                      <summary className="entry-meta" style={{ cursor: 'pointer' }}>Ver texto completo extraído</summary>
                      <div className="ocr-preview">{textoExtraido[it.id].texto}</div>
                    </details>
                  )}
                </div>
              )}

              {isOpen && (
                <div className="account-row-editform">
                  <input placeholder="Nombre" value={editForm.nombre || ''} onChange={e => setEditForm({ ...editForm, nombre: e.target.value })} />
                  <input placeholder="Banco" value={editForm.banco || ''} onChange={e => setEditForm({ ...editForm, banco: e.target.value })} />
                  <select value={editForm.tipo || 'corriente'} onChange={e => setEditForm({ ...editForm, tipo: e.target.value })}>
                    <option value="corriente">Corriente</option>
                    <option value="ahorro">Ahorro</option>
                  </select>
                  <select value={editForm.moneda || 'EUR'} onChange={e => setEditForm({ ...editForm, moneda: e.target.value })}>
                    <option value="EUR">EUR (€)</option>
                    <option value="COP">COP ($)</option>
                    <option value="USD">USD ($)</option>
                  </select>
                  <div></div>
                  <input type="number" min="1" max="31" placeholder="Día relevé desde" value={editForm.dia_relave_desde || ''} onChange={e => setEditForm({ ...editForm, dia_relave_desde: e.target.value })} />
                  <input type="number" min="1" max="31" placeholder="Día relevé hasta" value={editForm.dia_relave_hasta || ''} onChange={e => setEditForm({ ...editForm, dia_relave_hasta: e.target.value })} />
                  <input className="full" placeholder="Nota" value={editForm.nota || ''} onChange={e => setEditForm({ ...editForm, nota: e.target.value })} />
                  <button disabled={savingEdit} onClick={() => guardarEdicion(it.id)}>{savingEdit ? 'Guardando…' : 'Guardar cambios'}</button>
                </div>
              )}

              {historialAbierto && (
                <React.Fragment>
                  <div className="releve-history">
                    <div className="entry-meta">Histórico de saldos registrados</div>
                    {(() => {
                      const saldosCuenta = saldos.filter(s => s.cuenta_id === it.id);
                      if (saldosCuenta.length === 0) return <div className="empty" style={{ padding: '6px 0' }}>Ninguno todavía.</div>;
                      const conVerif = calcularVerificacionSaldos(it.nombre, saldosCuenta);
                      return conVerif.slice().reverse().map(s => (
                        <div key={s.id} className={`releve-history-item ${s.verif && !s.verif.coincide ? 'no-coincide' : ''}`}>
                          <span>{s.fecha_registro}</span>
                          <span>{parseFloat(s.saldo).toFixed(2)}€ {s.verif ? (s.verif.coincide ? '✓ cuadra con movimientos' : `✕ esperado ${s.verif.calculado.toFixed(2)}€`) : ''}</span>
                        </div>
                      ));
                    })()}
                  </div>

                  <div className="releve-history">
                    <div className="entry-meta">Meses del año con relevé subido</div>
                    <div className="mes-grid">
                      {['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'].map((nombreMes, idx) => {
                        const anioActual = new Date().getFullYear();
                        const claveMes = anioActual + '-' + String(idx + 1).padStart(2, '0');
                        const subido = relevesCuenta.some(r => String(r.mes).slice(0, 7) === claveMes);
                        return (
                          <div key={idx} className={`mes-chip ${subido ? 'subido' : ''}`} title={subido ? `Relevé de ${nombreMes} ${anioActual} subido` : `Sin relevé de ${nombreMes} ${anioActual}`}>
                            {nombreMes}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <div className="releve-history">
                    <div className="entry-meta">Historial de relevés subidos</div>
                    {relevesCuenta.length === 0 ? <div className="empty" style={{ padding: '6px 0' }}>Ninguno todavía.</div> :
                      relevesCuenta.map(r => {
                        const totalOk = r.coincide_total_operaciones === '' || r.coincide_total_operaciones === undefined ? null : (r.coincide_total_operaciones === true || r.coincide_total_operaciones === 'true');
                        return (
                          <div key={r.id} className={`releve-history-item ${r.coincide === false || r.coincide === 'false' || totalOk === false ? 'no-coincide' : ''}`}>
                            <span>{(r.mes ? String(r.mes).slice(0, 7) : '') || r.periodo || new Date(r.fecha_subida).toLocaleDateString('es-ES')} · {r.movimientos_importados} mov.</span>
                            <span>
                              {parseFloat(r.total_gastos || 0).toFixed(2)}€ gastos · {parseFloat(r.total_ingresos || 0).toFixed(2)}€ ingresos {r.coincide === false || r.coincide === 'false' ? '✕ saldo' : r.saldo_final !== '' ? '✓ saldo' : ''}
                              {totalOk !== null && (totalOk ? ' · ✓ total banco' : ' · ✕ total banco')}
                            </span>
                          </div>
                        );
                      })
                    }
                  </div>
                </React.Fragment>
              )}
            </div>
          );
        })
      }
    </div>
  );
}

function SuscripcionesTab() {
  const [items, setItems] = useState([]);
  const [transacciones, setTransacciones] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState({ nombre: '', categoria: '', monto: '', frecuencia: 'mensual', fecha_proximo_cobro: '', metodo_pago: '' });
  const [adding, setAdding] = useState(false);
  const [busyId, setBusyId] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [expandidoId, setExpandidoId] = useState(null);

  function load() {
    setLoading(true);
    apiCall('list', { sheet: 'Suscripciones' }).then(res => { setItems(Array.isArray(res) ? res : []); setLoading(false); });
    apiCall('list', { sheet: 'Transacciones' }).then(res => setTransacciones(Array.isArray(res) ? res : []));
  }
  useEffect(load, []);

  // Busca transacciones cuya nota contenga el nombre normalizado de la
  // suscripción — la misma lógica que ya usa el sistema para reconocer
  // comercios repetidos, así el conteo coincide con lo que ves en Movimientos.
  function transaccionesDe(nombreSuscripcion) {
    const clave = (nombreSuscripcion || '').toUpperCase();
    if (!clave) return [];
    return transacciones.filter(t => (t.nota || '').toUpperCase().includes(clave)).sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
  }

  function addSuscripcion(e) {
    e.preventDefault();
    if (!form.nombre || adding) return;
    setAdding(true);
    apiCall('create', { sheet: 'Suscripciones', data: { ...form, estado: 'activa' } }).then(() => {
      setForm({ nombre: '', categoria: '', monto: '', frecuencia: 'mensual', fecha_proximo_cobro: '', metodo_pago: '' });
      setAdding(false);
      setShowForm(false);
      load();
    });
  }

  function confirmar(id) {
    if (busyId) return;
    setBusyId(id);
    apiCall('update', { sheet: 'Suscripciones', data: { id, estado: 'activa' } }).then(() => { setBusyId(null); load(); });
  }

  function rechazar(id) {
    if (busyId) return;
    setBusyId(id);
    apiCall('delete', { sheet: 'Suscripciones', id }).then(() => { setBusyId(null); load(); });
  }

  function remove(id) {
    if (busyId) return;
    setBusyId(id);
    apiCall('delete', { sheet: 'Suscripciones', id }).then(() => { setBusyId(null); load(); });
  }

  const pendientes = items.filter(it => it.estado === 'pendiente_confirmacion');
  const confirmadas = items.filter(it => it.estado !== 'pendiente_confirmacion');

  return (
    <div>
      {pendientes.length > 0 && (
        <div className="resumen-section" style={{ marginBottom: 20 }}>
          <div className="entry-meta" style={{ color: 'var(--ochre, var(--red))', marginBottom: 8 }}>
            ⚠ {pendientes.length} suscripción(es) detectada(s) automáticamente — confirma o rechaza cada una
          </div>
          <div className="log">
            {pendientes.map(it => (
              <div key={it.id}>
                <div className="entry" style={{ cursor: 'pointer' }} onClick={() => setExpandidoId(expandidoId === it.id ? null : it.id)}>
                  <div className="entry-main">
                    <div className="entry-title">{it.nombre}</div>
                    <div className="entry-meta">{parseFloat(it.monto || 0).toFixed(2)} € · {it.frecuencia} · {transaccionesDe(it.nombre).length} transacción(es) registrada(s)</div>
                  </div>
                  <div className="entry-actions">
                    <button disabled={busyId === it.id} onClick={e => { e.stopPropagation(); confirmar(it.id); }}>{busyId === it.id ? '…' : 'Confirmar'}</button>
                    <button className="ghost" disabled={busyId === it.id} onClick={e => { e.stopPropagation(); rechazar(it.id); }}>Rechazar</button>
                  </div>
                </div>
                {expandidoId === it.id && (
                  <div className="releve-history" style={{ marginTop: -4, marginBottom: 8 }}>
                    {transaccionesDe(it.nombre).length === 0 ? <div className="empty" style={{ padding: '6px 0' }}>Ninguna transacción encontrada con este nombre.</div> :
                      transaccionesDe(it.nombre).map(t => (
                        <div key={t.id} className="releve-history-item">
                          <span>{t.fecha} · {t.nota.slice(0, 50)}</span>
                          <span>{parseFloat(t.monto || 0).toFixed(2)} €</span>
                        </div>
                      ))
                    }
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      )}

      <button className={`add-toggle-btn ${showForm ? 'cancel' : ''}`} onClick={() => setShowForm(!showForm)}>
        {showForm ? 'Cancelar' : '+ Añadir suscripción'}
      </button>

      {showForm && (
        <form className="entry-form" onSubmit={addSuscripcion}>
          <input placeholder="Nombre" value={form.nombre} onChange={e => setForm({ ...form, nombre: e.target.value })} />
          <input placeholder="Categoría" value={form.categoria} onChange={e => setForm({ ...form, categoria: e.target.value })} />
          <input type="number" step="0.01" placeholder="Monto" value={form.monto} onChange={e => setForm({ ...form, monto: e.target.value })} />
          <select value={form.frecuencia} onChange={e => setForm({ ...form, frecuencia: e.target.value })}>
            <option value="mensual">Mensual</option>
            <option value="anual">Anual</option>
          </select>
          <input type="date" value={form.fecha_proximo_cobro} onChange={e => setForm({ ...form, fecha_proximo_cobro: e.target.value })} />
          <input placeholder="Método de pago" value={form.metodo_pago} onChange={e => setForm({ ...form, metodo_pago: e.target.value })} />
          <button type="submit" disabled={adding}>{adding ? 'Añadiendo…' : 'Añadir suscripción'}</button>
        </form>
      )}

      {loading ? <div className="empty">Cargando…</div> :
        confirmadas.length === 0 ? <div className="empty">Sin suscripciones confirmadas.</div> :
        <div className="log">
          {confirmadas.map(it => (
            <div key={it.id}>
              <div className="entry" style={{ cursor: 'pointer' }} onClick={() => setExpandidoId(expandidoId === it.id ? null : it.id)}>
                <div className="entry-main">
                  <div className="entry-title">{it.nombre}</div>
                  <div className="entry-meta">{it.categoria || 'sin categoría'} · {parseFloat(it.monto || 0).toFixed(2)} € · {it.frecuencia} · {it.estado} · {transaccionesDe(it.nombre).length} transacción(es) registrada(s)</div>
                </div>
                <div className="entry-actions">
                  <button className="ghost" disabled={busyId === it.id} onClick={e => { e.stopPropagation(); remove(it.id); }}>{busyId === it.id ? '…' : 'Borrar'}</button>
                </div>
              </div>
              {expandidoId === it.id && (
                <div className="releve-history" style={{ marginTop: -4, marginBottom: 8 }}>
                  {transaccionesDe(it.nombre).length === 0 ? <div className="empty" style={{ padding: '6px 0' }}>Ninguna transacción encontrada con este nombre.</div> :
                    transaccionesDe(it.nombre).map(t => (
                      <div key={t.id} className="releve-history-item">
                        <span>{t.fecha} · {t.nota.slice(0, 50)}</span>
                        <span>{parseFloat(t.monto || 0).toFixed(2)} €</span>
                      </div>
                    ))
                  }
                </div>
              )}
            </div>
          ))}
        </div>
      }
    </div>
  );
}

function TransaccionesTab() {
  const [items, setItems] = useState([]);
  const [cuentas, setCuentas] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState({ tipo: 'gasto', categoria: '', subcategoria: '', monto: '', cuenta: '', nota: '' });
  const [adding, setAdding] = useState(false);
  const [busyId, setBusyId] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [filtros, setFiltros] = useState({ cuenta: '', categoria: '', mes: '', texto: '' });
  const [asignando, setAsignando] = useState(null);
  const [categoriaRapida, setCategoriaRapida] = useState({});
  const [vinculando, setVinculando] = useState(false);
  const [resultadoVinculo, setResultadoVinculo] = useState(null);
  const [sincronizando, setSincronizando] = useState(false);
  const [resultadoSync, setResultadoSync] = useState(null);
  const [depurando, setDepurando] = useState(false);
  const [posiblesDuplicados, setPosiblesDuplicados] = useState(null);

  function buscarDuplicados() {
    setDepurando(true);
    apiCall('eliminarDuplicados', {}).then(res => {
      setDepurando(false);
      if (res && !res.error) setPosiblesDuplicados(res.detalle || []);
    });
  }

  function vincularTransferencias() {
    setVinculando(true);
    apiCall('vincularTransferencias', {}).then(res => {
      setVinculando(false);
      if (res && !res.error) {
        setResultadoVinculo(`✓ ${res.vinculadas} transferencia(s) vinculada(s)${res.pendientesSalida || res.pendientesEntrada ? ` · ${res.pendientesSalida} salida(s) y ${res.pendientesEntrada} entrada(s) sin pareja` : ''}`);
        load();
      }
      setTimeout(() => setResultadoVinculo(null), 6000);
    });
  }

  function sincronizarCategorias() {
    setSincronizando(true);
    apiCall('sincronizarCategorias', {}).then(res => {
      setSincronizando(false);
      if (res && !res.error) {
        setResultadoSync(`✓ ${res.actualizadas} movimiento(s) recategorizado(s) según tus reglas guardadas`);
        load();
      }
      setTimeout(() => setResultadoSync(null), 6000);
    });
  }


  function asignarCategoria(it, guardarRegla) {
    const val = categoriaRapida[it.id];
    if (!val) return;
    const [categoria, subcategoria] = val.split('|');
    setAsignando(it.id);
    apiCall('update', { sheet: 'Transacciones', data: { id: it.id, categoria, subcategoria: subcategoria || '' } }).then(() => {
      if (guardarRegla && it.nota) {
        const palabra = normalizarComercioFrontend_(it.nota);
        if (palabra) apiCall('create', { sheet: 'Reglas_Categorizacion', data: { palabra_clave: palabra, categoria, subcategoria: subcategoria || '' } });
      }
      setAsignando(null);
      load();
    });
  }

  function load() {
    setLoading(true);
    apiCall('list', { sheet: 'Transacciones' }).then(res => { setItems(Array.isArray(res) ? res : []); setLoading(false); });
    apiCall('list', { sheet: 'Cuentas_Bancarias' }).then(res => setCuentas(Array.isArray(res) ? res : []));
  }
  useEffect(load, []);

  function addTransaccion(e) {
    e.preventDefault();
    if (!form.monto || adding) return;
    setAdding(true);
    apiCall('create', { sheet: 'Transacciones', data: { ...form, fecha: new Date().toISOString().slice(0, 10) } }).then(() => {
      setForm({ tipo: 'gasto', categoria: '', subcategoria: '', monto: '', cuenta: '', nota: '' });
      setAdding(false);
      setShowForm(false);
      load();
    });
  }

  function remove(id) {
    if (busyId) return;
    setBusyId(id);
    apiCall('delete', { sheet: 'Transacciones', id }).then(() => { setBusyId(null); load(); });
  }

  function monedaDeCuenta(nombreCuenta) {
    const c = cuentas.find(c => c.nombre === nombreCuenta);
    return (c && c.moneda) || 'EUR';
  }
  function simboloMoneda(moneda) {
    return moneda === 'EUR' ? '€' : moneda === 'COP' ? 'COP' : moneda === 'USD' ? 'USD' : moneda;
  }

  const meses = [...new Set(items.map(it => (it.fecha || '').slice(0, 7)).filter(Boolean))].sort().reverse();
  const categorias = [...new Set(items.map(it => it.categoria).filter(Boolean))];

  const visibles = items.filter(it => {
    if (filtros.cuenta && it.cuenta !== filtros.cuenta) return false;
    if (filtros.categoria && it.categoria !== filtros.categoria) return false;
    if (filtros.mes && (it.fecha || '').slice(0, 7) !== filtros.mes) return false;
    if (filtros.texto && !((it.nota || '') + (it.categoria || '')).toLowerCase().includes(filtros.texto.toLowerCase())) return false;
    return true;
  }).sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

  // El balance solo suma cuentas en EUR — mezclar monedas distintas en una
  // sola cifra no tendría ningún significado real (2.000.000 COP + 500 EUR
  // no son "2.000.500 de nada"). Las cuentas en otra moneda se resumen aparte.
  const visiblesEUR = visibles.filter(it => monedaDeCuenta(it.cuenta) === 'EUR');
  const balance = visiblesEUR.reduce((acc, it) => {
    const monto = parseFloat(it.monto) || 0;
    if (it.tipo === 'ingreso') return acc + monto;
    if (it.tipo === 'gasto') return acc - monto;
    return acc;
  }, 0);
  const totalTransferencias = visiblesEUR.filter(it => it.tipo === 'transferencia').reduce((acc, it) => acc + (parseFloat(it.monto) || 0), 0);
  const sinCategoria = items.filter(it => !it.categoria && it.tipo !== 'transferencia').length;

  const monedasNoEUR = [...new Set(cuentas.filter(c => c.moneda && c.moneda !== 'EUR').map(c => c.moneda))];
  const balancesPorOtraMoneda = monedasNoEUR.map(moneda => {
    const cuentasDeEsaMoneda = cuentas.filter(c => c.moneda === moneda).map(c => c.nombre);
    const movs = visibles.filter(it => cuentasDeEsaMoneda.includes(it.cuenta));
    const bal = movs.reduce((acc, it) => {
      const monto = parseFloat(it.monto) || 0;
      if (it.tipo === 'ingreso') return acc + monto;
      if (it.tipo === 'gasto') return acc - monto;
      return acc;
    }, 0);
    return { moneda, balance: bal };
  });

  return (
    <div>
      <div className="topbar">
        <span className="entry-meta">Balance en EUR (sin transferencias internas)</span>
        <span className="entry-amount" style={{ color: balance >= 0 ? 'var(--green)' : 'var(--red)' }}>{balance.toFixed(2)} €</span>
      </div>
      {balancesPorOtraMoneda.length > 0 && (
        <div className="topbar" style={{ marginTop: -8 }}>
          <span className="entry-meta">
            {balancesPorOtraMoneda.map(b => `Balance en ${b.moneda}: ${b.balance.toFixed(2)} ${simboloMoneda(b.moneda)}`).join(' · ')}
            {' '}(no se suma al de EUR — monedas distintas)
          </span>
        </div>
      )}
      {totalTransferencias > 0 && (
        <div className="entry-meta" style={{ marginBottom: 6 }}>Transferencias entre tus cuentas (no contadas): {totalTransferencias.toFixed(2)} €</div>
      )}
      {sinCategoria > 0 && (
        <div className="entry-meta" style={{ marginBottom: 14, color: 'var(--red)' }}>⚠ {sinCategoria} movimiento(s) sin categoría — asígnala abajo en cada uno</div>
      )}

      <button className={`add-toggle-btn ${showForm ? 'cancel' : ''}`} onClick={() => setShowForm(!showForm)}>
        {showForm ? 'Cancelar' : '+ Añadir movimiento'}
      </button>
      <button className="add-toggle-btn" disabled={vinculando} onClick={vincularTransferencias} style={{ marginLeft: 8 }}>
        {vinculando ? 'Vinculando…' : '🔗 Vincular transferencias'}
      </button>
      <button className="add-toggle-btn" disabled={sincronizando} onClick={sincronizarCategorias} style={{ marginLeft: 8 }}>
        {sincronizando ? 'Sincronizando…' : '🔄 Sincronizar categorías'}
      </button>
      <button className="add-toggle-btn" disabled={depurando} onClick={buscarDuplicados} style={{ marginLeft: 8 }}>
        {depurando ? 'Buscando…' : '🔍 Buscar posibles duplicados'}
      </button>
      {resultadoVinculo && <div className="entry-meta" style={{ marginTop: 8, color: 'var(--accent)' }}>{resultadoVinculo}</div>}
      {resultadoSync && <div className="entry-meta" style={{ marginTop: 8, color: 'var(--accent)' }}>{resultadoSync}</div>}

      {posiblesDuplicados !== null && (
        <div className="releve-history" style={{ marginBottom: 20 }}>
          <div className="entry-meta">
            {posiblesDuplicados.length === 0 ? 'No se encontraron coincidencias exactas.' :
              `⚠ ${posiblesDuplicados.length} grupo(s) con la misma cuenta, fecha, monto y descripción — revisa cada uno antes de borrar, pueden ser cargos reales repetidos (ej. dos viajes de metro al mismo precio)`}
          </div>
          {posiblesDuplicados.map((d, i) => (
            <div key={i} className="releve-history-item no-coincide">
              <span>{d.fecha} · {d.cuenta} · {d.repetidas}× · {d.nota.slice(0, 45)}</span>
              <span>{parseFloat(d.monto).toFixed(2)} €</span>
            </div>
          ))}
        </div>
      )}

      {showForm && (
        <form className="entry-form" onSubmit={addTransaccion}>
          <select value={form.tipo} onChange={e => setForm({ ...form, tipo: e.target.value })}>
            <option value="gasto">Gasto</option>
            <option value="ingreso">Ingreso</option>
            <option value="transferencia">Transferencia entre mis cuentas</option>
          </select>
          <input type="number" step="0.01" placeholder="Monto" value={form.monto} onChange={e => setForm({ ...form, monto: e.target.value })} />
          <select value={form.categoria} onChange={e => setForm({ ...form, categoria: e.target.value, subcategoria: '' })}>
            <option value="">Categoría</option>
            {Object.keys(CATEGORIAS_TRANSACCIONES).map(c => <option key={c} value={c}>{c}</option>)}
          </select>
          <select value={form.subcategoria} onChange={e => setForm({ ...form, subcategoria: e.target.value })} disabled={!form.categoria}>
            <option value="">Subcategoría</option>
            {(CATEGORIAS_TRANSACCIONES[form.categoria] || []).map(s => <option key={s} value={s}>{s}</option>)}
          </select>
          <select value={form.cuenta} onChange={e => setForm({ ...form, cuenta: e.target.value })}>
            <option value="">Cuenta</option>
            {cuentas.map(c => <option key={c.id} value={c.nombre}>{c.nombre}</option>)}
          </select>
          <input className="full" placeholder="Nota (opcional)" value={form.nota} onChange={e => setForm({ ...form, nota: e.target.value })} />
          <button type="submit" disabled={adding}>{adding ? 'Añadiendo…' : 'Añadir movimiento'}</button>
        </form>
      )}

      {items.length > 0 && (
        <div className="entry-form" style={{ marginBottom: 16 }}>
          <select value={filtros.cuenta} onChange={e => setFiltros({ ...filtros, cuenta: e.target.value })}>
            <option value="">Todas las cuentas</option>
            {cuentas.map(c => <option key={c.id} value={c.nombre}>{c.nombre}</option>)}
          </select>
          <select value={filtros.categoria} onChange={e => setFiltros({ ...filtros, categoria: e.target.value })}>
            <option value="">Todas las categorías</option>
            {categorias.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
          <select value={filtros.mes} onChange={e => setFiltros({ ...filtros, mes: e.target.value })}>
            <option value="">Todos los meses</option>
            {meses.map(m => <option key={m} value={m}>{m}</option>)}
          </select>
          <input className="full" placeholder="Buscar en nota/categoría…" value={filtros.texto} onChange={e => setFiltros({ ...filtros, texto: e.target.value })} />
        </div>
      )}

      {loading ? <div className="empty">Cargando…</div> :
        visibles.length === 0 ? <div className="empty">No hay movimientos que coincidan.</div> :
        <div className="log">
          {visibles.map((it, i) => (
            <div key={it.id} className="entry" style={{ flexDirection: !it.categoria && it.tipo !== 'transferencia' ? 'column' : 'row', alignItems: !it.categoria && it.tipo !== 'transferencia' ? 'stretch' : 'flex-start' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', width: '100%' }}>
                <div className="entry-main">
                  <div className="entry-title">
                    {it.tipo === 'transferencia' && '⇄ '}{it.categoria || it.nota || 'Sin categoría'}{it.subcategoria && ` · ${it.subcategoria}`}
                    {it.tipo === 'transferencia' && (it.vinculo_id ? <span className="chip" style={{ marginLeft: 6 }}>vinculada</span> : <span className="chip" style={{ marginLeft: 6, color: 'var(--ink-faint)' }}>sin vincular</span>)}
                  </div>
                  <div className="entry-meta">{it.fecha} · {it.cuenta || 'sin cuenta'} {it.nota && it.categoria && `· ${it.nota.slice(0, 40)}`}</div>
                </div>
                <span className="entry-amount" style={{ color: it.tipo === 'ingreso' ? 'var(--green)' : it.tipo === 'gasto' ? 'var(--red)' : 'var(--ink-faint)' }}>
                  {it.tipo === 'gasto' ? '-' : it.tipo === 'ingreso' ? '+' : '⇄'}{parseFloat(it.monto || 0).toFixed(2)} {simboloMoneda(monedaDeCuenta(it.cuenta))}
                </span>
                <div className="entry-actions">
                  <button className="ghost" disabled={busyId === it.id} onClick={() => remove(it.id)}>{busyId === it.id ? '…' : 'Borrar'}</button>
                </div>
              </div>
              {!it.categoria && it.tipo !== 'transferencia' && (
                <div className="account-upload" style={{ marginTop: 8 }}>
                  <select style={{ maxWidth: 220 }} value={categoriaRapida[it.id] || ''} onChange={e => setCategoriaRapida({ ...categoriaRapida, [it.id]: e.target.value })}>
                    <option value="">Asignar categoría…</option>
                    {Object.entries(CATEGORIAS_TRANSACCIONES).map(([cat, subs]) => subs.map(sub => (
                      <option key={cat + '|' + sub} value={cat + '|' + sub}>{cat} · {sub}</option>
                    )))}
                  </select>
                  <button className="ghost" disabled={asignando === it.id || !categoriaRapida[it.id]} onClick={() => asignarCategoria(it, false)}>Asignar</button>
                  <button className="ghost" disabled={asignando === it.id || !categoriaRapida[it.id]} onClick={() => asignarCategoria(it, true)}>Asignar y recordar</button>
                </div>
              )}
            </div>
          ))}
        </div>
      }
    </div>
  );
}

  const [arriendos, setArriendos] = useState([]);

  const [pagosDeudas, setPagosDeudas] = useState([]);

  const [propiedadId, setPropiedadId] = useState(null);

  const [formPropiedad, setFormPropiedad] = useState({ nombre: '', direccion: '', ciudad: '', pais: 'Colombia', moneda: 'COP', valor_estimado: '', costo_compra: '', costo_remodelacion: '', fecha_compra: '', nota: '' });
  const [formGasto, setFormGasto] = useState({ fecha: new Date().toISOString().slice(0, 10), categoria: 'Administración', monto: '', nota: '' });
  const [formArriendo, setFormArriendo] = useState({ fecha: new Date().toISOString().slice(0, 10), monto: '', nota: '', deuda_id: '', costo_inmobiliaria: '', costo_administracion: '', costo_otros: '', desc_otros: '' });
  const [formDeuda, setFormDeuda] = useState({ acreedor: '', monto_total: '', tasa_interes: '', cuota_mensual: '', fecha_inicio: '', fecha_proximo_pago: '', estado: 'activa', moneda: '', tipo_pago: 'Manual' });

    apiCall('list', { sheet: 'Recordatorios_Propiedad' }).then(res => setRecordatorios(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Arriendos_Propiedad' }).then(res => setArriendos(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Deudas' }).then(res => setDeudas(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Pagos_Deudas' }).then(res => setPagosDeudas(Array.isArray(res) ? res : []));
  }
  useEffect(load, []);

  function cambiarPais(pais) {
    setFormPropiedad({ ...formPropiedad, pais, moneda: MONEDA_POR_PAIS[pais] || formPropiedad.moneda });
  }

  function abrirDetalle(id) { setPropiedadId(id); setTabActiva('resumen'); setVista('detalle'); }
  function volverALista() { setVista('lista'); setPropiedadId(null); }

  function guardarRecordatorio(propiedadId, titulo, fecha, nota, recurrente) {
    if (!titulo || !fecha) return;
    apiCall('create', { sheet: 'Recordatorios_Propiedad', data: { propiedad_id: propiedadId, titulo, fecha, nota: nota || '', completado: false, recurrente: !!recurrente } }).then(load);
  }

  // Si el recordatorio es recurrente, al completarlo se crea de una vez el
  // del año siguiente (misma fecha, +1 año) — así no hay que volver a
  // escribirlo a mano cada año.
  function completarRecordatorio(r) {
    apiCall('update', { sheet: 'Recordatorios_Propiedad', data: { id: r.id, completado: true } }).then(() => {
      if (r.recurrente === true || r.recurrente === 'true') {
        const fechaSiguiente = new Date(r.fecha);
        fechaSiguiente.setFullYear(fechaSiguiente.getFullYear() + 1);
        apiCall('create', { sheet: 'Recordatorios_Propiedad', data: { propiedad_id: r.propiedad_id, titulo: r.titulo, fecha: fechaSiguiente.toISOString().slice(0, 10), nota: r.nota, completado: false, recurrente: true } }).then(load);
      } else {
        load();
      }
    });
  }

  function editarRecordatorio(id, campo, valor) {
    apiCall('update', { sheet: 'Recordatorios_Propiedad', data: { id, [campo]: valor } }).then(load);
  }

  function borrarRecordatorio(id) {
    apiCall('delete', { sheet: 'Recordatorios_Propiedad', id }).then(load);
  }

  function guardarPropiedad(e) {
    e.preventDefault();
    if (!formPropiedad.nombre || guardando) return;
    setGuardando(true);
    apiCall('create', { sheet: 'Propiedades', data: formPropiedad }).then(() => {
      setFormPropiedad({ nombre: '', direccion: '', ciudad: '', pais: 'Colombia', moneda: 'COP', valor_estimado: '', costo_compra: '', costo_remodelacion: '', fecha_compra: '', nota: '' });
      setGuardando(false); setMostrarForm(false); load();
    });
  }

  function borrarPropiedad(id) {
    if (busyId) return;
    setBusyId(id);
    apiCall('delete', { sheet: 'Propiedades', id }).then(() => { setBusyId(null); volverALista(); load(); });
  }

  function guardarGasto(propiedadId, e) {
    e.preventDefault();
    if (!formGasto.monto || guardando) return;
    setGuardando(true);
    apiCall('create', { sheet: 'Gastos_Propiedad', data: { ...formGasto, propiedad_id: propiedadId } }).then(() => {
      setFormGasto({ fecha: new Date().toISOString().slice(0, 10), categoria: 'Administración', monto: '', nota: '' });
      setGuardando(false); setMostrarFormGasto(false); load();
    });
  }

  function borrarGasto(id) {
    if (busyId) return;
    setBusyId(id);
    apiCall('delete', { sheet: 'Gastos_Propiedad', id }).then(() => { setBusyId(null); load(); });
  }

  // Al guardar un arriendo: (1) si eliges destinarlo a una deuda, se crea
  // también el pago real en Pagos_Deudas; (2) los 3 costos asociados
  // (inmobiliaria, administración, otros) se guardan cada uno como su
  // propio Gasto, en la misma fecha — así no hay que ir a la pestaña de
  // Gastos a mano cada vez.
  function guardarArriendo(propiedadId, e) {
    e.preventDefault();
    if (!formArriendo.monto || guardando) return;
    setGuardando(true);
    const { costo_inmobiliaria, costo_administracion, costo_otros, desc_otros, ...datosArriendo } = formArriendo;
    const montoNeto = (parseFloat(formArriendo.monto) || 0) - (parseFloat(costo_inmobiliaria) || 0) - (parseFloat(costo_administracion) || 0) - (parseFloat(costo_otros) || 0);
    // El arriendo guarda su propio desglose completo (bruto, cada costo, neto),
    // así el detalle es permanente y no depende de cruzar con la pestaña Gastos.
    const datosCompletos = {
      ...datosArriendo, propiedad_id: propiedadId,
      costo_inmobiliaria: costo_inmobiliaria || '', costo_administracion: costo_administracion || '',
      costo_otros: costo_otros || '', desc_otros: desc_otros || '', monto_neto: Math.max(0, montoNeto),
    };
    const notaAuto = 'Generado junto al arriendo del ' + formArriendo.fecha;
    // Los 3 gastos se crean con UNA sola llamada al backend (crearGastosPropiedad),
    // que los escribe secuencialmente — antes se disparaban 3 create en paralelo
    // y Sheets a veces perdía una de las escrituras (típicamente la comisión
    // inmobiliaria). Se hace en cadena: primero el arriendo, luego los gastos,
    // luego el pago de deuda si aplica.
    const gastosAsociados = [];
    if (costo_inmobiliaria) gastosAsociados.push({ propiedad_id: propiedadId, fecha: formArriendo.fecha, categoria: 'Comisión inmobiliaria', monto: costo_inmobiliaria, nota: notaAuto });
    if (costo_administracion) gastosAsociados.push({ propiedad_id: propiedadId, fecha: formArriendo.fecha, categoria: 'Administración', monto: costo_administracion, nota: notaAuto });
    // El texto que escribas en "otros costos" se usa como la nota del gasto,
    // para que después sepas exactamente de qué se trataba.
    if (costo_otros) gastosAsociados.push({ propiedad_id: propiedadId, fecha: formArriendo.fecha, categoria: 'Otro', monto: costo_otros, nota: desc_otros ? desc_otros : notaAuto });

    apiCall('create', { sheet: 'Arriendos_Propiedad', data: datosCompletos })
      .then(() => gastosAsociados.length > 0 ? apiCall('crearGastosPropiedad', { gastos: gastosAsociados }) : null)
      .then(() => formArriendo.deuda_id ? apiCall('create', { sheet: 'Pagos_Deudas', data: { deuda_id: formArriendo.deuda_id, fecha: formArriendo.fecha, monto: Math.max(0, montoNeto), nota: 'Pago desde arriendo neto del ' + formArriendo.fecha } }) : null)
      .then(() => {
        setFormArriendo({ ...formArriendo, monto: '', nota: '', deuda_id: '' });
        setGuardando(false); setMostrarFormArriendo(false); load();
      });
  }

  // Busca el monto más reciente usado en esta propiedad para una categoría
  // de gasto — así, aunque hayan pasado semanas o meses desde la última vez
  // que abriste esta página, el formulario se prellena solo con lo del mes
  // pasado en vez de partir en blanco.
  function ultimoCostoDe(propiedadId, categoria) {
    const candidatos = gastos.filter(g => g.propiedad_id === propiedadId && g.categoria === categoria)
      .slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
    return candidatos.length > 0 ? candidatos[0].monto : '';
  }

  function abrirFormArriendo(propiedadId) {
    if (!mostrarFormArriendo) {
      setFormArriendo(f => ({
        ...f,
        costo_inmobiliaria: f.costo_inmobiliaria || ultimoCostoDe(propiedadId, 'Comisión inmobiliaria'),
        costo_administracion: f.costo_administracion || ultimoCostoDe(propiedadId, 'Administración'),
        costo_otros: f.costo_otros || ultimoCostoDe(propiedadId, 'Otro'),
      }));
    }
    setMostrarFormArriendo(!mostrarFormArriendo);
  }

  function borrarArriendo(id) {
    if (busyId) return;
    setBusyId(id);
    apiCall('delete', { sheet: 'Arriendos_Propiedad', id }).then(() => { setBusyId(null); load(); });
  }

  function guardarDeuda(propiedadId, monedaPropiedad, e) {
    e.preventDefault();
    if (!formDeuda.acreedor || !formDeuda.monto_total || guardando) return;
    setGuardando(true);
    apiCall('create', { sheet: 'Deudas', data: { ...formDeuda, moneda: formDeuda.moneda || monedaPropiedad, propiedad_id: propiedadId } }).then(() => {
      setFormDeuda({ acreedor: '', monto_total: '', tasa_interes: '', cuota_mensual: '', fecha_inicio: '', fecha_proximo_pago: '', estado: 'activa', moneda: '', tipo_pago: 'Manual' });
      setGuardando(false); setMostrarFormDeuda(false); load();
    });
  }

  function borrarDeuda(id) {
    if (busyId) return;
    setBusyId(id);
    apiCall('delete', { sheet: 'Deudas', id }).then(() => { setBusyId(null); load(); });
  }

  function actualizarCampoDeuda(id, campo, valor) {
    apiCall('update', { sheet: 'Deudas', data: { id, [campo]: valor } }).then(load);
  }

  function actualizarCampoPropiedad(id, campo, valor) {
    apiCall('update', { sheet: 'Propiedades', data: { id, [campo]: valor } }).then(load);
  }

  function actualizarCampoGasto(id, campo, valor) {
    apiCall('update', { sheet: 'Gastos_Propiedad', data: { id, [campo]: valor } }).then(load);
  }

  function guardarPago(deudaId, e) {
    e.preventDefault();
    if (!formPago.monto || guardando) return;
    setGuardando(true);
    apiCall('create', { sheet: 'Pagos_Deudas', data: { ...formPago, deuda_id: deudaId } }).then(() => {
      setFormPago({ fecha: new Date().toISOString().slice(0, 10), monto: '', nota: '' });
      setGuardando(false); setMostrarFormPagoDeudaId(null); load();
    });
  }

  function borrarPago(id) {
    if (busyId) return;
    setBusyId(id);
    apiCall('delete', { sheet: 'Pagos_Deudas', id }).then(() => { setBusyId(null); load(); });
  }

  function generarPagosAutomaticos() {
    if (generandoPagos) return;
    setGenerandoPagos(true);
    setResultadoPagosAutomaticos(null);
    apiCall('generarPagosAutomaticos', {}).then(res => { setResultadoPagosAutomaticos(res); setGenerandoPagos(false); load(); });
  }

  if (!propiedades) return <div className="empty">Cargando…</div>;

  // ── VISTA: LISTA ──────────────────────────────────────────────────────────
  if (vista === 'lista') {
    const hoy = new Date().toISOString().slice(0, 10);
    const en30dias = new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10);
    const recordatoriosProximos = recordatorios.filter(r => !(r.completado === true || r.completado === 'true') && r.fecha && r.fecha <= en30dias);
    return (
      <div>
        {recordatoriosProximos.length > 0 && (
          <div className="stat-card" style={{ marginBottom: 16, borderColor: 'var(--accent)' }}>
            <div className="stat-card-label">🔔 Recordatorios próximos o vencidos</div>
            {recordatoriosProximos.slice().sort((a, b) => (a.fecha || '').localeCompare(b.fecha || '')).map(r => {
              const propiedad = propiedades.find(p => p.id === r.propiedad_id);
              const vencido = r.fecha < hoy;
              return (
                <div key={r.id} className="dash-row">
                  <span style={{ color: vencido ? 'var(--red)' : undefined }}>{r.titulo}{propiedad ? <span className="entry-meta"> — {propiedad.nombre}</span> : ''} <span className="entry-meta">({r.fecha}{vencido ? ' · vencido' : ''})</span></span>
                  <button className="ghost" onClick={() => completarRecordatorio(r)}>✓ Listo</button>
                </div>
              );
            })}
          </div>
        )}
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
          <div className="page-title" style={{ margin: 0 }}>Propiedades</div>
          <button onClick={() => setMostrarForm(!mostrarForm)}>{mostrarForm ? 'Cancelar' : '+ Nueva propiedad'}</button>
        </div>

        {mostrarForm && (
          <form className="entry-form" onSubmit={guardarPropiedad} style={{ marginBottom: 24 }}>
            <div><label className="entry-meta">Nombre</label><input value={formPropiedad.nombre} onChange={e => setFormPropiedad({ ...formPropiedad, nombre: e.target.value })} /></div>
            <div><label className="entry-meta">País</label>
              <select value={formPropiedad.pais} onChange={e => cambiarPais(e.target.value)}>
                <option value="Colombia">Colombia</option>
                <option value="Francia">Francia</option>
                <option value="Otro">Otro</option>
              </select>
            </div>
            <div><label className="entry-meta">Ciudad</label><input value={formPropiedad.ciudad} onChange={e => setFormPropiedad({ ...formPropiedad, ciudad: e.target.value })} /></div>
            <div><label className="entry-meta">Moneda</label><input value={formPropiedad.moneda} onChange={e => setFormPropiedad({ ...formPropiedad, moneda: e.target.value })} /></div>
            <div className="full"><label className="entry-meta">Dirección</label><input value={formPropiedad.direccion} onChange={e => setFormPropiedad({ ...formPropiedad, direccion: e.target.value })} /></div>
            <div><label className="entry-meta">Costo de compra (lo que pagaste)</label><input type="number" min="0" value={formPropiedad.costo_compra} onChange={e => setFormPropiedad({ ...formPropiedad, costo_compra: e.target.value })} /></div>
            <div><label className="entry-meta">Costo de remodelación</label><input type="number" min="0" value={formPropiedad.costo_remodelacion} onChange={e => setFormPropiedad({ ...formPropiedad, costo_remodelacion: e.target.value })} /></div>
            <div><label className="entry-meta">Valor estimado hoy (venta, opcional)</label><input type="number" min="0" value={formPropiedad.valor_estimado} onChange={e => setFormPropiedad({ ...formPropiedad, valor_estimado: e.target.value })} /></div>
            <div><label className="entry-meta">Fecha de compra</label><input type="date" value={formPropiedad.fecha_compra} onChange={e => setFormPropiedad({ ...formPropiedad, fecha_compra: e.target.value })} /></div>
            <div className="full"><label className="entry-meta">Nota</label><input value={formPropiedad.nota} onChange={e => setFormPropiedad({ ...formPropiedad, nota: e.target.value })} /></div>
            <button type="submit" disabled={guardando} className="full">{guardando ? 'Guardando…' : '+ Crear propiedad'}</button>
          </form>
        )}

        {propiedades.length === 0 ? <div className="empty">Sin propiedades registradas todavía.</div> : (
          <div className="log">
            {propiedades.map(p => {
              const totalGastos = gastos.filter(g => g.propiedad_id === p.id).reduce((s, g) => s + (parseFloat(g.monto) || 0), 0);
              const totalArriendos = arriendos.filter(a => a.propiedad_id === p.id).reduce((s, a) => s + (parseFloat(a.monto) || 0), 0);
              const numDeudas = deudas.filter(d => d.propiedad_id === p.id).length;
              return (
                <div key={p.id} className="entry" style={{ cursor: 'pointer' }} onClick={() => abrirDetalle(p.id)}>
                  <div className="entry-main">
                    <div className="entry-title">{p.nombre}</div>
                    <div className="entry-meta">{p.ciudad}, {p.pais} · gastos: {totalGastos.toLocaleString()} {p.moneda} · arriendos: {totalArriendos.toLocaleString()} {p.moneda} · {numDeudas} deuda(s)</div>
                  </div>
                  <div>→</div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  // ── VISTA: DETALLE ────────────────────────────────────────────────────────
  const p = propiedades.find(x => x.id === propiedadId);
  if (!p) { volverALista(); return null; }
  const gastosProp = gastos.filter(g => g.propiedad_id === p.id);
  const arriendosProp = arriendos.filter(a => a.propiedad_id === p.id);
  const deudasProp = deudas.filter(d => d.propiedad_id === p.id);
  const totalGastos = gastosProp.reduce((s, g) => s + (parseFloat(g.monto) || 0), 0);
  // Costo real = lo que de verdad invertiste (compra + remodelación). Es la
  // base para calcular rentabilidad. Distinto del valor_estimado, que es tu
  // apreciación subjetiva de cuánto valdría hoy en una venta.
  // Costo real = todo el dinero que le has metido al apartamento hasta hoy:
  // compra + remodelación + todos los gastos acumulados (administración,
  // predial, mantenimiento, etc.). Es tu desembolso total real.
  // OJO: para la RENTABILIDAD (análisis) se usa aparte solo compra+remodelación
  // como "inversión", porque los gastos operativos ya se restan del ingreso —
  // sumarlos al capital invertido los contaría dos veces y distorsionaría el
  // cap rate y los rendimientos.
  const costoCapital = (parseFloat(p.costo_compra) || 0) + (parseFloat(p.costo_remodelacion) || 0);
  const costoReal = costoCapital + totalGastos;
  const totalArriendos = arriendosProp.reduce((s, a) => s + (parseFloat(a.monto) || 0), 0);
  const totalArriendosNeto = arriendosProp.reduce((s, a) => {
    const neto = a.monto_neto !== undefined && a.monto_neto !== '' ? parseFloat(a.monto_neto)
      : (parseFloat(a.monto) || 0) - (parseFloat(a.costo_inmobiliaria) || 0) - (parseFloat(a.costo_administracion) || 0) - (parseFloat(a.costo_otros) || 0);
    return s + (neto || 0);
  }, 0);
  const pendientePorMoneda = {};
  deudasProp.forEach(d => {
    const pagado = pagosDeudas.filter(pg => pg.deuda_id === d.id).reduce((s2, pg) => s2 + (parseFloat(pg.monto) || 0), 0);
    const pendiente = Math.max(0, (parseFloat(d.monto_total) || 0) - pagado);
    const moneda = d.moneda || p.moneda;
    pendientePorMoneda[moneda] = (pendientePorMoneda[moneda] || 0) + pendiente;
  });
  const resumenDeudaPendiente = Object.entries(pendientePorMoneda).map(([m, v]) => v.toLocaleString() + ' ' + m).join(' + ') || '0';

  return (
    <div>
      <span className="detail-breadcrumb" onClick={volverALista}>← volver a propiedades</span>
      <div className="detail-header">
        <div className="detail-title">{p.nombre}</div>
        <div className="detail-meta">{p.direccion ? p.direccion + ' · ' : ''}{p.ciudad}, {p.pais}</div>
      </div>

      <div className="detail-tabs">
        {[['resumen', 'Resumen'], ['analisis', 'Análisis'], ['arriendos', 'Arriendos'], ['gastos', 'Gastos'], ['deudas', 'Créditos y deudas']].map(([key, label]) => (
          <button key={key} className={`detail-tab ${tabActiva === key ? 'active' : ''}`} onClick={() => setTabActiva(key)}>{label}</button>
        ))}
      </div>

      {tabActiva === 'resumen' && (
        <div>
          <details style={{ marginBottom: 14 }}>
            <summary className="entry-meta" style={{ cursor: 'pointer' }}>¿Costo real vs valor estimado?</summary>
            <div className="entry-meta" style={{ marginTop: 6, lineHeight: 1.5 }}>
              <strong>Costo real</strong> = todo el dinero que le has metido al apartamento hasta hoy: compra + remodelación + todos los gastos acumulados. Es tu desembolso total. <strong>Valor estimado</strong> = tu apreciación de cuánto valdría hoy en una venta — subjetivo y opcional. La <strong>plusvalía</strong> es solo el lado de la venta: valor estimado menos costo real. Pero como el costo real va subiendo cada mes con los gastos de administración/inmobiliaria, la plusvalía sola te penaliza por gastos que ya se pagaron solos con el arriendo — por eso el <strong>retorno total</strong> le suma lo que ya ganaste en arriendo neto, para darte la ganancia real completa si vendieras hoy (plusvalía + ingreso ya cobrado). Nota: para la rentabilidad en la pestaña Análisis se usa solo compra+remodelación como "inversión", porque los gastos operativos ya se descuentan del ingreso — así no se cuentan dos veces.
            </div>
          </details>
          <div className="stat-row">
            <div className="stat-card"><div className="stat-card-label">Costo real (todo lo invertido)</div><div className="stat-card-value">{costoReal > 0 ? costoReal.toLocaleString() + ' ' + p.moneda : '—'}</div>{costoReal > 0 && <div className="stat-card-sub">compra {(parseFloat(p.costo_compra) || 0).toLocaleString()} + remo {(parseFloat(p.costo_remodelacion) || 0).toLocaleString()} + gastos {totalGastos.toLocaleString()}</div>}</div>
            <div className="stat-card"><div className="stat-card-label">Valor estimado hoy (venta)</div><div className="stat-card-value">{p.valor_estimado ? parseFloat(p.valor_estimado).toLocaleString() + ' ' + p.moneda : '—'}</div></div>
            <div className="stat-card"><div className="stat-card-label">Plusvalía (estimado − costo real)</div><div className="stat-card-value" style={{ color: p.valor_estimado && costoReal > 0 ? ((parseFloat(p.valor_estimado) - costoReal) >= 0 ? 'var(--green)' : 'var(--red)') : undefined }}>{p.valor_estimado && costoReal > 0 ? (parseFloat(p.valor_estimado) - costoReal).toLocaleString() + ' ' + p.moneda : '—'}</div></div>
            <div className="stat-card"><div className="stat-card-label">Retorno total (plusvalía + arriendo ganado)</div><div className="stat-card-value" style={{ color: p.valor_estimado && costoReal > 0 ? (((parseFloat(p.valor_estimado) - costoReal) + totalArriendosNeto) >= 0 ? 'var(--green)' : 'var(--red)') : undefined }}>{p.valor_estimado && costoReal > 0 ? ((parseFloat(p.valor_estimado) - costoReal) + totalArriendosNeto).toLocaleString() + ' ' + p.moneda : '—'}</div></div>
            <div className="stat-card"><div className="stat-card-label">Arriendos netos recibidos</div><div className="stat-card-value" style={{ color: 'var(--accent)' }}>{totalArriendosNeto.toLocaleString()} {p.moneda}</div></div>
            <div className="stat-card"><div className="stat-card-label">Deuda pendiente</div><div className="stat-card-value">{resumenDeudaPendiente}</div></div>
          </div>
          <div className="dash-card full">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
              <div className="dash-label" style={{ margin: 0 }}>Ficha de la propiedad</div>
              <button className="ghost" disabled={busyId === p.id} onClick={() => borrarPropiedad(p.id)}>{busyId === p.id ? '…' : 'Borrar propiedad'}</button>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: 14 }}>
              <div><div className="entry-meta">Nombre</div><input defaultValue={p.nombre} onBlur={e => actualizarCampoPropiedad(p.id, 'nombre', e.target.value)} /></div>
              <div><div className="entry-meta">Ciudad</div><input defaultValue={p.ciudad} onBlur={e => actualizarCampoPropiedad(p.id, 'ciudad', e.target.value)} /></div>
              <div><div className="entry-meta">País</div><input defaultValue={p.pais} onBlur={e => actualizarCampoPropiedad(p.id, 'pais', e.target.value)} /></div>
              <div><div className="entry-meta">Moneda</div><input defaultValue={p.moneda} onBlur={e => actualizarCampoPropiedad(p.id, 'moneda', e.target.value)} /></div>
              <div className="full"><div className="entry-meta">Dirección</div><input defaultValue={p.direccion} onBlur={e => actualizarCampoPropiedad(p.id, 'direccion', e.target.value)} /></div>
              <div><div className="entry-meta">Costo de compra (lo que pagaste)</div><input type="number" min="0" defaultValue={p.costo_compra} onBlur={e => actualizarCampoPropiedad(p.id, 'costo_compra', e.target.value)} /></div>

      {tabActiva === 'gastos' && (
        <div className="dash-card full">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>

            <button className={`add-toggle-btn ${mostrarFormGasto ? 'cancel' : ''}`} onClick={() => setMostrarFormGasto(!mostrarFormGasto)}>{mostrarFormGasto ? 'Cancelar' : '+ Añadir gasto'}</button>

                    <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <span className="entry-meta">{parseFloat(g.monto).toLocaleString()} {p.moneda}</span>
                      <button className="ghost" style={{ padding: '1px 6px', fontSize: 10 }} disabled={busyId === g.id} onClick={e => { e.stopPropagation(); borrarGasto(g.id); }}>×</button>
                    </span>

                      <div><div className="entry-meta">Categoría</div>

                      </div>

                      <div className="full"><div className="entry-meta">Nota / descripción</div><input defaultValue={g.nota} onBlur={e => actualizarCampoGasto(g.id, 'nota', e.target.value)} /></div>

      {tabActiva === 'arriendos' && (

          {arriendosProp.length === 0 ? <div className="empty">Sin arriendos registrados.</div> :
            arriendosProp.slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '')).map(a => {
              const deudaVinculada = deudas.find(d => d.id === a.deuda_id);
              const bruto = parseFloat(a.monto) || 0;
              const cInmo = parseFloat(a.costo_inmobiliaria) || 0;
              const cAdmin = parseFloat(a.costo_administracion) || 0;
              const cOtros = parseFloat(a.costo_otros) || 0;
              // Si el arriendo es viejo (sin desglose guardado), calcula el neto al vuelo.
              const neto = a.monto_neto !== undefined && a.monto_neto !== '' ? parseFloat(a.monto_neto) : (bruto - cInmo - cAdmin - cOtros);
              const abierto = arriendoExpandidoId === a.id;
              return (
                <div key={a.id} style={{ borderBottom: '1px solid var(--line)', padding: '12px 0' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', cursor: 'pointer' }} onClick={() => setArriendoExpandidoId(abierto ? null : a.id)}>
                    <span>{abierto ? '▾' : '▸'} <strong>{a.fecha}</strong>{deudaVinculada ? <span className="entry-meta"> · → paga {deudaVinculada.acreedor}</span> : ''}</span>
                    <span style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                      <span className="entry-meta">bruto {bruto.toLocaleString()} · neto <strong style={{ color: 'var(--accent)' }}>{neto.toLocaleString()}</strong> {p.moneda}</span>
                      <button className="ghost" style={{ padding: '1px 6px', fontSize: 10 }} disabled={busyId === a.id} onClick={e => { e.stopPropagation(); borrarArriendo(a.id); }}>×</button>

                  </div>

                    <div style={{ marginTop: 12 }}>

                        <div className="stat-card"><div className="stat-card-label">Comisión inmobiliaria</div><div className="stat-card-value" style={{ fontSize: 18 }}>{cInmo ? '−' + cInmo.toLocaleString() : '—'}</div></div>
                        <div className="stat-card"><div className="stat-card-label">Administración</div><div className="stat-card-value" style={{ fontSize: 18 }}>{cAdmin ? '−' + cAdmin.toLocaleString() : '—'}</div></div>
                        <div className="stat-card"><div className="stat-card-label">Otros costos</div><div className="stat-card-value" style={{ fontSize: 18 }}>{cOtros ? '−' + cOtros.toLocaleString() : '—'}</div></div>
                        <div className="stat-card"><div className="stat-card-label">Arriendo neto</div><div className="stat-card-value" style={{ fontSize: 18, color: 'var(--accent)' }}>{neto.toLocaleString()} {p.moneda}</div></div>
                      </div>
                      {(!a.costo_inmobiliaria && !a.costo_administracion && !a.costo_otros && a.monto_neto === undefined) && (
                        <div className="entry-meta" style={{ marginBottom: 10 }}>Este arriendo se registró antes de la función de desglose, por eso no tiene costos asociados guardados. Los arriendos nuevos sí los guardan.</div>
                      )}
                      {deudaVinculada && <div className="entry-meta">Este arriendo se destinó como pago (por su neto) a la deuda: {deudaVinculada.acreedor}.</div>}
                      {a.nota && <div className="entry-meta">Nota: {a.nota}</div>}
