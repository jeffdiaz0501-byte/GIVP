            <div><label className="entry-meta">Monto bruto ({p.moneda})</label><input type="number" min="0" value={formArriendo.monto} onChange={e => setFormArriendo({ ...formArriendo, monto: e.target.value })} /></div>
            <div className="full" style={{ borderTop: '1px solid var(--line)', paddingTop: 10, marginTop: 4 }}>
              <span className="entry-meta">Costos asociados de este mes (se guardan cada uno como su propio gasto, y quedan de base para el próximo mes)</span>
            </div>
            <div><label className="entry-meta">Comisión inmobiliaria ({p.moneda})</label><input type="number" min="0" value={formArriendo.costo_inmobiliaria} onChange={e => setFormArriendo({ ...formArriendo, costo_inmobiliaria: e.target.value })} /></div>
            <div><label className="entry-meta">Administración ({p.moneda})</label><input type="number" min="0" value={formArriendo.costo_administracion} onChange={e => setFormArriendo({ ...formArriendo, costo_administracion: e.target.value })} /></div>
            <div><label className="entry-meta">Otros costos ({p.moneda})</label><input type="number" min="0" value={formArriendo.costo_otros} onChange={e => setFormArriendo({ ...formArriendo, costo_otros: e.target.value })} /></div>
            <div><label className="entry-meta">¿De qué son esos "otros costos"?</label><input placeholder="ej. reparación grifo, IVA…" value={formArriendo.desc_otros} onChange={e => setFormArriendo({ ...formArriendo, desc_otros: e.target.value })} /></div>
            <div className="full" style={{ display: 'flex', gap: 20, padding: '10px 0', borderTop: '1px solid var(--line)', borderBottom: '1px solid var(--line)', margin: '4px 0' }}>
              <div><div className="entry-meta">Bruto</div><strong>{(parseFloat(formArriendo.monto) || 0).toLocaleString()} {p.moneda}</strong></div>
              <div><div className="entry-meta">Neto (lo que te queda)</div><strong style={{ color: 'var(--accent)' }}>{Math.max(0, (parseFloat(formArriendo.monto) || 0) - (parseFloat(formArriendo.costo_inmobiliaria) || 0) - (parseFloat(formArriendo.costo_administracion) || 0) - (parseFloat(formArriendo.costo_otros) || 0)).toLocaleString()} {p.moneda}</strong></div>

              </select>
            </div>
            <div className="full"><label className="entry-meta">Nota</label><input value={formArriendo.nota} onChange={e => setFormArriendo({ ...formArriendo, nota: e.target.value })} /></div>
            <button type="submit" disabled={guardando} className="full">{guardando ? 'Guardando…' : '+ Añadir arriendo y sus costos'}</button>
          </form>
          )}
        </div>
      )}

      {tabActiva === 'deudas' && (
        <div className="dash-card full">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14, flexWrap: 'wrap', gap: 8 }}>

              <button className="ghost" onClick={generarPagosAutomaticos} disabled={generandoPagos}>{generandoPagos ? 'Revisando…' : '🔁 Generar pagos automáticos'}</button>

            </div>
          </div>
          {resultadoPagosAutomaticos && <div className="entry-meta" style={{ marginBottom: 12 }}>{resultadoPagosAutomaticos.pagosCreados} pago(s) automático(s) registrado(s).</div>}

          {deudasProp.length === 0 ? <div className="empty">Sin deudas vinculadas.</div> :
            deudasProp.map(d => {
              const pagosDeuda = pagosDeudas.filter(pg => pg.deuda_id === d.id).slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
              const pagado = pagosDeuda.reduce((s, pg) => s + (parseFloat(pg.monto) || 0), 0);
              const moneda = d.moneda || p.moneda;
              const saldo = Math.max(0, (parseFloat(d.monto_total) || 0) - pagado);
              const pct = d.monto_total ? Math.min(100, (pagado / parseFloat(d.monto_total)) * 100) : 0;
              const abierta = deudaExpandidaId === d.id;
              return (
                <div key={d.id} style={{ borderBottom: '1px solid var(--line)', padding: '14px 0' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', cursor: 'pointer' }} onClick={() => setDeudaExpandidaId(abierta ? null : d.id)}>
                    <span>{abierta ? '▾' : '▸'} <strong>{d.acreedor}</strong> <span className="entry-meta">({d.estado} · {d.tipo_pago || 'Manual'})</span></span>
                    <span className="entry-meta">saldo {saldo.toLocaleString()} {moneda} de {parseFloat(d.monto_total).toLocaleString()} {moneda}</span>
                  </div>
                  <div className="progress-bar" style={{ marginTop: 8 }}><div className="progress-fill" style={{ width: `${pct}%` }}></div></div>

                  {abierta && (
                    <div style={{ marginTop: 16 }}>
                      <div className="stat-row">
                        <div className="stat-card"><div className="stat-card-label">Saldo pendiente</div><div className="stat-card-value">{saldo.toLocaleString()} {moneda}</div></div>
                        <div className="stat-card"><div className="stat-card-label">Pagado hasta hoy</div><div className="stat-card-value">{pagado.toLocaleString()} {moneda}</div></div>
                        <div className="stat-card"><div className="stat-card-label">Progreso</div><div className="stat-card-value">{pct.toFixed(0)}%</div></div>
                        <div className="stat-card"><div className="stat-card-label">Cuota mensual</div><div className="stat-card-value" style={{ fontSize: 18 }}>{d.cuota_mensual ? parseFloat(d.cuota_mensual).toLocaleString() + ' ' + moneda : '—'}</div></div>
                      </div>

                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
                        <div className="entry-meta" style={{ fontWeight: 600 }}>Ficha de la deuda</div>

                      </div>

                        <div><div className="entry-meta">Acreedor</div><input defaultValue={d.acreedor} onBlur={e => actualizarCampoDeuda(d.id, 'acreedor', e.target.value)} /></div>
                        <div><div className="entry-meta">Moneda</div><input defaultValue={d.moneda} onBlur={e => actualizarCampoDeuda(d.id, 'moneda', e.target.value)} /></div>
                        <div><div className="entry-meta">Tipo de pago</div>
                          <select value={d.tipo_pago || 'Manual'} onChange={e => actualizarCampoDeuda(d.id, 'tipo_pago', e.target.value)}>
                            <option value="Manual">Manual</option>
                            <option value="Automático">Automático</option>
                          </select>
                        </div>
                        <div><div className="entry-meta">Estado</div>
                          <select value={d.estado} onChange={e => actualizarCampoDeuda(d.id, 'estado', e.target.value)}>
                            <option value="activa">Activa</option>
                            <option value="pagada">Pagada</option>
                          </select>
                        </div>
                        <div><div className="entry-meta">Monto total</div><input type="number" min="0" defaultValue={d.monto_total} onBlur={e => actualizarCampoDeuda(d.id, 'monto_total', e.target.value)} /></div>
                        <div><div className="entry-meta">Tasa interés %</div><input type="number" min="0" step="0.01" defaultValue={d.tasa_interes} onBlur={e => actualizarCampoDeuda(d.id, 'tasa_interes', e.target.value)} /></div>
                        <div><div className="entry-meta">Cuota mensual</div><input type="number" min="0" defaultValue={d.cuota_mensual} onBlur={e => actualizarCampoDeuda(d.id, 'cuota_mensual', e.target.value)} /></div>
                        <div><div className="entry-meta">Fecha inicio</div><input type="date" defaultValue={d.fecha_inicio} onBlur={e => actualizarCampoDeuda(d.id, 'fecha_inicio', e.target.value)} /></div>
                        <div><div className="entry-meta">Próximo pago</div><input type="date" defaultValue={d.fecha_proximo_pago} onBlur={e => actualizarCampoDeuda(d.id, 'fecha_proximo_pago', e.target.value)} /></div>
                      </div>

                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
                        <div className="entry-meta" style={{ fontWeight: 600 }}>Historial de pagos — {pagado.toLocaleString()} {moneda} pagados</div>
                        <button className={`add-toggle-btn ${mostrarFormPagoDeudaId === d.id ? 'cancel' : ''}`} onClick={() => setMostrarFormPagoDeudaId(mostrarFormPagoDeudaId === d.id ? null : d.id)}>{mostrarFormPagoDeudaId === d.id ? 'Cancelar' : '+ Registrar pago'}</button>
                      </div>
                      {pagosDeuda.length === 0 ? <div className="empty">Sin pagos registrados.</div> :
                        pagosDeuda.map(pg => (
                          <div key={pg.id} className="dash-row" style={{ borderTop: 'none' }}>

                            <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                              <span className="entry-meta">{parseFloat(pg.monto).toLocaleString()} {moneda}</span>
                              <button className="ghost" style={{ padding: '1px 6px', fontSize: 10 }} disabled={busyId === pg.id} onClick={() => borrarPago(pg.id)}>×</button>
                            </span>
                          </div>
                        ))
                      }
                      {mostrarFormPagoDeudaId === d.id && (
                      <form className="entry-form" style={{ marginTop: 10 }} onSubmit={e => guardarPago(d.id, e)}>
                        <div><label className="entry-meta">Fecha</label><input type="date" value={formPago.fecha} onChange={e => setFormPago({ ...formPago, fecha: e.target.value })} /></div>
                        <div><label className="entry-meta">Monto ({moneda})</label><input type="number" min="0" value={formPago.monto} onChange={e => setFormPago({ ...formPago, monto: e.target.value })} /></div>
                        <div className="full"><label className="entry-meta">Nota</label><input value={formPago.nota} onChange={e => setFormPago({ ...formPago, nota: e.target.value })} /></div>
                        <button type="submit" disabled={guardando} className="full">{guardando ? 'Guardando…' : '+ Registrar pago'}</button>
                      </form>
                      )}
                    </div>
                  )}
                </div>
              );
            })
          }

          {mostrarFormDeuda && (
          <form className="entry-form" style={{ marginTop: 14 }} onSubmit={e => guardarDeuda(p.id, p.moneda, e)}>
            <div><label className="entry-meta">Acreedor (ej. Banco X, Mis papás)</label><input value={formDeuda.acreedor} onChange={e => setFormDeuda({ ...formDeuda, acreedor: e.target.value })} /></div>
            <div><label className="entry-meta">Moneda (vacío = {p.moneda}, la de la propiedad)</label><input placeholder={p.moneda} value={formDeuda.moneda} onChange={e => setFormDeuda({ ...formDeuda, moneda: e.target.value })} /></div>
            <div><label className="entry-meta">Tipo de pago</label>
              <select value={formDeuda.tipo_pago} onChange={e => setFormDeuda({ ...formDeuda, tipo_pago: e.target.value })}>
                <option value="Manual">Manual (abonos puntuales)</option>
                <option value="Automático">Automático (mismo día y monto cada mes)</option>
              </select>
            </div>
            <div><label className="entry-meta">Monto total</label><input type="number" min="0" value={formDeuda.monto_total} onChange={e => setFormDeuda({ ...formDeuda, monto_total: e.target.value })} /></div>
            <div><label className="entry-meta">Tasa interés % (0 si no aplica)</label><input type="number" min="0" step="0.01" value={formDeuda.tasa_interes} onChange={e => setFormDeuda({ ...formDeuda, tasa_interes: e.target.value })} /></div>
            <div><label className="entry-meta">Cuota mensual</label><input type="number" min="0" value={formDeuda.cuota_mensual} onChange={e => setFormDeuda({ ...formDeuda, cuota_mensual: e.target.value })} /></div>
            <div><label className="entry-meta">Fecha inicio</label><input type="date" value={formDeuda.fecha_inicio} onChange={e => setFormDeuda({ ...formDeuda, fecha_inicio: e.target.value })} /></div>
            <div><label className="entry-meta">Próximo pago (o primer pago si es automático)</label><input type="date" value={formDeuda.fecha_proximo_pago} onChange={e => setFormDeuda({ ...formDeuda, fecha_proximo_pago: e.target.value })} /></div>
            <button type="submit" disabled={guardando} className="full">{guardando ? 'Guardando…' : '+ Añadir deuda vinculada'}</button>
          </form>
          )}
        </div>
      )}

      {tabActiva === 'analisis' && (() => {
        // ── Cálculo de métricas profesionales de rentabilidad inmobiliaria ──
        // Se anualizan los flujos a partir de la fecha del primer arriendo
        // registrado, para que rendimientos y ratios sean comparables aunque
        // lleves solo unos meses de datos.
        const valorMercado = parseFloat(p.valor_estimado) || 0;
        const invertido = (parseFloat(p.costo_compra) || 0) + (parseFloat(p.costo_remodelacion) || 0);
        const fechasArriendo = arriendosProp.map(a => a.fecha).filter(Boolean).sort();
        const primeraFecha = fechasArriendo.length > 0 ? new Date(fechasArriendo[0]) : null;
        const mesesTranscurridos = primeraFecha ? Math.max(1, Math.round((new Date() - primeraFecha) / (1000 * 60 * 60 * 24 * 30.44))) : 0;

        const brutoAnualizado = mesesTranscurridos > 0 ? (totalArriendos / mesesTranscurridos) * 12 : 0;
        const netoAnualizado = mesesTranscurridos > 0 ? (totalArriendosNeto / mesesTranscurridos) * 12 : 0;

        // Solo los gastos que de verdad se repiten cada mes (administración,
        // comisión inmobiliaria) tiene sentido anualizarlos (÷meses × 12).
        // Los puntuales (predial, mantenimiento, seguro, otro) se cuentan tal
        // como ocurrieron — multiplicarlos por 12 los infla artificialmente.
        const CATEGORIAS_RECURRENTES = ['Administración', 'Comisión inmobiliaria'];
        const gastosRecurrentesTotal = gastosProp.filter(g => CATEGORIAS_RECURRENTES.includes(g.categoria)).reduce((s, g) => s + (parseFloat(g.monto) || 0), 0);
        const gastosPuntualesTotal = totalGastos - gastosRecurrentesTotal;
        const gastosRecurrentesAnualizados = mesesTranscurridos > 0 ? (gastosRecurrentesTotal / mesesTranscurridos) * 12 : 0;
        const gastosAnualizados = gastosRecurrentesAnualizados + gastosPuntualesTotal;

        // NOI = ingreso bruto anual − gastos operativos anuales (sin incluir deuda).
        const noi = brutoAnualizado - gastosAnualizados;
        // Rendimiento sobre lo INVERTIDO (costo real): mide qué tan bien rinde
        // tu dinero. Cap rate usa el valor de MERCADO: mide la propiedad como activo.
        const rendimientoBruto = invertido > 0 ? (brutoAnualizado / invertido) * 100 : 0;
        const rendimientoNeto = invertido > 0 ? (noi / invertido) * 100 : 0;
        const capRate = valorMercado > 0 ? (noi / valorMercado) * 100 : 0;
        const oer = brutoAnualizado > 0 ? (gastosAnualizados / brutoAnualizado) * 100 : 0;
        const cuotaMensualDeuda = deudasProp.reduce((s, d) => s + (parseFloat(d.cuota_mensual) || 0), 0);
        const dscr = (cuotaMensualDeuda * 12) > 0 ? noi / (cuotaMensualDeuda * 12) : null;
        const cashflowMensualNeto = (netoAnualizado / 12) - cuotaMensualDeuda;

        const fmt = v => Math.round(v).toLocaleString() + ' ' + p.moneda;
        const pctColor = (v, bueno) => v >= bueno ? 'var(--green)' : v >= bueno * 0.6 ? 'var(--accent)' : 'var(--red)';

        if (arriendosProp.length === 0) {
          return <div className="empty">Registra al menos un arriendo para ver el análisis de rentabilidad.</div>;
        }

        return (
          <div>
            <div className="entry-meta" style={{ marginBottom: 16, lineHeight: 1.6 }}>
              Los ingresos y los gastos <strong>recurrentes</strong> (administración, comisión inmobiliaria) se anualizan a partir de tu primer arriendo registrado ({primeraFecha ? primeraFecha.toISOString().slice(0, 10) : '—'}, {mesesTranscurridos} mes(es) de datos). Los gastos <strong>puntuales</strong> (predial, mantenimiento, seguro, otro) se cuentan tal como ocurrieron, sin multiplicar por nada — porque no se repiten cada mes. Todo se vuelve más preciso cuantos más meses registres. Toca el "?" de cada indicador para entender qué significa y cómo leer tu número.
            </div>

            <div className="dash-label">Rentabilidad</div>
            <div className="stat-row">
              <div className="stat-card">
                <div className="stat-card-label">Rendimiento bruto anual <IndicadorAyuda texto="Cuánto renta al año tu apartamento en arriendo, comparado con lo que invertiste (compra + remodelación), SIN restar gastos. Fórmula: arriendo bruto anual ÷ inversión. Sirve para comparar rápido, pero exagera el retorno porque ignora los costos. Referencia: 7-8%+ es excelente, 5-7% bueno, 4-5% moderado, bajo 4% flojo." /></div>
                <div className="stat-card-value" style={{ color: pctColor(rendimientoBruto, 6) }}>{rendimientoBruto.toFixed(2)}%</div>
                <div className="stat-card-sub">{rendimientoBruto >= 7 ? 'excelente' : rendimientoBruto >= 5 ? 'bueno' : rendimientoBruto >= 4 ? 'moderado' : 'flojo'}</div>
              </div>
              <div className="stat-card">
                <div className="stat-card-label">Rendimiento neto anual <IndicadorAyuda texto="Igual que el bruto, pero YA restando todos los gastos (inmobiliaria, administración, mantenimiento, etc.). Es el retorno realista sobre tu inversión. Fórmula: (arriendo bruto − gastos) ÷ inversión. Referencia: 5%+ muy bueno, 4-5% aceptable, bajo 4% flojo (salvo que esperes ganar por plusvalía)." /></div>
                <div className="stat-card-value" style={{ color: pctColor(rendimientoNeto, 4) }}>{rendimientoNeto.toFixed(2)}%</div>
                <div className="stat-card-sub">{rendimientoNeto >= 5 ? 'muy bueno' : rendimientoNeto >= 4 ? 'aceptable' : 'flojo'}</div>
              </div>
              <div className="stat-card">
                <div className="stat-card-label">Cap rate <IndicadorAyuda texto="El retorno del apartamento como activo, independiente de cómo lo financiaste. Responde: si lo hubiera comprado de contado, ¿qué % anual me daría hoy? Fórmula: NOI ÷ valor de mercado estimado. Es la métrica estándar para comparar propiedades entre sí. Referencia 2026: 4-6% típico en mercados estables, 7-9% en mercados de renta fuerte. Depende mucho de la ciudad." /></div>
                <div className="stat-card-value" style={{ color: pctColor(capRate, 5) }}>{capRate.toFixed(2)}%</div>
                <div className="stat-card-sub">{valorMercado > 0 ? (capRate >= 7 ? 'alto' : capRate >= 4 ? 'normal' : 'bajo') : 'falta valor estimado'}</div>
              </div>
              <div className="stat-card">
                <div className="stat-card-label">Ratio de gastos (OER) <IndicadorAyuda texto="Qué porcentaje de lo que entra por arriendo se va en gastos operativos (sin contar la deuda). Es el mejor indicador de qué tan eficiente es la gestión. Fórmula: gastos ÷ ingreso bruto. Referencia: en residencial suele estar entre 35% y 55%. Bajo 50% es sano; muy por encima significa que los gastos se están comiendo tu rentabilidad; muy por debajo de 30% suele indicar que olvidaste registrar gastos." /></div>
                <div className="stat-card-value" style={{ color: oer <= 50 ? 'var(--green)' : 'var(--red)' }}>{oer.toFixed(1)}%</div>
                <div className="stat-card-sub">{oer < 30 ? '¿faltan gastos?' : oer <= 50 ? 'eficiente' : 'gastos altos'}</div>
              </div>
            </div>

            <div className="dash-label">Flujo de caja (anualizado)</div>
            <div className="stat-row">
              <div className="stat-card"><div className="stat-card-label">Ingreso bruto anual <IndicadorAyuda texto="Todo lo que entra por arriendo en un año (bruto, antes de descontar nada). Es el punto de partida de todos los demás cálculos." /></div><div className="stat-card-value">{fmt(brutoAnualizado)}</div></div>
              <div className="stat-card"><div className="stat-card-label">Gastos operativos anuales <IndicadorAyuda texto="Suma de dos partes con tratamiento distinto: (1) gastos recurrentes (administración, comisión inmobiliaria) anualizados — sí tiene sentido multiplicarlos porque se repiten cada mes; (2) gastos puntuales (predial, mantenimiento, seguro, otro) contados TAL COMO ocurrieron, sin anualizar — porque multiplicar por 12 un pago único inflaría el número sin sentido. No incluye cuotas de deuda ni remodelación." /></div><div className="stat-card-value">{fmt(gastosAnualizados)}</div><div className="stat-card-sub">recurrentes {fmt(gastosRecurrentesAnualizados)} + puntuales {fmt(gastosPuntualesTotal)}</div></div>
              <div className="stat-card"><div className="stat-card-label">NOI (ingreso operativo neto) <IndicadorAyuda texto="El corazón del análisis inmobiliario: lo que gana el apartamento tras pagar todos los gastos operativos, pero ANTES de la hipoteca. Fórmula: ingreso bruto − gastos operativos. Positivo = la propiedad genera dinero por sí misma. Es la base para calcular el cap rate y el DSCR." /></div><div className="stat-card-value" style={{ color: noi >= 0 ? 'var(--green)' : 'var(--red)' }}>{fmt(noi)}</div><div className="stat-card-sub">{noi >= 0 ? 'genera dinero' : 'pierde dinero'}</div></div>
              <div className="stat-card"><div className="stat-card-label">Flujo mensual tras deuda <IndicadorAyuda texto="El dinero que de verdad te queda en el bolsillo cada mes, después de gastos Y después de pagar la cuota de la deuda. Fórmula: arriendo neto mensual − cuotas mensuales de deuda. Es 'el número que te mantiene solvente': si es negativo, el apartamento te cuesta dinero cada mes en vez de darte." /></div><div className="stat-card-value" style={{ color: cashflowMensualNeto >= 0 ? 'var(--green)' : 'var(--red)' }}>{fmt(cashflowMensualNeto)}</div><div className="stat-card-sub">{cashflowMensualNeto >= 0 ? 'te queda a favor' : 'te cuesta cada mes'}</div></div>
            </div>

            {cuotaMensualDeuda > 0 && (
              <React.Fragment>
                <div className="dash-label">Deuda</div>
                <div className="stat-row">
                  <div className="stat-card"><div className="stat-card-label">Cuota mensual total <IndicadorAyuda texto="La suma de las cuotas mensuales de todas las deudas vinculadas a este apartamento (banco, familia, etc.)." /></div><div className="stat-card-value" style={{ fontSize: 18 }}>{fmt(cuotaMensualDeuda)}</div></div>
                  <div className="stat-card">
                    <div className="stat-card-label">DSCR (cobertura de deuda) <IndicadorAyuda texto="Cuántas veces el ingreso del apartamento cubre la deuda. Fórmula: NOI anual ÷ cuotas anuales de deuda. Un DSCR de 1.0 significa que el arriendo apenas alcanza para la cuota; 1.25 significa que genera 25% más de lo que debe pagar (el umbral que piden los bancos). Referencia: por encima de 1.25 es seguro, 1.10 o menos es riesgoso. Cuanto más alto, más colchón tienes." /></div>
                    <div className="stat-card-value" style={{ color: dscr === null ? undefined : dscr >= 1.25 ? 'var(--green)' : dscr >= 1.1 ? 'var(--accent)' : 'var(--red)' }}>{dscr === null ? '—' : dscr.toFixed(2)}</div>
                    <div className="stat-card-sub">{dscr === null ? '' : dscr >= 1.25 ? 'seguro' : dscr >= 1.1 ? 'ajustado' : 'riesgoso'}</div>
                  </div>
                </div>
              </React.Fragment>
            )}
          </div>
        );
      })()}
    </div>
  );
}

// Pequeño botón "?" que muestra la explicación de un indicador al pasar el
// cursor o tocarlo (usa el title nativo + un despliegue en móvil).
function IndicadorAyuda({ texto }) {
  const [abierto, setAbierto] = useState(false);
  return (
    <span style={{ position: 'relative', display: 'inline-block' }}>
      <span onClick={e => { e.stopPropagation(); setAbierto(!abierto); }}
        title={texto}
        style={{ cursor: 'help', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: 15, height: 15, borderRadius: '50%', border: '1px solid var(--ink-faint)', color: 'var(--ink-faint)', fontSize: 9, marginLeft: 4, verticalAlign: 'middle' }}>?</span>
      {abierto && (
        <span style={{ position: 'absolute', top: '120%', left: 0, zIndex: 10, width: 240, background: 'var(--surface-2)', border: '1px solid var(--line)', borderRadius: 6, padding: 10, fontSize: 11, lineHeight: 1.5, color: 'var(--ink-soft)', textTransform: 'none', letterSpacing: 0, fontWeight: 400, fontFamily: "'Inter', sans-serif" }}>{texto}</span>
      )}
    </span>
  );
}

function RecetasTab() {
  const [recetas, setRecetas] = useState(null);
  const [ingredientes, setIngredientes] = useState([]);
  const [vista, setVista] = useState('lista'); // 'lista' | 'detalle'
  const [recetaId, setRecetaId] = useState(null);
  const [filtroTipo, setFiltroTipo] = useState('Todos');
  const [mostrarForm, setMostrarForm] = useState(false);
  const [mostrarFormIngrediente, setMostrarFormIngrediente] = useState(false);
  const [formReceta, setFormReceta] = useState({ nombre: '', tipo: 'Desayuno', tiempo_prep_min: '', notas: '' });
  const [ingredientesNuevaReceta, setIngredientesNuevaReceta] = useState([{ ingrediente: '', cantidad: '', unidad: '' }]);
  const [formIngrediente, setFormIngrediente] = useState({ ingrediente: '', cantidad: '', unidad: '' });
  const [guardando, setGuardando] = useState(false);
  const [busyId, setBusyId] = useState(null);

  const TIPOS = ['Desayuno', 'Almuerzo', 'Comida'];

  function load() {
    apiCall('list', { sheet: 'Recetas' }).then(res => setRecetas(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Receta_Ingredientes' }).then(res => setIngredientes(Array.isArray(res) ? res : []));
  }
  useEffect(load, []);

  function abrirDetalle(id) { setRecetaId(id); setVista('detalle'); }
  function volverALista() { setVista('lista'); setRecetaId(null); }

  function guardarReceta(e) {
    e.preventDefault();
    if (!formReceta.nombre || guardando) return;
    setGuardando(true);
    apiCall('create', { sheet: 'Recetas', data: formReceta }).then(receta => {
      const ingredientesValidos = ingredientesNuevaReceta.filter(i => i.ingrediente).map(i => ({ ...i, receta_id: receta.id }));
      const tarea = ingredientesValidos.length > 0 ? apiCall('crearVarios', { sheet: 'Receta_Ingredientes', filas: ingredientesValidos }) : Promise.resolve();
      tarea.then(() => {
        setFormReceta({ nombre: '', tipo: 'Desayuno', tiempo_prep_min: '', notas: '' });
        setIngredientesNuevaReceta([{ ingrediente: '', cantidad: '', unidad: '' }]);
        setGuardando(false); setMostrarForm(false); load();
      });
    });
  }

  function actualizarIngredienteNuevo(idx, campo, valor) {
    const copia = [...ingredientesNuevaReceta];
    copia[idx] = { ...copia[idx], [campo]: valor };
    setIngredientesNuevaReceta(copia);
  }

  function anadirFilaIngredienteNuevo() {
    setIngredientesNuevaReceta([...ingredientesNuevaReceta, { ingrediente: '', cantidad: '', unidad: '' }]);
  }

  function quitarFilaIngredienteNuevo(idx) {
    setIngredientesNuevaReceta(ingredientesNuevaReceta.filter((_, i) => i !== idx));
  }

  function borrarReceta(id) {
    if (busyId) return;
    setBusyId(id);
    apiCall('delete', { sheet: 'Recetas', id }).then(() => { setBusyId(null); volverALista(); load(); });
  }

  function guardarIngrediente(recetaId, e) {
    e.preventDefault();
    if (!formIngrediente.ingrediente || guardando) return;
    setGuardando(true);
    apiCall('create', { sheet: 'Receta_Ingredientes', data: { ...formIngrediente, receta_id: recetaId } }).then(() => {
      setFormIngrediente({ ingrediente: '', cantidad: '', unidad: '' });
      setGuardando(false); setMostrarFormIngrediente(false); load();
    });
  }

  function editarReceta(id, campo, valor) {
    apiCall('update', { sheet: 'Recetas', data: { id, [campo]: valor } }).then(load);
  }

  function editarIngrediente(id, campo, valor) {
    apiCall('update', { sheet: 'Receta_Ingredientes', data: { id, [campo]: valor } }).then(load);
  }

  function borrarIngrediente(id) {
    if (busyId) return;
    setBusyId(id);
    apiCall('delete', { sheet: 'Receta_Ingredientes', id }).then(() => { setBusyId(null); load(); });
  }

  if (!recetas) return <div className="empty">Cargando…</div>;

  // ── VISTA: LISTA ──────────────────────────────────────────────────────────
  if (vista === 'lista') {
    const recetasFiltradas = filtroTipo === 'Todos' ? recetas : recetas.filter(r => r.tipo === filtroTipo);
    return (
      <div>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
          <div className="page-title" style={{ margin: 0 }}>Recetas</div>
          <button onClick={() => setMostrarForm(!mostrarForm)}>{mostrarForm ? 'Cancelar' : '+ Nueva receta'}</button>
        </div>

        <div style={{ display: 'flex', gap: 6, marginBottom: 16 }}>
          {['Todos', ...TIPOS].map(t => (
            <button key={t} className={filtroTipo === t ? '' : 'ghost'} style={{ fontSize: 12, padding: '5px 12px' }} onClick={() => setFiltroTipo(t)}>{t}</button>
          ))}
        </div>

        {mostrarForm && (
          <form className="entry-form" onSubmit={guardarReceta} style={{ marginBottom: 24 }}>
            <div><label className="entry-meta">Nombre</label><input value={formReceta.nombre} onChange={e => setFormReceta({ ...formReceta, nombre: e.target.value })} /></div>
            <div><label className="entry-meta">Tipo</label>
              <select value={formReceta.tipo} onChange={e => setFormReceta({ ...formReceta, tipo: e.target.value })}>
                {TIPOS.map(t => <option key={t} value={t}>{t}</option>)}
              </select>
            </div>
            <div><label className="entry-meta">Tiempo de preparación (min)</label><input type="number" min="0" value={formReceta.tiempo_prep_min} onChange={e => setFormReceta({ ...formReceta, tiempo_prep_min: e.target.value })} /></div>
            <div className="full" style={{ borderTop: '1px solid var(--line)', paddingTop: 10, marginTop: 4 }}>
              <span className="entry-meta">Ingredientes</span>
              {ingredientesNuevaReceta.map((ing, idx) => (
                <div key={idx} style={{ display: 'flex', gap: 6, marginTop: 6 }}>
                  <input placeholder="Ingrediente" value={ing.ingrediente} onChange={e => actualizarIngredienteNuevo(idx, 'ingrediente', e.target.value)} style={{ flex: 2 }} />
                  <input type="number" min="0" step="0.1" placeholder="Cantidad" value={ing.cantidad} onChange={e => actualizarIngredienteNuevo(idx, 'cantidad', e.target.value)} style={{ flex: 1 }} />
                  <input placeholder="Unidad" value={ing.unidad} onChange={e => actualizarIngredienteNuevo(idx, 'unidad', e.target.value)} style={{ flex: 1 }} />
                  {ingredientesNuevaReceta.length > 1 && <button type="button" className="ghost" onClick={() => quitarFilaIngredienteNuevo(idx)}>×</button>}
                </div>
              ))}
              <button type="button" className="ghost" style={{ marginTop: 8 }} onClick={anadirFilaIngredienteNuevo}>+ Otro ingrediente</button>
            </div>
            <div className="full"><label className="entry-meta">Notas / preparación</label><textarea className="full" rows={3} value={formReceta.notas} onChange={e => setFormReceta({ ...formReceta, notas: e.target.value })}></textarea></div>
            <button type="submit" disabled={guardando} className="full">{guardando ? 'Guardando…' : '+ Crear receta'}</button>
          </form>
        )}

        {recetasFiltradas.length === 0 ? <div className="empty">Sin recetas todavía.</div> : (
          <div className="log">
            {recetasFiltradas.map(r => {
              const numIngredientes = ingredientes.filter(i => i.receta_id === r.id).length;
              return (
                <div key={r.id} className="entry" style={{ cursor: 'pointer' }} onClick={() => abrirDetalle(r.id)}>
                  <div className="entry-main">
                    <div className="entry-title">{r.nombre}</div>
                    <div className="entry-meta">{r.tipo}{r.tiempo_prep_min ? ' · ' + r.tiempo_prep_min + ' min' : ''} · {numIngredientes} ingrediente(s)</div>
                  </div>
                  <div>→</div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  // ── VISTA: DETALLE ────────────────────────────────────────────────────────
  const r = recetas.find(x => x.id === recetaId);
  if (!r) { volverALista(); return null; }
  const ingredientesReceta = ingredientes.filter(i => i.receta_id === r.id);

  return (
    <div>
      <span className="detail-breadcrumb" onClick={volverALista}>← volver a recetas</span>
      <div className="detail-header">
        <div className="detail-title">{r.nombre}</div>
        <div className="detail-meta">{r.tipo}{r.tiempo_prep_min ? ' · ' + r.tiempo_prep_min + ' min' : ''}</div>
      </div>

      <div className="dash-card full">
        <div className="dash-label">Ficha de la receta</div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(160px, 1fr))', gap: 14 }}>
          <div><div className="entry-meta">Nombre</div><input defaultValue={r.nombre} onBlur={e => editarReceta(r.id, 'nombre', e.target.value)} /></div>
          <div><div className="entry-meta">Tipo</div>
            <select defaultValue={r.tipo} onChange={e => editarReceta(r.id, 'tipo', e.target.value)}>
              {TIPOS.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
          </div>
          <div><div className="entry-meta">Tiempo de preparación (min)</div><input type="number" min="0" defaultValue={r.tiempo_prep_min} onBlur={e => editarReceta(r.id, 'tiempo_prep_min', e.target.value)} /></div>
        </div>
      </div>

      <div className="dash-card full">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
          <div className="dash-label" style={{ margin: 0 }}>Ingredientes</div>
          <div style={{ display: 'flex', gap: 8 }}>
            <button className={`add-toggle-btn ${mostrarFormIngrediente ? 'cancel' : ''}`} onClick={() => setMostrarFormIngrediente(!mostrarFormIngrediente)}>{mostrarFormIngrediente ? 'Cancelar' : '+ Añadir ingrediente'}</button>
            <button className="ghost" disabled={busyId === r.id} onClick={() => borrarReceta(r.id)}>{busyId === r.id ? '…' : 'Borrar receta'}</button>
          </div>
        </div>
        {ingredientesReceta.length === 0 ? <div className="empty">Sin ingredientes definidos todavía.</div> :
          ingredientesReceta.map(i => (
            <div key={i.id} className="dash-row">
              <input defaultValue={i.ingrediente} onBlur={e => editarIngrediente(i.id, 'ingrediente', e.target.value)} style={{ flex: 2 }} />
              <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <input type="number" min="0" step="0.1" defaultValue={i.cantidad} onBlur={e => editarIngrediente(i.id, 'cantidad', e.target.value)} style={{ width: 70 }} />
                <input defaultValue={i.unidad} onBlur={e => editarIngrediente(i.id, 'unidad', e.target.value)} style={{ width: 70 }} />
                <button className="ghost" style={{ padding: '1px 6px', fontSize: 10 }} disabled={busyId === i.id} onClick={() => borrarIngrediente(i.id)}>×</button>
              </span>
            </div>
          ))
        }
        {mostrarFormIngrediente && (
        <form className="entry-form" style={{ marginTop: 14 }} onSubmit={e => guardarIngrediente(r.id, e)}>
          <div className="full"><label className="entry-meta">Ingrediente</label><input value={formIngrediente.ingrediente} onChange={e => setFormIngrediente({ ...formIngrediente, ingrediente: e.target.value })} /></div>
          <div><label className="entry-meta">Cantidad</label><input type="number" min="0" step="0.1" value={formIngrediente.cantidad} onChange={e => setFormIngrediente({ ...formIngrediente, cantidad: e.target.value })} /></div>
          <div><label className="entry-meta">Unidad (ej. g, ml, unidad)</label><input value={formIngrediente.unidad} onChange={e => setFormIngrediente({ ...formIngrediente, unidad: e.target.value })} /></div>
          <button type="submit" disabled={guardando} className="full">{guardando ? 'Guardando…' : '+ Añadir'}</button>
        </form>
        )}
      </div>

      <div className="dash-card full">
        <div className="dash-label">Preparación / notas</div>
        <textarea className="full" rows={4} defaultValue={r.notas} onBlur={e => editarReceta(r.id, 'notas', e.target.value)}></textarea>
      </div>
    </div>
  );
}

function PlanComidasTab() {
  const [plan, setPlan] = useState(null);
  const [recetas, setRecetas] = useState([]);
  const [fecha, setFecha] = useState(new Date().toISOString().slice(0, 10));
  const [seleccion, setSeleccion] = useState({});
  const [guardando, setGuardando] = useState(false);
  const [marcandoId, setMarcandoId] = useState(null);
  const [avisoStock, setAvisoStock] = useState(null);

  const TIPOS = ['Desayuno', 'Almuerzo', 'Comida'];

  function load() {
    apiCall('list', { sheet: 'Plan_Comidas' }).then(res => setPlan(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Recetas' }).then(res => setRecetas(Array.isArray(res) ? res : []));
  }
  useEffect(load, []);

  if (!plan) return <div className="empty">Cargando…</div>;

  const planDelDia = plan.filter(p => p.fecha === fecha);

  function asignar(tipoComida) {
    const recetaId = seleccion[tipoComida];
    if (!recetaId || guardando) return;
    setGuardando(true);
    apiCall('create', { sheet: 'Plan_Comidas', data: { fecha, tipo_comida: tipoComida, receta_id: recetaId, comido: false } }).then(() => {
      setSeleccion({ ...seleccion, [tipoComida]: '' });
      setGuardando(false); load();
    });
  }

  function cambiarRecetaAsignada(id, nuevaRecetaId) {
    apiCall('update', { sheet: 'Plan_Comidas', data: { id, receta_id: nuevaRecetaId } }).then(load);
  }

  function quitar(id) {
    apiCall('delete', { sheet: 'Plan_Comidas', id }).then(load);
  }

  function marcarComido(id) {
    if (marcandoId) return;
    setMarcandoId(id);
    setAvisoStock(null);
    apiCall('marcarComido', { planId: id }).then(res => {
      setMarcandoId(null);
      if (res && res.agregadosALista && res.agregadosALista.length > 0) {
        setAvisoStock('Se agotó y se añadió solo a la lista de compras: ' + res.agregadosALista.join(', '));
      }
      load();
    });
  }

  return (
    <div>
      <div className="page-title" style={{ marginBottom: 16 }}>Plan de comidas</div>
      <div style={{ marginBottom: 20 }}>
        <label className="entry-meta">Día</label><br />
        <input type="date" value={fecha} onChange={e => setFecha(e.target.value)} style={{ width: 180 }} />
      </div>

      {avisoStock && <div className="entry-meta" style={{ marginBottom: 16, color: 'var(--accent)' }}>🛒 {avisoStock}</div>}

      {TIPOS.map(tipo => {
        const entrada = planDelDia.find(p => p.tipo_comida === tipo);
        const recetasDeTipo = recetas.filter(r => r.tipo === tipo);
        const recetaAsignada = entrada ? recetas.find(r => r.id === entrada.receta_id) : null;
        return (
          <div key={tipo} className="dash-card full">
            <div className="dash-label">{tipo}</div>
            {entrada ? (
              <div className="dash-row">
                {(entrada.comido === true || entrada.comido === 'true') ? (
                  <span>{recetaAsignada ? recetaAsignada.nombre : '(receta borrada)'} <span className="entry-meta">✓ comido</span></span>
                ) : (
                  <select value={entrada.receta_id} onChange={e => cambiarRecetaAsignada(entrada.id, e.target.value)} style={{ flex: 1 }}>
                    {recetasDeTipo.map(r => <option key={r.id} value={r.id}>{r.nombre}</option>)}
                  </select>
                )}
                <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  {!(entrada.comido === true || entrada.comido === 'true') && (
                    <button className="ghost" disabled={marcandoId === entrada.id} onClick={() => marcarComido(entrada.id)}>{marcandoId === entrada.id ? '…' : '✓ Marcar como comido'}</button>
                  )}
                  <button className="ghost" style={{ padding: '2px 8px', fontSize: 10 }} onClick={() => quitar(entrada.id)}>Quitar</button>
                </span>
              </div>
            ) : recetasDeTipo.length === 0 ? (
              <div className="empty">Sin recetas de {tipo.toLowerCase()} registradas — crea alguna en Recetas.</div>
            ) : (
              <div style={{ display: 'flex', gap: 8 }}>
                <select value={seleccion[tipo] || ''} onChange={e => setSeleccion({ ...seleccion, [tipo]: e.target.value })} style={{ flex: 1 }}>
                  <option value="">Elegir receta…</option>
                  {recetasDeTipo.map(r => <option key={r.id} value={r.id}>{r.nombre}</option>)}
                </select>
                <button disabled={!seleccion[tipo] || guardando} onClick={() => asignar(tipo)}>Asignar</button>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function DespensaTab() {
  const [stock, setStock] = useState(null);
  const [lista, setLista] = useState([]);
  const [mostrarFormStock, setMostrarFormStock] = useState(false);
  const [mostrarFormLista, setMostrarFormLista] = useState(false);
  const [formStock, setFormStock] = useState({ ingrediente: '', cantidad: '', unidad: '' });
  const [formLista, setFormLista] = useState({ ingrediente: '', cantidad: '', unidad: '', nota: '' });
  const [guardando, setGuardando] = useState(false);
  const [busyId, setBusyId] = useState(null);

  function load() {
    apiCall('list', { sheet: 'Stock_Ingredientes' }).then(res => setStock(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Lista_Compras' }).then(res => setLista(Array.isArray(res) ? res : []));
  }
  useEffect(load, []);

  if (!stock) return <div className="empty">Cargando…</div>;

  function guardarStock(e) {
    e.preventDefault();
    if (!formStock.ingrediente || guardando) return;
    setGuardando(true);
    // Si el ingrediente ya existe en el stock, suma la cantidad en vez de duplicar la fila.
    const existente = stock.find(s => (s.ingrediente || '').trim().toLowerCase() === formStock.ingrediente.trim().toLowerCase());
    const accion = existente
      ? apiCall('update', { sheet: 'Stock_Ingredientes', data: { id: existente.id, cantidad: (parseFloat(existente.cantidad) || 0) + (parseFloat(formStock.cantidad) || 0) } })
      : apiCall('create', { sheet: 'Stock_Ingredientes', data: formStock });
    accion.then(() => {
      setFormStock({ ingrediente: '', cantidad: '', unidad: '' });
      setGuardando(false); setMostrarFormStock(false); load();
    });
  }

  function borrarStock(id) {
    if (busyId) return;
    setBusyId(id);
    apiCall('delete', { sheet: 'Stock_Ingredientes', id }).then(() => { setBusyId(null); load(); });
  }

  function actualizarCampoStock(id, campo, valor) {
    apiCall('update', { sheet: 'Stock_Ingredientes', data: { id, [campo]: valor } }).then(load);
  }

  function guardarItemLista(e) {
    e.preventDefault();
    if (!formLista.ingrediente || guardando) return;
    setGuardando(true);
    apiCall('create', { sheet: 'Lista_Compras', data: { ...formLista, comprado: false } }).then(() => {
      setFormLista({ ingrediente: '', cantidad: '', unidad: '', nota: '' });
      setGuardando(false); setMostrarFormLista(false); load();
    });
  }

  // Marcar comprado: además de tacharlo en la lista, suma la cantidad al
  // stock de ese ingrediente (o crea la fila si no existía) — así queda
  // reflejado sin tener que ir a la pestaña de stock a mano.
  function marcarComprado(item) {
    apiCall('update', { sheet: 'Lista_Compras', data: { id: item.id, comprado: true } }).then(() => {
      const existente = stock.find(s => (s.ingrediente || '').trim().toLowerCase() === (item.ingrediente || '').trim().toLowerCase());
      const accion = existente
        ? apiCall('update', { sheet: 'Stock_Ingredientes', data: { id: existente.id, cantidad: (parseFloat(existente.cantidad) || 0) + (parseFloat(item.cantidad) || 0) } })
        : apiCall('create', { sheet: 'Stock_Ingredientes', data: { ingrediente: item.ingrediente, cantidad: item.cantidad, unidad: item.unidad } });
      accion.then(load);
    });
  }

  function editarItemLista(id, campo, valor) {
    apiCall('update', { sheet: 'Lista_Compras', data: { id, [campo]: valor } }).then(load);
  }

  function borrarItemLista(id) {
    apiCall('delete', { sheet: 'Lista_Compras', id }).then(load);
  }

  const listaPendiente = lista.filter(l => !(l.comprado === true || l.comprado === 'true'));
  const listaComprada = lista.filter(l => l.comprado === true || l.comprado === 'true');

  return (
    <div>
      <div className="page-title" style={{ marginBottom: 16 }}>Despensa</div>

      <div className="dash-card full">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div className="dash-label" style={{ margin: 0 }}>🛒 Lista de compras <span className="entry-meta">— {listaPendiente.length} pendiente(s)</span></div>
          <button className={`add-toggle-btn ${mostrarFormLista ? 'cancel' : ''}`} onClick={() => setMostrarFormLista(!mostrarFormLista)}>{mostrarFormLista ? 'Cancelar' : '+ Añadir a la lista'}</button>
        </div>
        {listaPendiente.length === 0 ? <div className="empty">Nada pendiente por comprar.</div> :
          listaPendiente.map(l => (
            <div key={l.id} style={{ borderBottom: '1px solid var(--line)', padding: '8px 0' }}>
              <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                <input defaultValue={l.ingrediente} onBlur={e => editarItemLista(l.id, 'ingrediente', e.target.value)} style={{ flex: 2 }} />
                <input type="number" min="0" step="0.1" defaultValue={l.cantidad} onBlur={e => editarItemLista(l.id, 'cantidad', e.target.value)} style={{ width: 70 }} />
                <input defaultValue={l.unidad} onBlur={e => editarItemLista(l.id, 'unidad', e.target.value)} style={{ width: 60 }} />
                <button className="ghost" onClick={() => marcarComprado(l)}>✓ Comprado</button>
                <button className="ghost" style={{ padding: '1px 6px', fontSize: 10 }} onClick={() => borrarItemLista(l.id)}>×</button>
              </div>
              <input defaultValue={l.nota} placeholder="Nota (opcional)" onBlur={e => editarItemLista(l.id, 'nota', e.target.value)} style={{ marginTop: 6, width: '100%' }} className="entry-meta" />
            </div>
          ))
        }
        {mostrarFormLista && (
        <form className="entry-form" style={{ marginTop: 14 }} onSubmit={guardarItemLista}>
          <div><label className="entry-meta">Ingrediente</label><input value={formLista.ingrediente} onChange={e => setFormLista({ ...formLista, ingrediente: e.target.value })} /></div>
          <div><label className="entry-meta">Cantidad</label><input type="number" min="0" step="0.1" value={formLista.cantidad} onChange={e => setFormLista({ ...formLista, cantidad: e.target.value })} /></div>
          <div><label className="entry-meta">Unidad</label><input value={formLista.unidad} onChange={e => setFormLista({ ...formLista, unidad: e.target.value })} /></div>
          <div className="full"><label className="entry-meta">Nota</label><input value={formLista.nota} onChange={e => setFormLista({ ...formLista, nota: e.target.value })} /></div>
          <button type="submit" disabled={guardando} className="full">{guardando ? 'Guardando…' : '+ Añadir'}</button>
        </form>
        )}
        {listaComprada.length > 0 && (
          <details style={{ marginTop: 14 }}>
            <summary className="entry-meta" style={{ cursor: 'pointer' }}>Ya comprados ({listaComprada.length})</summary>
            {listaComprada.map(l => (
              <div key={l.id} className="dash-row" style={{ opacity: 0.5 }}>
                <span>{l.ingrediente}</span>
                <span className="entry-meta">{l.cantidad} {l.unidad}</span>
              </div>
            ))}
          </details>
        )}
      </div>

      <div className="dash-card full">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div className="dash-label" style={{ margin: 0 }}>📦 Stock actual</div>
          <button className={`add-toggle-btn ${mostrarFormStock ? 'cancel' : ''}`} onClick={() => setMostrarFormStock(!mostrarFormStock)}>{mostrarFormStock ? 'Cancelar' : '+ Añadir / sumar stock'}</button>
        </div>
        <details style={{ marginBottom: 10 }}>
          <summary className="entry-meta" style={{ cursor: 'pointer' }}>¿Cómo funciona?</summary>
          <div className="entry-meta" style={{ marginTop: 6, lineHeight: 1.5 }}>Cuando marcas una comida como "comida" en el Plan de comidas, se descuenta aquí automáticamente según los ingredientes de la receta. Si algo llega a 0, se añade solo a la lista de compras arriba.</div>
        </details>
        {stock.length === 0 ? <div className="empty">Sin stock registrado todavía.</div> :
          stock.slice().sort((a, b) => (a.ingrediente || '').localeCompare(b.ingrediente || '')).map(s => (
            <div key={s.id} className="dash-row">
              <span style={{ display: 'flex', alignItems: 'center', gap: 8, flex: 2 }}>
                <input defaultValue={s.ingrediente} onBlur={e => actualizarCampoStock(s.id, 'ingrediente', e.target.value)} style={{ flex: 1 }} />
                {parseFloat(s.cantidad) <= 0 && <span className="entry-meta" style={{ color: 'var(--red)' }}>agotado</span>}
              </span>
              <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <input type="number" defaultValue={s.cantidad} onBlur={e => actualizarCampoStock(s.id, 'cantidad', e.target.value)} style={{ width: 80 }} />
                <input defaultValue={s.unidad} onBlur={e => actualizarCampoStock(s.id, 'unidad', e.target.value)} style={{ width: 60 }} />
                <button className="ghost" style={{ padding: '1px 6px', fontSize: 10 }} disabled={busyId === s.id} onClick={() => borrarStock(s.id)}>×</button>
              </span>
            </div>
          ))
        }
        {mostrarFormStock && (
        <form className="entry-form" style={{ marginTop: 14 }} onSubmit={guardarStock}>
          <div><label className="entry-meta">Ingrediente</label><input value={formStock.ingrediente} onChange={e => setFormStock({ ...formStock, ingrediente: e.target.value })} /></div>
          <div><label className="entry-meta">Cantidad</label><input type="number" min="0" step="0.1" value={formStock.cantidad} onChange={e => setFormStock({ ...formStock, cantidad: e.target.value })} /></div>
          <div><label className="entry-meta">Unidad</label><input value={formStock.unidad} onChange={e => setFormStock({ ...formStock, unidad: e.target.value })} /></div>
          <button type="submit" disabled={guardando} className="full">{guardando ? 'Guardando…' : '+ Guardar'}</button>
        </form>
        )}
      </div>
    </div>
  );
}

function RecordatoriosPropiedad({ propiedadId, recordatorios, onGuardar, onCompletar, onBorrar, onEditar }) {
  const [mostrarForm, setMostrarForm] = useState(false);
  const [titulo, setTitulo] = useState('');
  const [fecha, setFecha] = useState('');
  const [nota, setNota] = useState('');
  const [recurrente, setRecurrente] = useState(false);
  const [editandoId, setEditandoId] = useState(null);

  function submit(e) {
    e.preventDefault();
    onGuardar(titulo, fecha, nota, recurrente);
    setTitulo(''); setFecha(''); setNota(''); setRecurrente(false); setMostrarForm(false);
  }

  const pendientes = recordatorios.filter(r => !(r.completado === true || r.completado === 'true')).slice().sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
  const completados = recordatorios.filter(r => r.completado === true || r.completado === 'true');
  const hoy = new Date().toISOString().slice(0, 10);

  return (
    <div className="dash-card full">
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div className="dash-label" style={{ margin: 0 }}>🔔 Recordatorios</div>
        <button className={`add-toggle-btn ${mostrarForm ? 'cancel' : ''}`} onClick={() => setMostrarForm(!mostrarForm)}>{mostrarForm ? 'Cancelar' : '+ Añadir recordatorio'}</button>
      </div>
      <details style={{ marginBottom: 10 }}>
        <summary className="entry-meta" style={{ cursor: 'pointer' }}>¿Para qué sirve esto?</summary>
        <div className="entry-meta" style={{ marginTop: 6, lineHeight: 1.5 }}>Fechas límite que no quieres olvidar de esta propiedad — pago del impuesto predial, renovación de seguro, vencimiento de un contrato, etc. Aparecen como alerta en la lista de propiedades cuando faltan 30 días o menos. Si marcas "se repite cada año", al completarlo se crea solo el del año siguiente (misma fecha, un año después).</div>
      </details>
      {pendientes.length === 0 ? <div className="empty">Sin recordatorios pendientes.</div> :
        pendientes.map(r => {
          const editando = editandoId === r.id;
          return (
            <div key={r.id} style={{ borderBottom: '1px solid var(--line)', padding: '8px 0' }}>
              <div className="dash-row" style={{ borderTop: 'none' }}>
                <span style={{ color: r.fecha < hoy ? 'var(--red)' : undefined }}>{r.titulo}{(r.recurrente === true || r.recurrente === 'true') ? ' 🔁' : ''}{r.nota ? <span className="entry-meta"> — {r.nota}</span> : ''}</span>
                <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span className="entry-meta">{r.fecha}</span>
                  <button className="ghost" onClick={() => setEditandoId(editando ? null : r.id)}>{editando ? 'Cerrar' : 'Editar'}</button>
                  <button className="ghost" onClick={() => onCompletar(r)}>✓ Listo</button>
                  <button className="ghost" style={{ padding: '1px 6px', fontSize: 10 }} onClick={() => onBorrar(r.id)}>×</button>
                </span>
              </div>
              {editando && (
                <div style={{ display: 'flex', gap: 8, marginTop: 8, flexWrap: 'wrap', alignItems: 'center' }}>
                  <input defaultValue={r.titulo} onBlur={e => onEditar(r.id, 'titulo', e.target.value)} placeholder="Título" style={{ flex: 2 }} />
                  <input type="date" defaultValue={r.fecha} onBlur={e => onEditar(r.id, 'fecha', e.target.value)} />
                  <input defaultValue={r.nota} onBlur={e => onEditar(r.id, 'nota', e.target.value)} placeholder="Nota" style={{ flex: 2 }} />
                  <label className="checkbox-field">
                    <input type="checkbox" defaultChecked={r.recurrente === true || r.recurrente === 'true'} onChange={e => onEditar(r.id, 'recurrente', e.target.checked)} />
                    Se repite cada año
                  </label>
                </div>
              )}
            </div>
          );
        })
      }
      {mostrarForm && (
        <form className="entry-form" style={{ marginTop: 14 }} onSubmit={submit}>
          <div><label className="entry-meta">Título</label><input placeholder="ej. Impuesto predial" value={titulo} onChange={e => setTitulo(e.target.value)} /></div>
          <div><label className="entry-meta">Fecha límite</label><input type="date" value={fecha} onChange={e => setFecha(e.target.value)} /></div>
          <div className="full"><label className="entry-meta">Nota</label><input value={nota} onChange={e => setNota(e.target.value)} /></div>
          <label className="checkbox-field full"><input type="checkbox" checked={recurrente} onChange={e => setRecurrente(e.target.checked)} /> Se repite cada año (al completarlo, se crea solo el del año siguiente)</label>
          <button type="submit" className="full">+ Añadir</button>
        </form>
      )}
      {completados.length > 0 && (
        <details style={{ marginTop: 12 }}>
          <summary className="entry-meta" style={{ cursor: 'pointer' }}>Completados ({completados.length})</summary>
          {completados.map(r => <div key={r.id} className="dash-row" style={{ opacity: 0.5 }}><span>{r.titulo}</span><span className="entry-meta">{r.fecha}</span></div>)}
        </details>
      )}
    </div>
  );
}

        { nombre: 'Calabacín', emoji: '🥒', semis: [5], cosecha: [7, 8, 9, 10] },
        { nombre: 'Pepino', emoji: '🥒', semis: [5], cosecha: [7, 8, 9] },
        { nombre: 'Berenjena', emoji: '🍆', semis: [5], cosecha: [7, 8, 9, 10] },
        { nombre: 'Pimiento', emoji: '🫑', semis: [5], cosecha: [7, 8, 9, 10] },
        { nombre: 'Calabaza', emoji: '🎃', semis: [5], cosecha: [9, 10, 11] },
        { nombre: 'Fresa', emoji: '🍓', semis: [3, 9], cosecha: [5, 6, 7] },
      ]
    },
    {
      nombre: 'Legumbres', verduras: [
        { nombre: 'Fríjol (haricot)', emoji: '🫘', semis: [4, 5, 6, 7], cosecha: [7, 8, 9, 10] },
        { nombre: 'Guisante (petit pois)', emoji: '🟢', semis: [2, 3, 4], cosecha: [5, 6, 7] },
        { nombre: 'Haba', emoji: '🫛', semis: [10, 11, 2, 3], cosecha: [5, 6, 7] },
      ]
    },
  ];

  const [categoriaFiltro, setCategoriaFiltro] = useState('Todas');
  const hoy = new Date();
  const mesActual = hoy.getMonth() + 1;

  const categoriasFiltradas = categoriaFiltro === 'Todas' ? CATEGORIAS : CATEGORIAS.filter(c => c.nombre === categoriaFiltro);

  return (
    <div>
      <div className="entry-meta" style={{ marginBottom: 16, lineHeight: 1.6 }}>
        Calendario de referencia para clima oceánico (costa atlántica francesa, incluye La Rochelle) — es orientativo, ajusta según el microclima real de tu jardín y verifica con un vivero local para variedades específicas.
      </div>

      <div style={{ display: 'flex', gap: 16, marginBottom: 16, flexWrap: 'wrap' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
          <span style={{ width: 14, height: 14, borderRadius: 3, background: '#33b679', display: 'inline-block' }}></span>
          <span className="entry-meta">Sembrar / plantar</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
          <span style={{ width: 14, height: 14, borderRadius: 3, background: '#f4511e', display: 'inline-block' }}></span>
          <span className="entry-meta">Cosechar</span>
        </div>
      </div>

      <div style={{ display: 'flex', gap: 6, marginBottom: 20, flexWrap: 'wrap' }}>
        {['Todas', ...CATEGORIAS.map(c => c.nombre)].map(cat => (
          <button key={cat} className={categoriaFiltro === cat ? '' : 'ghost'} style={{ fontSize: 12, padding: '5px 12px' }} onClick={() => setCategoriaFiltro(cat)}>{cat}</button>
        ))}
      </div>

      {categoriasFiltradas.map(cat => (
        <div key={cat.nombre} className="dash-card full">
          <div className="dash-label">{cat.nombre}</div>
          <div style={{ overflowX: 'auto' }}>
            <table style={{ borderCollapse: 'collapse', width: '100%', minWidth: 560 }}>
              <thead>
                <tr>
                  <th style={{ textAlign: 'left', padding: '4px 8px', fontSize: 11, color: 'var(--ink-faint)', fontFamily: "'IBM Plex Mono', monospace" }}></th>
                  {MESES.map((m, i) => (
                    <th key={i} style={{
                      padding: '4px 2px', fontSize: 10, fontFamily: "'IBM Plex Mono', monospace",
                      color: (i + 1) === mesActual ? 'var(--accent)' : 'var(--ink-faint)', fontWeight: (i + 1) === mesActual ? 700 : 400,
                    }}>{m}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {cat.verduras.map(v => (
                  <tr key={v.nombre}>
                    <td style={{ padding: '5px 8px', fontSize: 13, whiteSpace: 'nowrap' }}>{v.emoji} {v.nombre}</td>
                    {MESES.map((_, i) => {
                      const mes = i + 1;
                      const esSemis = v.semis.includes(mes);
                      const esCosecha = v.cosecha.includes(mes);
                      const color = esSemis && esCosecha ? 'linear-gradient(90deg, #33b679 50%, #f4511e 50%)' : esSemis ? '#33b679' : esCosecha ? '#f4511e' : 'var(--surface-2)';
                      return (
                        <td key={i} style={{ padding: 2, textAlign: 'center' }}>
                          <div style={{
                            height: 18, borderRadius: 3, background: color,
                            border: mes === mesActual ? '1px solid var(--ink)' : '1px solid transparent',
                          }}></div>
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      ))}
    </div>
  );
}

function CultivosTab() {
  const [cultivos, setCultivos] = useState(null);
  const [riegos, setRiegos] = useState([]);
  const [cuidados, setCuidados] = useState([]);
  const [cosechas, setCosechas] = useState([]);
  const [vista, setVista] = useState('lista');
  const [vistaSuperior, setVistaSuperior] = useState('cultivos'); // 'cultivos' | 'calendario'
  const [cultivoId, setCultivoId] = useState(null);
  const [tabActiva, setTabActiva] = useState('resumen');
  const [mostrarForm, setMostrarForm] = useState(false);
  const [mostrarFormRiego, setMostrarFormRiego] = useState(false);
  const [mostrarFormCuidado, setMostrarFormCuidado] = useState(false);
  const [mostrarFormCosecha, setMostrarFormCosecha] = useState(false);
  const [formCultivo, setFormCultivo] = useState({ nombre: '', variedad: '', ubicacion: '', fecha_siembra: '', estado: 'Semilla', notas: '' });
  const [formRiego, setFormRiego] = useState({ fecha: new Date().toISOString().slice(0, 10), cantidad_agua: '', nota: '' });
  const [formCuidado, setFormCuidado] = useState({ fecha: new Date().toISOString().slice(0, 10), tipo: 'Fertilización', nota: '' });
  const [formCosecha, setFormCosecha] = useState({ fecha: new Date().toISOString().slice(0, 10), cantidad: '', unidad: '', nota: '' });
  const [guardando, setGuardando] = useState(false);
  const [busyId, setBusyId] = useState(null);

  const ESTADOS = ['Semilla', 'Germinando', 'Creciendo', 'Floración', 'Cosecha', 'Finalizado'];
  const TIPOS_CUIDADO = ['Fertilización', 'Poda', 'Control de plagas', 'Trasplante', 'Otro'];

  function load() {
    apiCall('list', { sheet: 'Cultivos' }).then(res => setCultivos(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Riegos_Cultivo' }).then(res => setRiegos(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Cuidados_Cultivo' }).then(res => setCuidados(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Cosechas_Cultivo' }).then(res => setCosechas(Array.isArray(res) ? res : []));
  }
  useEffect(load, []);

  function abrirDetalle(id) { setCultivoId(id); setTabActiva('resumen'); setVista('detalle'); }
  function volverALista() { setVista('lista'); setCultivoId(null); }

  function guardarCultivo(e) {
    e.preventDefault();
    if (!formCultivo.nombre || guardando) return;
    setGuardando(true);
    apiCall('create', { sheet: 'Cultivos', data: formCultivo }).then(() => {
      setFormCultivo({ nombre: '', variedad: '', ubicacion: '', fecha_siembra: '', estado: 'Semilla', notas: '' });
      setGuardando(false); setMostrarForm(false); load();
    });
  }

  function borrarCultivo(id) {
    if (busyId) return;
    setBusyId(id);
    apiCall('delete', { sheet: 'Cultivos', id }).then(() => { setBusyId(null); volverALista(); load(); });
  }

  function editarCultivo(id, campo, valor) {
    apiCall('update', { sheet: 'Cultivos', data: { id, [campo]: valor } }).then(load);
  }

  function guardarRiego(cultivoId, e) {
    e.preventDefault();
    if (guardando) return;
    setGuardando(true);
    apiCall('create', { sheet: 'Riegos_Cultivo', data: { ...formRiego, cultivo_id: cultivoId } }).then(() => {
      setFormRiego({ fecha: new Date().toISOString().slice(0, 10), cantidad_agua: '', nota: '' });
      setGuardando(false); setMostrarFormRiego(false); load();
    });
  }
  function editarRiego(id, campo, valor) { apiCall('update', { sheet: 'Riegos_Cultivo', data: { id, [campo]: valor } }).then(load); }
  function borrarRiego(id) { apiCall('delete', { sheet: 'Riegos_Cultivo', id }).then(load); }

  function guardarCuidado(cultivoId, e) {
    e.preventDefault();
    if (guardando) return;
    setGuardando(true);
    apiCall('create', { sheet: 'Cuidados_Cultivo', data: { ...formCuidado, cultivo_id: cultivoId } }).then(() => {
      setFormCuidado({ fecha: new Date().toISOString().slice(0, 10), tipo: 'Fertilización', nota: '' });
      setGuardando(false); setMostrarFormCuidado(false); load();
    });
  }
  function editarCuidado(id, campo, valor) { apiCall('update', { sheet: 'Cuidados_Cultivo', data: { id, [campo]: valor } }).then(load); }
  function borrarCuidado(id) { apiCall('delete', { sheet: 'Cuidados_Cultivo', id }).then(load); }

  function guardarCosecha(cultivoId, e) {
    e.preventDefault();
    if (!formCosecha.cantidad || guardando) return;
    setGuardando(true);
    apiCall('create', { sheet: 'Cosechas_Cultivo', data: { ...formCosecha, cultivo_id: cultivoId } }).then(() => {
      setFormCosecha({ fecha: new Date().toISOString().slice(0, 10), cantidad: '', unidad: '', nota: '' });
      setGuardando(false); setMostrarFormCosecha(false); load();
    });
  }
  function editarCosecha(id, campo, valor) { apiCall('update', { sheet: 'Cosechas_Cultivo', data: { id, [campo]: valor } }).then(load); }
  function borrarCosecha(id) { apiCall('delete', { sheet: 'Cosechas_Cultivo', id }).then(load); }

  if (!cultivos) return <div className="empty">Cargando…</div>;

  // ── VISTA: LISTA ──────────────────────────────────────────────────────────
  if (vista === 'lista') {
    return (
      <div>
        <div className="detail-tabs">
          <button className={`detail-tab ${vistaSuperior === 'cultivos' ? 'active' : ''}`} onClick={() => setVistaSuperior('cultivos')}>Mis cultivos</button>
          <button className={`detail-tab ${vistaSuperior === 'calendario' ? 'active' : ''}`} onClick={() => setVistaSuperior('calendario')}>📅 Calendario de temporadas</button>
        </div>

        {vistaSuperior === 'calendario' ? <CalendarioTemporadas /> : (
        <React.Fragment>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
          <div className="page-title" style={{ margin: 0 }}>Cultivos</div>
          <button onClick={() => setMostrarForm(!mostrarForm)}>{mostrarForm ? 'Cancelar' : '+ Nuevo cultivo'}</button>
        </div>

        {mostrarForm && (
          <form className="entry-form" onSubmit={guardarCultivo} style={{ marginBottom: 24 }}>
            <div><label className="entry-meta">Nombre</label><input value={formCultivo.nombre} onChange={e => setFormCultivo({ ...formCultivo, nombre: e.target.value })} /></div>
            <div><label className="entry-meta">Variedad / especie</label><input value={formCultivo.variedad} onChange={e => setFormCultivo({ ...formCultivo, variedad: e.target.value })} /></div>
            <div><label className="entry-meta">Ubicación</label><input placeholder="ej. balcón, jardín trasero" value={formCultivo.ubicacion} onChange={e => setFormCultivo({ ...formCultivo, ubicacion: e.target.value })} /></div>
            <div><label className="entry-meta">Fecha de siembra</label><input type="date" value={formCultivo.fecha_siembra} onChange={e => setFormCultivo({ ...formCultivo, fecha_siembra: e.target.value })} /></div>
            <div><label className="entry-meta">Estado</label>
              <select value={formCultivo.estado} onChange={e => setFormCultivo({ ...formCultivo, estado: e.target.value })}>
                {ESTADOS.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>
            <div className="full"><label className="entry-meta">Notas</label><textarea className="full" rows={2} value={formCultivo.notas} onChange={e => setFormCultivo({ ...formCultivo, notas: e.target.value })}></textarea></div>
            <button type="submit" disabled={guardando} className="full">{guardando ? 'Guardando…' : '+ Crear cultivo'}</button>
          </form>
        )}

        {cultivos.length === 0 ? <div className="empty">Sin cultivos todavía.</div> : (
          <div className="log">
            {cultivos.map(c => {
              const ultimoRiego = riegos.filter(r => r.cultivo_id === c.id).slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''))[0];
              return (
                <div key={c.id} className="entry" style={{ cursor: 'pointer' }} onClick={() => abrirDetalle(c.id)}>
                  <div className="entry-main">
                    <div className="entry-title">{c.nombre}</div>
                    <div className="entry-meta">{c.variedad ? c.variedad + ' · ' : ''}{c.ubicacion ? c.ubicacion + ' · ' : ''}{c.estado}{ultimoRiego ? ' · último riego: ' + ultimoRiego.fecha : ' · sin riegos registrados'}</div>
                  </div>
                  <div>→</div>
                </div>
              );
            })}
          </div>
        )}
        </React.Fragment>
        )}
      </div>
    );
  }

  // ── VISTA: DETALLE ────────────────────────────────────────────────────────
  const c = cultivos.find(x => x.id === cultivoId);
  if (!c) { volverALista(); return null; }
  const riegosCultivo = riegos.filter(r => r.cultivo_id === c.id).slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
  const cuidadosCultivo = cuidados.filter(cu => cu.cultivo_id === c.id).slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
  const cosechasCultivo = cosechas.filter(co => co.cultivo_id === c.id).slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));

  return (
    <div>
      <span className="detail-breadcrumb" onClick={volverALista}>← volver a cultivos</span>

        <div className="detail-title">{c.nombre}</div>
        <div className="detail-meta">{c.variedad ? c.variedad + ' · ' : ''}{c.ubicacion} · {c.estado}</div>
      </div>

      <div className="detail-tabs">
        {[['resumen', 'Resumen'], ['riegos', 'Riegos'], ['cuidados', 'Cuidados'], ['cosechas', 'Cosechas']].map(([key, label]) => (
          <button key={key} className={`detail-tab ${tabActiva === key ? 'active' : ''}`} onClick={() => setTabActiva(key)}>{label}</button>
        ))}
      </div>

      {tabActiva === 'resumen' && (
        <div>
          <div className="stat-row">
            <div className="stat-card"><div className="stat-card-label">Riegos registrados</div><div className="stat-card-value">{riegosCultivo.length}</div>{riegosCultivo[0] && <div className="stat-card-sub">último: {riegosCultivo[0].fecha}</div>}</div>
            <div className="stat-card"><div className="stat-card-label">Cuidados registrados</div><div className="stat-card-value">{cuidadosCultivo.length}</div>{cuidadosCultivo[0] && <div className="stat-card-sub">último: {cuidadosCultivo[0].fecha}</div>}</div>
            <div className="stat-card"><div className="stat-card-label">Cosechas</div><div className="stat-card-value">{cosechasCultivo.length}</div>{cosechasCultivo[0] && <div className="stat-card-sub">última: {cosechasCultivo[0].fecha}</div>}</div>
          </div>
          <div className="dash-card full">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
              <div className="dash-label" style={{ margin: 0 }}>Ficha del cultivo</div>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(160px, 1fr))', gap: 14 }}>

              <div><div className="entry-meta">Variedad / especie</div><input defaultValue={c.variedad} onBlur={e => editarCultivo(c.id, 'variedad', e.target.value)} /></div>
              <div><div className="entry-meta">Ubicación</div><input defaultValue={c.ubicacion} onBlur={e => editarCultivo(c.id, 'ubicacion', e.target.value)} /></div>
              <div><div className="entry-meta">Fecha de siembra</div><input type="date" defaultValue={c.fecha_siembra} onBlur={e => editarCultivo(c.id, 'fecha_siembra', e.target.value)} /></div>
              <div><div className="entry-meta">Estado</div>
                <select defaultValue={c.estado} onChange={e => editarCultivo(c.id, 'estado', e.target.value)}>

                </select>
              </div>
            </div>
            <div style={{ marginTop: 14 }}>
              <div className="entry-meta">Notas</div>
              <textarea className="full" rows={3} defaultValue={c.notas} onBlur={e => editarCultivo(c.id, 'notas', e.target.value)}></textarea>

          </div>
        </div>
      )}

        <div className="dash-card full">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div className="dash-label" style={{ margin: 0 }}>💧 Riegos</div>
            <button className={`add-toggle-btn ${mostrarFormRiego ? 'cancel' : ''}`} onClick={() => setMostrarFormRiego(!mostrarFormRiego)}>{mostrarFormRiego ? 'Cancelar' : '+ Registrar riego'}</button>
          </div>
          {riegosCultivo.length === 0 ? <div className="empty">Sin riegos registrados.</div> :
            riegosCultivo.map(r => (

            <div><label className="entry-meta">Cantidad de agua (opcional)</label><input type="number" min="0" value={formRiego.cantidad_agua} onChange={e => setFormRiego({ ...formRiego, cantidad_agua: e.target.value })} /></div>
            <div className="full"><label className="entry-meta">Nota</label><input value={formRiego.nota} onChange={e => setFormRiego({ ...formRiego, nota: e.target.value })} /></div>
            <button type="submit" disabled={guardando} className="full">{guardando ? 'Guardando…' : '+ Registrar'}</button>
          </form>
          )}
        </div>
      )}

      {tabActiva === 'cuidados' && (
        <div className="dash-card full">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div className="dash-label" style={{ margin: 0 }}>🌱 Cuidados (fertilización, poda, plagas, trasplante)</div>
            <button className={`add-toggle-btn ${mostrarFormCuidado ? 'cancel' : ''}`} onClick={() => setMostrarFormCuidado(!mostrarFormCuidado)}>{mostrarFormCuidado ? 'Cancelar' : '+ Registrar cuidado'}</button>
          </div>
          {cuidadosCultivo.length === 0 ? <div className="empty">Sin cuidados registrados.</div> :

            <div className="full"><label className="entry-meta">Nota</label><input value={formCuidado.nota} onChange={e => setFormCuidado({ ...formCuidado, nota: e.target.value })} /></div>
            <button type="submit" disabled={guardando} className="full">{guardando ? 'Guardando…' : '+ Registrar'}</button>
          </form>
          )}
        </div>
      )}

      {tabActiva === 'cosechas' && (
        <div className="dash-card full">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div className="dash-label" style={{ margin: 0 }}>🌾 Cosechas</div>
            <button className={`add-toggle-btn ${mostrarFormCosecha ? 'cancel' : ''}`} onClick={() => setMostrarFormCosecha(!mostrarFormCosecha)}>{mostrarFormCosecha ? 'Cancelar' : '+ Registrar cosecha'}</button>
          </div>
          {cosechasCultivo.length === 0 ? <div className="empty">Sin cosechas registradas.</div> :
            cosechasCultivo.map(co => (
              <div key={co.id} className="dash-row">
                <span>{co.fecha}{co.nota ? <span className="entry-meta"> — {co.nota}</span> : ''}</span>
                <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span className="entry-meta">{co.cantidad} {co.unidad}</span>
                  <button className="ghost" style={{ padding: '1px 6px', fontSize: 10 }} onClick={() => borrarCosecha(co.id)}>×</button>
                </span>
              </div>
            ))
          }
          {mostrarFormCosecha && (

  const valorTotal = items.reduce((acc, it) => {

  const gananciaTotal = items.reduce((acc, it) => {

      <button className={`add-toggle-btn ${showForm ? 'cancel' : ''}`} onClick={() => setShowForm(!showForm)}>

        items.length === 0 ? <div className="empty">Sin posiciones registradas.</div> :
        <div className="log">
          {items.map(it => {
            const q = cotizaciones[it.ticker];
            const cantidad = parseFloat(it.cantidad) || 0;

                </div>
              </div>
            );
