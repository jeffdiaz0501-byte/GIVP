<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Bitácora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #11131A;
    --surface: #181B23;
    --surface-2: #20242E;
    --ink: #EDEFF3;
    --ink-soft: #868C9A;
    --ink-faint: #565C69;
    --line: #262B36;
    --accent: #4C7EF3;
    --accent-dim: #2B4A8C;
    --red: #E5555A;
    --green: #3FCB8C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .shell { display: flex; min-height: 100vh; }

  /* ── Sidebar ─────────────────────────────────────────────── */
  .sidebar {
    width: 232px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--line);
    padding: 24px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .brand {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: -0.01em;
    padding: 0 10px 22px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--accent); }
  .nav-section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    padding: 14px 10px 6px;
  }
  .nav-item {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    color: var(--ink-soft);
    border: none;
    border-radius: 6px;
    padding: 9px 10px;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--ink); }
  .nav-item.active { background: var(--accent-dim); color: #fff; }
  .nav-sub { padding: 2px 0 6px 14px; display: flex; flex-direction: column; gap: 1px; }
  .nav-sub-item {
    display: block; width: 100%; text-align: left;
    background: transparent; border: none; border-left: 2px solid var(--line);
    color: var(--ink-soft); padding: 7px 10px; border-radius: 0 6px 6px 0;
    font-family: 'Inter', sans-serif; font-size: 12.5px; cursor: pointer;
  }
  .nav-sub-item:hover { background: var(--surface-2); color: var(--ink); }
  .nav-sub-item.active { border-left-color: var(--accent); color: var(--accent); font-weight: 600; background: var(--surface-2); }

  /* ── Layout principal ────────────────────────────────────── */
  .main { flex: 1; min-width: 0; }
  .topbar-mobile { display: none; }
  .content { max-width: 760px; margin: 0 auto; padding: 40px 32px 80px; }
  .page-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 22px;
    margin: 0 0 4px;
  }
  .page-sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 24px; }

  /* ── Login ───────────────────────────────────────────────── */
  .login-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card {
    width: 100%; max-width: 340px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 32px;
  }
  .login-card h1 { font-family: 'Space Grotesk', sans-serif; font-size: 19px; margin: 0 0 4px; }
  .login-card p { color: var(--ink-soft); font-size: 13px; margin: 0 0 22px; }

  /* ── Controles ───────────────────────────────────────────── */
  input, select, textarea {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface-2);
    color: var(--ink);
  }
  input::placeholder { color: var(--ink-faint); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #5D8BF5; }
  button.ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  button.ghost:hover { color: var(--ink); border-color: var(--ink-faint); }
  button:disabled { opacity: 0.5; cursor: default; }
  .error-msg { color: var(--red); font-size: 13px; margin-top: 12px; }

  /* ── Formularios de módulo ───────────────────────────────── */
  .entry-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 22px;
    padding: 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .entry-form .full { grid-column: 1 / -1; }
  .entry-form button { grid-column: 1 / -1; }
  .entry-form label.checkbox-field { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); }
  .entry-form label.checkbox-field input { width: auto; }
  .add-toggle-btn { margin-bottom: 16px; display: inline-flex; align-items: center; gap: 6px; }
  .add-toggle-btn.cancel { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }

  .inner-tabs { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  .inner-tab {
    background: transparent; color: var(--ink-soft); border: 1px solid var(--line);
    padding: 7px 14px; font-size: 13px; font-weight: 500; border-radius: 6px; cursor: pointer;
  }
  .inner-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .account-row-editform { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .account-row-editform .full { grid-column: 1 / -1; }
  .account-row-editform button { grid-column: 1 / -1; }
  .releve-history { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .releve-history-item { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 8px; background: var(--surface-2); border-radius: 5px; }
  .releve-history-item.no-coincide { border-left: 2px solid var(--red); }
  .mes-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 6px; }
  .mes-chip { text-align: center; padding: 6px 0; border-radius: 5px; font-size: 11px; background: var(--surface-2); color: var(--ink-faint); border: 1px solid var(--line); }
  .mes-chip.subido { background: var(--green); color: #fff; border-color: var(--green); font-weight: 600; }

  /* ── Listado de entradas ─────────────────────────────────── */
  .log { display: flex; flex-direction: column; gap: 8px; }
  .entry {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 15px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .entry.done { opacity: 0.5; }
  .entry-main { flex: 1; }
  .entry-title { font-size: 14px; font-weight: 500; }
  .entry-meta { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); margin-top: 3px; }
  .entry-amount { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; }
  .entry-amount.gasto { color: var(--red); }
  .entry-amount.ingreso { color: var(--green); }
  .entry-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .entry-actions button { padding: 5px 9px; font-size: 11px; }
  .empty { color: var(--ink-faint); font-size: 13px; padding: 24px 0; text-align: center; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .footer { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-faint); text-align: center; margin-top: 48px; }

  /* ── Dashboard ───────────────────────────────────────────── */
  .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .dash-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  .dash-card.full { grid-column: 1 / -1; }
  .dash-label { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); margin-bottom: 8px; }
  .dash-value { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 600; }
  .dash-row { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .dash-row:first-of-type { border-top: none; }
  .agenda-row, .correo-row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .agenda-row:first-of-type, .correo-row:first-of-type { border-top: none; }
  .agenda-row .entry-meta, .correo-row .entry-meta { white-space: nowrap; }
  .integration-error { color: var(--ink-faint); font-size: 12px; padding: 8px 0; }

  .alert-card { border-color: var(--red) !important; }
  .alert-card .dash-label { color: var(--red); }
  .ocr-preview { white-space: pre-wrap; font-size: 11px; background: var(--surface-2); padding: 8px; border-radius: 6px; margin-top: 6px; max-height: 220px; overflow: auto; font-family: 'IBM Plex Mono', monospace; }
  .account-row { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 13px 15px; margin-bottom: 8px; }
  .account-row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .account-upload { display: flex; gap: 8px; align-items: center; }
  .account-upload input[type="file"] { font-size: 12px; }

  .multiselect-field { display: flex; flex-direction: column; gap: 8px; }
  .multiselect-options { display: flex; flex-wrap: wrap; gap: 10px; }

  .agenda-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  .agenda-views { display: flex; gap: 6px; }
  .agenda-nav { display: flex; gap: 6px; align-items: center; }
  .agenda-nav button { padding: 7px 11px; font-size: 12px; }
  .agenda-day-title { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; margin-bottom: 12px; text-transform: capitalize; }

  .agenda-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; width: 100%; box-sizing: border-box; }
  .agenda-week-col { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px; cursor: pointer; min-height: 56px; min-width: 0; box-sizing: border-box; overflow: hidden; }
  .agenda-week-col:hover { border-color: var(--accent); }
  .agenda-week-col-header { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; color: var(--ink-faint); text-align: center; margin-bottom: 6px; line-height: 1.4; }
  .agenda-week-event { font-size: 11px; border-radius: 4px; padding: 3px 5px; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-left: 3px solid var(--accent); background: var(--surface-2); }
  .agenda-week-empty { font-size: 11px; color: var(--ink-faint); text-align: center; padding-top: 8px; }
  .agenda-week-more { font-size: 10px; color: var(--ink-faint); text-align: center; }

  .agenda-month-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
  .agenda-month-weekdays div { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; color: var(--ink-faint); text-align: center; }
  .agenda-month { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 92px; gap: 6px; }
  .agenda-month-cell { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px; cursor: pointer; box-sizing: border-box; overflow: hidden; }
  .agenda-month-cell:hover { border-color: var(--accent); }
  .agenda-month-cell.fuera { opacity: 0.35; }
  .agenda-month-daynum { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; }
  .agenda-month-event { font-size: 10px; background: var(--surface-2); border-radius: 3px; padding: 2px 4px; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-left: 3px solid var(--accent); }
  .agenda-month-more { font-size: 9px; color: var(--ink-faint); }

  /* ── Kanban ──────────────────────────────────────────────── */
  .kanban-toolbar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
  .kanban-toolbar select { width: auto; min-width: 180px; }
  .kanban-board { display: flex; gap: 12px; margin-bottom: 8px; }
  .kanban-col { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .kanban-col.drag-over { border-color: var(--accent); }
  .kanban-col-header {
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-faint); padding: 4px 6px 10px;
  }
  .kanban-col-count { background: var(--surface-2); border-radius: 10px; padding: 1px 7px; }
  .kanban-cards { display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
  .kanban-card {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; cursor: grab; font-size: 13px;
  }
  .kanban-card:active { cursor: grabbing; }
  .kanban-card.busy { opacity: 0.55; cursor: default; }
  .kanban-card-title { font-weight: 500; margin-bottom: 5px; }
  .kanban-card-meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .chip {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; padding: 2px 7px;
    border-radius: 4px; background: var(--surface); color: var(--ink-soft); border: 1px solid var(--line);
  }
  .chip.prioridad-alta { color: var(--red); border-color: var(--red); }
  .kanban-card-actions { display: flex; gap: 4px; margin-top: 8px; }
  .kanban-card-actions button { font-size: 10px; padding: 4px 7px; }

  /* ── Barra de progreso ───────────────────────────────────── */
  .progress-bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin: 6px 0 2px; }
  .bar-doble { display: flex; flex-direction: column; gap: 3px; margin: 6px 0 2px; }
  .bar-doble .progress-bar { margin: 0; }
  .bar-doble-label { font-size: 10px; color: var(--ink-faint); width: 46px; display: inline-block; }
  .bar-centro { position: relative; height: 8px; border-radius: 3px; background: var(--surface-2); margin: 6px 0 2px; overflow: hidden; }
  .bar-centro-fill { position: absolute; top: 0; height: 100%; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; }

  /* ── Resumen de Productividad ────────────────────────────── */
  .resumen-section { margin-bottom: 32px; }
  .resumen-section h3 {
    font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600;
    margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline;
  }
  .resumen-section h3 a { font-family: 'Inter', sans-serif; font-size: 12px; color: var(--accent); cursor: pointer; font-weight: 500; }
  .meta-row { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; }
  .meta-row-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .meta-row-top .meta-title { font-weight: 500; cursor: pointer; }
  .hitos-list { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .hito-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .hito-row input[type="checkbox"] { width: auto; }
  .hito-row.completado span.hito-title { text-decoration: line-through; color: var(--ink-faint); }
  .hito-title { flex: 1; }
  .hito-add { display: flex; gap: 6px; margin-top: 8px; }
  .hito-add input { flex: 1; }
  .hito-add button { padding: 8px 12px; font-size: 12px; }

  /* ── Responsive: sidebar se convierte en menú deslizante ────── */
  @media (max-width: 780px) {
    .sidebar {
      position: fixed; top: 0; left: 0; height: 100%; z-index: 40;
      transform: translateX(-100%);
      transition: transform 0.2s ease;
      box-shadow: 4px 0 24px rgba(0,0,0,0.4);
    }
    .sidebar.open { transform: translateX(0); }
    .backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 30;
    }
    .topbar-mobile {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 20px; border-bottom: 1px solid var(--line);
    }
    .menu-btn {
      background: var(--surface); border: 1px solid var(--line); color: var(--ink);
      padding: 7px 11px; border-radius: 6px;
    }
    .content { padding: 28px 20px 80px; }
    .dashboard-grid { grid-template-columns: 1fr; }
    .entry-form { grid-template-columns: 1fr; }
    .kanban-board { flex-direction: column; }
    .agenda-week { grid-template-columns: 1fr; }
    .agenda-month { grid-auto-rows: 52px; }
    .agenda-month-cell { padding: 4px; }
    .agenda-month-event { display: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

// EDITA ESTA LÍNEA con la URL /exec de tu Apps Script
const API_URL = 'https://script.google.com/macros/s/AKfycbzyiNpF_5-LtQllyu5D_o78di1NftdL_j-Nib44hNh4pSWD3xvLNHpyxGYqg1-lPKH5/exec';
const FRONTEND_VERSION = 'v2.4.0';

const CATEGORIAS_TAREAS = ['Trabajo', 'Personal', 'Hogar', 'Salud', 'Finanzas', 'Ocio', 'Estudio', 'Otro'];

const CATEGORIAS_TRANSACCIONES = {
  'Vivienda': ['Alquiler', 'Mantenimiento', 'Comunidad'],
  'Créditos': ['Hipoteca', 'Préstamo personal', 'Préstamo coche'],
  'Alimentación': ['Supermercado', 'Restaurantes', 'Comida rápida', 'Cafetería'],
  'Transporte': ['Transporte público', 'Combustible', 'Taxi / VTC', 'Mantenimiento vehículo'],
  'Ocio': ['Salidas', 'Suscripciones digitales', 'Viajes', 'Deporte'],
  'Salud': ['Farmacia', 'Médico', 'Seguro salud'],
  'Servicios': ['Electricidad', 'Agua', 'Internet / Móvil', 'Comisiones bancarias'],
  'Ingresos': ['Salario', 'Transferencias', 'Reembolsos', 'Otros ingresos'],
  'Otros': ['Varios', 'Sin clasificar'],
};

function apiCall(action, extra) {
  const token = localStorage.getItem('bitacora_token');
  return fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(Object.assign({ action, token }, extra)),
  })
    .then(r => r.text())
    .then(text => {
      try {
        const parsed = JSON.parse(text);
        if (parsed && parsed.error === 'unauthorized') {
          localStorage.removeItem('bitacora_token');
          window.location.reload();
        }
        return parsed;
      } catch (e) {
        return { error: 'respuesta_invalida', message: 'El servidor no devolvió JSON válido (posible bloqueo de cookies de terceros al probar en local, o la URL del backend cambió).' };
      }
    })
    .catch(() => ({ error: 'network_error', message: 'No se pudo conectar con el backend.' }));
}

function f(name, label, type, options) {
  return { name, label, type: type || 'text', options };
}

const MODULES_GENERIC = [
  { key: 'Deudas', label: 'Deudas', group: 'Finanzas', fields: [
    f('acreedor', 'Acreedor'), f('monto_total', 'Monto total', 'number'), f('tasa_interes', 'Tasa interés %', 'number'),
    f('cuota_mensual', 'Cuota mensual', 'number'), f('fecha_inicio', 'Fecha inicio', 'date'),
    f('fecha_proximo_pago', 'Próximo pago', 'date'), f('estado', 'Estado', 'select', ['activa', 'pagada']),
  ]},
  { key: 'Pagos_Deudas', label: 'Pagos de deudas', group: 'Finanzas', fields: [
    f('deuda_id', 'ID de deuda'), f('fecha', 'Fecha', 'date'), f('monto', 'Monto', 'number'), f('nota', 'Nota'),
  ]},
  { key: 'Patrimonio_Snapshot', label: 'Patrimonio neto', group: 'Finanzas', fields: [
    f('fecha', 'Fecha', 'date'), f('total_bolsa', 'Total bolsa', 'number'), f('total_ahorros', 'Total ahorros', 'number'),
    f('total_deudas', 'Total deudas', 'number'), f('patrimonio_neto', 'Patrimonio neto', 'number'), f('nota', 'Nota'),
  ]},
  { key: 'Facturas_Servicios', label: 'Facturas de servicios', group: 'Finanzas', fields: [
    f('servicio', 'Servicio'), f('fecha', 'Fecha', 'date'), f('monto', 'Monto', 'number'),

function Login({ onLogin }) {
  const [password, setPassword] = useState('');
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(false);

  function submit(e) {
    e.preventDefault();
    setLoading(true);
    setError(null);
    fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', password }) })
      .then(r => r.json())
      .then(res => {
        setLoading(false);
        if (res.token) {
          localStorage.setItem('bitacora_token', res.token);
          onLogin();
        } else if (res.error === 'locked') {
          setError(`Bloqueado. Intenta en ${res.minutesLeft} min.`);
        } else {
          setError('Contraseña incorrecta.');
        }
      })
      .catch(() => { setLoading(false); setError('No se pudo conectar.'); });
  }

  return (
    <div className="login-shell">
      <div className="login-card">
        <h1>Bitácora</h1>
        <p>Acceso privado</p>
        <form onSubmit={submit}>
          <input type="password" placeholder="Contraseña" value={password}
            onChange={e => setPassword(e.target.value)} autoFocus />
          <div style={{ height: 12 }} />
          <button type="submit" disabled={loading} style={{ width: '100%' }}>{loading ? 'Entrando...' : 'Entrar'}</button>
        </form>
        {error && <div className="error-msg">{error}</div>}
      </div>
    </div>
  );
}

// Agrupa una fecha "YYYY-MM-DD" según la granularidad elegida, para poder
// mostrar el mismo desglose de ingreso/gasto en distintas escalas de tiempo.
function claveDePeriodo(fecha, granularidad) {
  if (!fecha) return null;
  const [anio, mes] = fecha.slice(0, 7).split('-');
  if (granularidad === 'mes') return anio + '-' + mes;
  if (granularidad === 'trimestre') return anio + '-T' + Math.ceil(parseInt(mes, 10) / 3);
  if (granularidad === 'año') return anio;
  return 'total';
}

function GraficoLinea({ puntos }) {
  if (!puntos || puntos.length < 2) {
    return <div className="empty">Necesitas al menos 2 puntos registrados para ver la evolución.</div>;
  }
  const W = 640, H = 220, PAD = 30;
  const valores = puntos.map(p => p.valor);
  const min = Math.min(...valores), max = Math.max(...valores);
  const rango = (max - min) || 1;
  const x = i => PAD + (i / (puntos.length - 1)) * (W - PAD * 2);
  const y = v => H - PAD - ((v - min) / rango) * (H - PAD * 2);

  const subiendo = puntos[puntos.length - 1].valor >= puntos[0].valor;
  const color = subiendo ? 'var(--green)' : 'var(--red)';
  const lineaPuntos = puntos.map((p, i) => `${x(i)},${y(p.valor)}`).join(' ');
  const areaPuntos = `${x(0)},${H - PAD} ${lineaPuntos} ${x(puntos.length - 1)},${H - PAD}`;

  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 220 }}>
        <line x1={PAD} y1={H - PAD} x2={W - PAD} y2={H - PAD} stroke="var(--line)" strokeWidth="1" />
        <polygon points={areaPuntos} fill={color} opacity="0.12" />
        <polyline points={lineaPuntos} fill="none" stroke={color} strokeWidth="2" />
        {puntos.map((p, i) => <circle key={i} cx={x(i)} cy={y(p.valor)} r="3" fill={color} />)}
        <text x={PAD} y={H - 8} fontSize="10" fill="var(--ink-faint)">{puntos[0].label}</text>
        <text x={W - PAD} y={H - 8} fontSize="10" fill="var(--ink-faint)" textAnchor="end">{puntos[puntos.length - 1].label}</text>
      </svg>
      <div className="dash-row" style={{ borderTop: 'none' }}>
        <span className="entry-meta">{puntos[0].label}: {puntos[0].valor.toFixed(2)} €</span>
        <span className="entry-meta" style={{ color }}>{puntos[puntos.length - 1].label}: {puntos[puntos.length - 1].valor.toFixed(2)} €</span>
      </div>
    </div>
  );
}

function Dashboard({ onNavigate }) {
  const [core, setCore] = useState(null);

  const [agenda, setAgenda] = useState(null);
  const [correo, setCorreo] = useState(null);
  const [cuentasBancarias, setCuentasBancarias] = useState(null);
  const [saldosRegistrados, setSaldosRegistrados] = useState(null);
  const [relevesPatrimonio, setRelevesPatrimonio] = useState(null);
  const [mostrarGraficoPatrimonio, setMostrarGraficoPatrimonio] = useState(false);
  const [mostrarDesgloseBalance, setMostrarDesgloseBalance] = useState(false);
  const [granularidadBalance, setGranularidadBalance] = useState('mes');

  useEffect(() => {
    Promise.all([

      apiCall('list', { sheet: 'Transacciones' }),
      apiCall('list', { sheet: 'Deudas' }),
      apiCall('list', { sheet: 'Suscripciones' }),
    ]).then(([tareas, transacciones, deudas, suscripciones]) => {
      setCore({
        tareas: Array.isArray(tareas) ? tareas : [],
        transacciones: Array.isArray(transacciones) ? transacciones : [],
        deudas: Array.isArray(deudas) ? deudas : [],
        suscripciones: Array.isArray(suscripciones) ? suscripciones : [],
      });
    });
    apiCall('list', { sheet: 'Proyectos' }).then(res => setProyectos(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Disponibilidad' }).then(res => setCompromisos(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Cuentas_Bancarias' }).then(res => setCuentasBancarias(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Saldos_Registrados' }).then(res => setSaldosRegistrados(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Releves_Subidos' }).then(res => setRelevesPatrimonio(Array.isArray(res) ? res : []));
    apiCall('calendarEvents').then(res => setAgenda(res && !res.error ? res : { error: (res && res.message) || 'No se pudo leer el calendario.' }));
    apiCall('gmailDestacados').then(res => setCorreo(res && !res.error ? res : { error: (res && res.message) || 'No se pudo leer el correo.' }));
  }, []);

  if (!core) return <div className="empty">Cargando…</div>;

  const monedaDeCuentaDash = nombreCuenta => {
    const c = (cuentasBancarias || []).find(c => c.nombre === nombreCuenta);
    return (c && c.moneda) || 'EUR';
  };
  const simboloMonedaDash = m => (m === 'EUR' ? '€' : m);
  const transaccionesEUR = core.transacciones.filter(t => monedaDeCuentaDash(t.cuenta) === 'EUR');
  const monedasNoEURDash = [...new Set((cuentasBancarias || []).filter(c => c.moneda && c.moneda !== 'EUR').map(c => c.moneda))];

  const pendientes = core.tareas.filter(t => t.estado !== 'hecha');
  const balance = transaccionesEUR.reduce((acc, it) => {
    const m = parseFloat(it.monto) || 0;
    if (it.tipo === 'ingreso') return acc + m;
    if (it.tipo === 'gasto') return acc - m;
    return acc;
  }, 0);
  const balancesOtraMonedaDash = monedasNoEURDash.map(moneda => {
    const cuentasDeEsaMoneda = (cuentasBancarias || []).filter(c => c.moneda === moneda).map(c => c.nombre);
    const bal = core.transacciones.filter(t => cuentasDeEsaMoneda.includes(t.cuenta)).reduce((acc, it) => {
      const m = parseFloat(it.monto) || 0;
      if (it.tipo === 'ingreso') return acc + m;
      if (it.tipo === 'gasto') return acc - m;
      return acc;
    }, 0);
    return { moneda, balance: bal };
  });

  const proximosPagos = [
    ...core.deudas.filter(d => d.fecha_proximo_pago).map(d => ({ label: d.acreedor, fecha: d.fecha_proximo_pago })),
    ...core.suscripciones.filter(s => s.fecha_proximo_cobro).map(s => ({ label: s.nombre, fecha: s.fecha_proximo_cobro })),
  ].sort((a, b) => new Date(a.fecha) - new Date(b.fecha)).slice(0, 4);

  const hoyDiaNum = new Date().getDate();
  const mesActualStr = new Date().toISOString().slice(0, 7);
  const relevesPendientes = (cuentasBancarias || []).filter(c => {
    const hasta = parseInt(c.dia_relave_hasta, 10);
    if (!hasta) return false;
    const yaSubidoEsteMes = c.ultima_fecha_relave && c.ultima_fecha_relave.slice(0, 7) === mesActualStr;
    return hoyDiaNum > hasta && !yaSubidoEsteMes;
  });

  const saldosDesactualizados = (cuentasBancarias || []).filter(c => {
    const propios = (saldosRegistrados || []).filter(s => s.cuenta_id === c.id);
    if (propios.length === 0) return true;
    const masReciente = propios.reduce((max, s) => new Date(s.fecha_registro) > new Date(max.fecha_registro) ? s : max, propios[0]);
    const dias = (new Date() - new Date(masReciente.fecha_registro)) / 86400000;
    return dias > 15;
  });

  const ingresosReales = transaccionesEUR.filter(t => t.tipo === 'ingreso').reduce((a, t) => a + (parseFloat(t.monto) || 0), 0);
  const gastosReales = transaccionesEUR.filter(t => t.tipo === 'gasto').reduce((a, t) => a + (parseFloat(t.monto) || 0), 0);
  const netoTransferenciasTotal = transaccionesEUR.filter(t => t.tipo === 'transferencia').reduce((a, t) => a + (t.direccion === 'entrada' ? (parseFloat(t.monto) || 0) : -(parseFloat(t.monto) || 0)), 0);

  // Patrimonio real: para cada cuenta, todos los puntos de saldo conocido
  // (registrados a mano + saldo final de cada relevé), ordenados por fecha.
  // Para cualquier fecha del calendario, el patrimonio total es la suma del
  // último saldo CONOCIDO de cada cuenta hasta esa fecha (relleno hacia
  // adelante) — igual que se reconstruye el valor de una cartera de bolsa.
  // Solo se suman cuentas en EUR — otra moneda distorsionaría el número.
  let patrimonioActual = null, puntosPatrimonio = [];
  let patrimonioOtraMoneda = [];
  if (cuentasBancarias && saldosRegistrados && relevesPatrimonio) {
    const cuentasEUR = cuentasBancarias.filter(c => (c.moneda || 'EUR') === 'EUR');
    const puntosPorCuenta = {};
    cuentasEUR.forEach(c => {
      const puntos = [];
      saldosRegistrados.filter(s => s.cuenta_id === c.id).forEach(s => puntos.push({ fecha: s.fecha_registro, saldo: parseFloat(s.saldo) }));
      relevesPatrimonio.filter(r => r.cuenta_id === c.id && r.saldo_final !== '' && r.mes).forEach(r => puntos.push({ fecha: r.mes + '-28', saldo: parseFloat(r.saldo_final) }));
      puntos.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
      puntosPorCuenta[c.id] = puntos;
    });

    const todasLasFechas = [...new Set(Object.values(puntosPorCuenta).flat().map(p => p.fecha))].sort((a, b) => new Date(a) - new Date(b));
    puntosPatrimonio = todasLasFechas.map(fecha => {
      const total = cuentasEUR.reduce((suma, c) => {
        const puntos = puntosPorCuenta[c.id].filter(p => new Date(p.fecha) <= new Date(fecha));
        const ultimo = puntos.length ? puntos[puntos.length - 1].saldo : 0;
        return suma + ultimo;
      }, 0);
      return { label: fecha, valor: Math.round(total * 100) / 100 };
    });
    patrimonioActual = puntosPatrimonio.length ? puntosPatrimonio[puntosPatrimonio.length - 1].valor : null;

    // mismo cálculo, por separado, para cada otra moneda presente
    patrimonioOtraMoneda = monedasNoEURDash.map(moneda => {
      const cuentasDeEsaMoneda = cuentasBancarias.filter(c => c.moneda === moneda);
      const puntosPorCuentaM = {};
      cuentasDeEsaMoneda.forEach(c => {
        const puntos = [];
        saldosRegistrados.filter(s => s.cuenta_id === c.id).forEach(s => puntos.push({ fecha: s.fecha_registro, saldo: parseFloat(s.saldo) }));
        relevesPatrimonio.filter(r => r.cuenta_id === c.id && r.saldo_final !== '' && r.mes).forEach(r => puntos.push({ fecha: r.mes + '-28', saldo: parseFloat(r.saldo_final) }));
        puntos.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
        puntosPorCuentaM[c.id] = puntos;
      });
      const fechasM = [...new Set(Object.values(puntosPorCuentaM).flat().map(p => p.fecha))].sort((a, b) => new Date(a) - new Date(b));
      const ultimaFecha = fechasM[fechasM.length - 1];
      const total = ultimaFecha ? cuentasDeEsaMoneda.reduce((suma, c) => {
        const puntos = puntosPorCuentaM[c.id].filter(p => new Date(p.fecha) <= new Date(ultimaFecha));
        return suma + (puntos.length ? puntos[puntos.length - 1].saldo : 0);
      }, 0) : null;
      return { moneda, valor: total };
    });
  }

  const hoy = new Date();
  const compromisosVigentes = (compromisos || []).filter(c => {
    const inicio = c.fecha_inicio ? new Date(c.fecha_inicio) : null;
    const fin = c.fecha_fin ? new Date(c.fecha_fin) : null;
    return (!inicio || inicio <= hoy) && (!fin || fin >= hoy);
  });
  const horasPorTipo = compromisosVigentes.reduce((acc, c) => {
    acc[c.tipo] = (acc[c.tipo] || 0) + (parseFloat(c.horas_semana) || 0);
    return acc;
  }, {});

  return (
    <div className="dashboard-grid">
      {relevesPendientes.length > 0 && (
        <div className="dash-card full alert-card">
          <div className="dash-label">⚠ Relevés bancarios pendientes <a onClick={() => onNavigate('Finanzas', 'Cuentas_Bancarias')} style={{ float: 'right', color: 'var(--accent)', cursor: 'pointer' }}>subir →</a></div>
          {relevesPendientes.map(c => (
            <div key={c.id} className="dash-row"><span>{c.nombre}</span><span className="entry-meta">esperado hasta el día {c.dia_relave_hasta}</span></div>
          ))}
        </div>
      )}
      {saldosDesactualizados.length > 0 && (
        <div className="dash-card full alert-card">
          <div className="dash-label">⚠ Saldos sin actualizar (+15 días) <a onClick={() => onNavigate('Finanzas', 'Cuentas_Bancarias')} style={{ float: 'right', color: 'var(--accent)', cursor: 'pointer' }}>registrar →</a></div>
          {saldosDesactualizados.map(c => (
            <div key={c.id} className="dash-row"><span>{c.nombre}</span><span className="entry-meta">registra el saldo actual</span></div>
          ))}

function startOfWeek_(date) {
  const d = new Date(date);
  const dia = d.getDay();
  const diff = (dia === 0 ? -6 : 1) - dia;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}
function startOfMonth_(date) { return new Date(date.getFullYear(), date.getMonth(), 1); }
function addDays_(date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d; }
function isSameDay_(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }

function AgendaTab() {
  const [view, setView] = useState('semana');
  const [anchor, setAnchor] = useState(new Date());
  const [eventos, setEventos] = useState(null);
  const [syncStatus, setSyncStatus] = useState(null);

  function rango() {
    if (view === 'dia') {
      const start = new Date(anchor); start.setHours(0, 0, 0, 0);
      return [start, addDays_(start, 1)];
    }
    if (view === 'semana') {
      const start = startOfWeek_(anchor);
      return [start, addDays_(start, 7)];
    }
    const inicioMes = startOfMonth_(anchor);
    const finMes = new Date(inicioMes.getFullYear(), inicioMes.getMonth() + 1, 1);
    const gridStart = startOfWeek_(inicioMes);
    const gridEnd = addDays_(startOfWeek_(addDays_(finMes, -1)), 7);
    return [gridStart, gridEnd];
  }

  function cargar() {
    const [start, end] = rango();
    setEventos(null);
    apiCall('calendarEvents', { rangeStart: start.toISOString(), rangeEnd: end.toISOString() })
      .then(res => setEventos(res && !res.error ? res : { error: (res && res.message) || 'No se pudo leer el calendario.' }));
  }
  useEffect(cargar, [view, anchor]);

  function sincronizar() {
    setSyncStatus('cargando');
    const [start, end] = rango();
    apiCall('calendarEvents', { rangeStart: start.toISOString(), rangeEnd: end.toISOString() })
      .then(res => {
        if (res && !res.error) {
          setEventos(res);
          setSyncStatus('ok');
        } else {
          setSyncStatus('error');
        }
        setTimeout(() => setSyncStatus(null), 2500);
      })
      .catch(() => { setSyncStatus('error'); setTimeout(() => setSyncStatus(null), 2500); });
  }

  function navegar(dir) {
    if (view === 'dia') setAnchor(addDays_(anchor, dir));
    else if (view === 'semana') setAnchor(addDays_(anchor, dir * 7));
    else setAnchor(new Date(anchor.getFullYear(), anchor.getMonth() + dir, 1));
  }

  return (
    <div>
      <div className="agenda-toolbar">
        <div className="agenda-views">
          {['dia', 'semana', 'mes'].map(v => (
            <button key={v} className={`sub-item ${view === v ? 'active' : ''}`} onClick={() => setView(v)}>{v}</button>
          ))}
        </div>
        <div className="agenda-nav">
          <button className="ghost" onClick={() => navegar(-1)}>←</button>
          <button className="ghost" onClick={() => setAnchor(new Date())}>Hoy</button>
          <button className="ghost" onClick={() => navegar(1)}>→</button>
          <button className="ghost" onClick={sincronizar} title="Sincronizar con Calendar">
            {syncStatus === 'cargando' ? '⟳ …' : syncStatus === 'ok' ? '✓ Sincronizado' : syncStatus === 'error' ? '✕ Error' : '⟳ Sincronizar'}
          </button>
        </div>
      </div>

      {!eventos ? <div className="empty">Cargando…</div> :
        eventos.error ? <div className="integration-error">{eventos.error} — autoriza el acceso a Calendar redesplegando el backend y aceptando el permiso.</div> :
        view === 'dia' ? <AgendaDia fecha={anchor} eventos={eventos} /> :
        view === 'semana' ? <AgendaSemana inicio={startOfWeek_(anchor)} eventos={eventos} onDiaClick={d => { setAnchor(d); setView('dia'); }} /> :
        <AgendaMes anchor={anchor} eventos={eventos} onDiaClick={d => { setAnchor(d); setView('dia'); }} />
      }
    </div>
  );
}

function AgendaDia({ fecha, eventos }) {
  const delDia = eventos.filter(e => isSameDay_(new Date(e.inicio), fecha));
  const todoElDia = delDia.filter(e => e.todoDia);
  const conHora = delDia.filter(e => !e.todoDia).sort((a, b) => new Date(a.inicio) - new Date(b.inicio));
  const ALTURA_HORA = 48; // px por hora — ajusta la altura total de la línea de tiempo
  const horas = Array.from({ length: 24 }, (_, i) => i);

  function minutosDelDia_(iso) {
    const d = new Date(iso);
    return d.getHours() * 60 + d.getMinutes();
  }

  return (
    <div>
      <div className="agenda-day-title">{fecha.toLocaleDateString('es-ES', { weekday: 'long', day: '2-digit', month: 'long' })}</div>
      {todoElDia.length > 0 && (
        <div style={{ marginBottom: 10 }}>
          {todoElDia.map(ev => (
            <div key={ev.id} className="agenda-week-event" style={{ borderLeftColor: colorDeEvento_(ev), display: 'inline-block', marginRight: 6 }}>{ev.titulo} (todo el día)</div>
          ))}
        </div>
      )}
      <div style={{ position: 'relative', display: 'flex' }}>
        <div style={{ width: 44, flexShrink: 0 }}>
          {horas.map(h => (
            <div key={h} style={{ height: ALTURA_HORA, fontSize: 10, color: 'var(--ink-faint)', fontFamily: "'IBM Plex Mono', monospace", borderTop: '1px solid var(--line)', paddingTop: 2, boxSizing: 'border-box' }}>
              {String(h).padStart(2, '0')}:00
            </div>
          ))}
        </div>
        <div style={{ position: 'relative', flex: 1, height: ALTURA_HORA * 24 }}>
          {horas.map(h => (
            <div key={h} style={{ position: 'absolute', top: h * ALTURA_HORA, left: 0, right: 0, borderTop: '1px solid var(--line)' }}></div>
          ))}
          {conHora.length === 0 ? (
            <div className="empty" style={{ position: 'absolute', top: 8, left: 8 }}>Sin eventos con hora este día.</div>
          ) : conHora.map(ev => {
            const inicioMin = minutosDelDia_(ev.inicio);
            const finMin = Math.max(inicioMin + 20, minutosDelDia_(ev.fin) || (inicioMin + 60));
            const top = (inicioMin / 60) * ALTURA_HORA;
            const alto = Math.max(18, ((finMin - inicioMin) / 60) * ALTURA_HORA);
            return (
              <div key={ev.id} style={{
                position: 'absolute', top, left: 4, right: 4, height: alto,
                background: 'var(--surface-2)', borderLeft: `3px solid ${colorDeEvento_(ev)}`,
                borderRadius: 4, padding: '3px 6px', fontSize: 11, overflow: 'hidden', boxSizing: 'border-box',
              }}>
                <div style={{ fontWeight: 600 }}>{ev.titulo}</div>
                <div className="entry-meta">{new Date(ev.inicio).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })} - {new Date(ev.fin).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}{ev.ubicacion ? ' · ' + ev.ubicacion : ''}</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function AgendaSemana({ inicio, eventos, onDiaClick }) {
  const dias = Array.from({ length: 7 }, (_, i) => addDays_(inicio, i));
  return (
    <div className="agenda-week">
      {dias.map(dia => {
        const delDia = eventos.filter(e => isSameDay_(new Date(e.inicio), dia)).sort((a, b) => new Date(a.inicio) - new Date(b.inicio));
        return (
          <div key={dia.toISOString()} className="agenda-week-col" onClick={() => onDiaClick(dia)}>
            <div className="agenda-week-col-header">{dia.toLocaleDateString('es-ES', { weekday: 'short' })}<br />{dia.getDate()}</div>
            {delDia.length === 0 ? <div className="agenda-week-empty">—</div> :
              delDia.slice(0, 4).map(ev => (
                <div key={ev.id} className="agenda-week-event" style={{ borderLeftColor: colorDeEvento_(ev) }}>
                  {ev.todoDia ? '●' : new Date(ev.inicio).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })} {ev.titulo}
                </div>
              ))
            }
            {delDia.length > 4 && <div className="agenda-week-more">+{delDia.length - 4} más</div>}
          </div>
        );
      })}
    </div>
  );
}

function AgendaMes({ anchor, eventos, onDiaClick }) {
  const inicioGrid = startOfWeek_(startOfMonth_(anchor));
  const dias = Array.from({ length: 42 }, (_, i) => addDays_(inicioGrid, i));
  const mesActual = anchor.getMonth();
  const nombresDias = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
  return (
    <div>
      <div className="agenda-month-weekdays">
        {nombresDias.map(n => <div key={n}>{n}</div>)}
      </div>
      <div className="agenda-month">
        {dias.map(dia => {
          const delDia = eventos.filter(e => isSameDay_(new Date(e.inicio), dia));
          const fueraDeMes = dia.getMonth() !== mesActual;
          return (
            <div key={dia.toISOString()} className={`agenda-month-cell ${fueraDeMes ? 'fuera' : ''}`} onClick={() => onDiaClick(dia)}>
              <div className="agenda-month-daynum">{dia.getDate()}</div>
              {delDia.slice(0, 2).map(ev => <div key={ev.id} className="agenda-month-event" style={{ borderLeftColor: colorDeEvento_(ev) }}>{ev.titulo}</div>)}
              {delDia.length > 2 && <div className="agenda-month-more">+{delDia.length - 2}</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function CorreoTab() {
  const [correo, setCorreo] = useState(null);
  const [busyId, setBusyId] = useState(null);

  function load() {
    apiCall('gmailDestacados').then(res => setCorreo(res && !res.error ? res : { error: (res && res.message) || 'No se pudo leer el correo.' }));
  }
  useEffect(load, []);

  function quitarDestacado(id) {
    if (busyId) return;
    setBusyId(id);
    apiCall('gmailUnstar', { threadId: id }).then(() => { setBusyId(null); load(); });
  }

  if (!correo) return <div className="empty">Cargando…</div>;
  if (correo.error) return <div className="integration-error">{correo.error} — autoriza el acceso a Gmail redesplegando el backend y aceptando el permiso.</div>;
  if (correo.length === 0) return <div className="empty">No tienes correos marcados como Destacados.</div>;

  return (
    <div className="log">
      {correo.map(c => (
        <div key={c.id} className="entry">
          <a href={c.enlace} target="_blank" rel="noopener" className="entry-main" style={{ textDecoration: 'none', color: 'inherit' }}>
            <div className="entry-title">{c.asunto}</div>
            <div className="entry-meta">{c.remitente.split('<')[0].trim()} · {new Date(c.fecha).toLocaleDateString('es-ES')}</div>

            {c.noLeido && <span className="chip">no leído</span>}

          </div>
        </div>
      ))}
    </div>

}

function TareasTab({ compact }) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState({ titulo: '', categoria: '', proyecto: '', prioridad: 'media', fecha_limite: '' });
  const [filtroProyecto, setFiltroProyecto] = useState('');
  const [dragOverCol, setDragOverCol] = useState(null);
  const [adding, setAdding] = useState(false);
  const [busyCardId, setBusyCardId] = useState(null);
  const [showForm, setShowForm] = useState(false);

  function load() {
    setLoading(true);
    apiCall('list', { sheet: 'Tareas' }).then(res => { setItems(Array.isArray(res) ? res : []); setLoading(false); });
  }
  useEffect(load, []);

  function addTarea(e) {
    e.preventDefault();
    if (!form.titulo || adding) return;
    setAdding(true);
    apiCall('create', { sheet: 'Tareas', data: { ...form, estado: 'pendiente' } }).then(() => {
      setForm({ titulo: '', categoria: '', proyecto: '', prioridad: 'media', fecha_limite: '' });
      setAdding(false);
      setShowForm(false);
      load();
    });
  }

  function moveTask(id, nuevoEstado) {
    if (busyCardId) return;
    setBusyCardId(id);
    apiCall('update', { sheet: 'Tareas', data: { id, estado: nuevoEstado } }).then(() => { setBusyCardId(null); load(); });
  }

  function remove(id) {
    if (busyCardId) return;
    setBusyCardId(id);
    apiCall('delete', { sheet: 'Tareas', id }).then(() => { setBusyCardId(null); load(); });
  }

  const proyectos = [...new Set(items.map(it => it.proyecto).filter(Boolean))];
  const visibles = filtroProyecto ? items.filter(it => it.proyecto === filtroProyecto) : items;
  const maxPorColumna = compact ? 3 : Infinity;

  if (loading) return <div className="empty">Cargando…</div>;

  return (
    <div>
      {!compact && (
        <React.Fragment>
          <button className={`add-toggle-btn ${showForm ? 'cancel' : ''}`} onClick={() => setShowForm(!showForm)}>
            {showForm ? 'Cancelar' : '+ Añadir tarea'}
          </button>

          {showForm && (
            <form className="entry-form" onSubmit={addTarea}>
              <input className="full" placeholder="Título de la tarea" value={form.titulo}
                onChange={e => setForm({ ...form, titulo: e.target.value })} />
              <input list="proyectos-list" placeholder="Proyecto (opcional)" value={form.proyecto}
                onChange={e => setForm({ ...form, proyecto: e.target.value })} />
              <datalist id="proyectos-list">
                {proyectos.map(p => <option key={p} value={p} />)}
              </datalist>
              <select value={form.categoria} onChange={e => setForm({ ...form, categoria: e.target.value })}>
                <option value="">Sin categoría</option>
                {CATEGORIAS_TAREAS.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <select value={form.prioridad} onChange={e => setForm({ ...form, prioridad: e.target.value })}>
                <option value="baja">Prioridad baja</option>
                <option value="media">Prioridad media</option>
                <option value="alta">Prioridad alta</option>
              </select>
              <input type="date" value={form.fecha_limite} onChange={e => setForm({ ...form, fecha_limite: e.target.value })} />
              <button type="submit" disabled={adding}>{adding ? 'Añadiendo…' : 'Añadir tarea'}</button>
            </form>
          )}

          {proyectos.length > 0 && (
            <div className="kanban-toolbar">
              <select value={filtroProyecto} onChange={e => setFiltroProyecto(e.target.value)}>
                <option value="">Todos los proyectos</option>
                {proyectos.map(p => <option key={p} value={p}>{p}</option>)}
              </select>
            </div>
          )}
        </React.Fragment>
      )}

      <div className="kanban-board">
        {KANBAN_COLUMNS.map(col => {
          const cardsAll = visibles.filter(it => (it.estado || 'pendiente') === col.key);
          const cards = cardsAll.slice(0, maxPorColumna);
          return (
            <div key={col.key}
              className={`kanban-col ${dragOverCol === col.key ? 'drag-over' : ''}`}
              onDragOver={e => { e.preventDefault(); setDragOverCol(col.key); }}
              onDragLeave={() => setDragOverCol(null)}
              onDrop={e => {
                e.preventDefault();
                const id = e.dataTransfer.getData('text/plain');
                setDragOverCol(null);
                if (id) moveTask(id, col.key);
              }}>
              <div className="kanban-col-header">
                <span>{col.label}</span>
                <span className="kanban-col-count">{cardsAll.length}</span>
              </div>
              <div className="kanban-cards">
                {cards.map(it => {
                  const busy = busyCardId === it.id;
                  return (
                    <div key={it.id} className={`kanban-card ${busy ? 'busy' : ''}`} draggable={!busy}
                      onDragStart={e => e.dataTransfer.setData('text/plain', it.id)}>
                      <div className="kanban-card-title">{it.titulo}</div>
                      <div className="kanban-card-meta">
                        {it.proyecto && <span className="chip">{it.proyecto}</span>}
                        {it.prioridad && <span className={`chip ${it.prioridad === 'alta' ? 'prioridad-alta' : ''}`}>{it.prioridad}</span>}
                        {it.fecha_limite && <span className="chip">{it.fecha_limite}</span>}
                      </div>
                      {!compact && (
                        <div className="kanban-card-actions">
                          {KANBAN_COLUMNS.filter(c => c.key !== col.key).map(c => (
                            <button key={c.key} className="ghost" disabled={busy} onClick={() => moveTask(it.id, c.key)}>
                              {busy ? '…' : `→ ${c.label}`}
                            </button>
                          ))}
                          <button className="ghost" disabled={busy} onClick={() => remove(it.id)}>{busy ? '…' : 'Borrar'}</button>
                        </div>
                      )}
                    </div>
                  );
                })}
                {cardsAll.length === 0 && <div className="empty" style={{ padding: '10px 0' }}>Vacío</div>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

      <div className="dash-card full">

            const etapasProyecto = etapas.filter(e => e.proyecto_id === p.id);
            const abierto = expandido === p.id;
            return (
              <div key={p.id} style={{ borderBottom: '1px solid var(--line)', padding: '14px 0' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', cursor: 'pointer' }} onClick={() => setExpandido(abierto ? null : p.id)}>
                  <span>{abierto ? '▾' : '▸'} <strong>{p.nombre}</strong> <span className="entry-meta">· {p.categoria} · {p.estado}</span></span>
                  <button className="ghost" style={{ padding: '2px 8px', fontSize: 10 }} disabled={busyId === p.id} onClick={e => { e.stopPropagation(); borrarProyecto(p.id); }}>{busyId === p.id ? '…' : 'Borrar'}</button>
                </div>
                {abierto && (
                  <div style={{ marginTop: 12, marginLeft: 16, paddingLeft: 12, borderLeft: '2px solid var(--line)' }}>
                    {p.descripcion && <p className="entry-meta" style={{ marginBottom: 8 }}>{p.descripcion}</p>}
                    {p.enlace && <div className="entry-meta" style={{ marginBottom: 12 }}>🔗 <a href={p.enlace} target="_blank" rel="noreferrer">{p.enlace}</a></div>}
                    {p.categoria === 'Lectura' && p.paginas_totales && (
                      <div style={{ marginBottom: 16 }}>
                        <div className="entry-meta" style={{ marginBottom: 4 }}>
                          {p.autor ? p.autor + ' — ' : ''}página {p.pagina_actual || 0} de {p.paginas_totales} ({Math.round(((parseFloat(p.pagina_actual) || 0) / parseFloat(p.paginas_totales)) * 100)}%)
                        </div>
                        <div className="progress-bar"><div className="progress-fill" style={{ width: `${Math.min(100, ((parseFloat(p.pagina_actual) || 0) / parseFloat(p.paginas_totales)) * 100)}%` }}></div></div>
                        <div style={{ display: 'flex', gap: 8, marginTop: 6, alignItems: 'center' }}>
                          <input type="number" min="0" max={p.paginas_totales} placeholder="Página actual" defaultValue={p.pagina_actual}
                            onKeyDown={ev => { if (ev.key === 'Enter') actualizarPaginaActual(p.id, ev.target.value); }}
                            style={{ width: 110 }} />
                          <button className="ghost" onClick={ev => actualizarPaginaActual(p.id, ev.target.previousSibling.value)}>Guardar página</button>
                        </div>
                      </div>
                    )}

                    <div className="entry-meta" style={{ marginBottom: 6, fontWeight: 600 }}>Objetivos a mediano plazo</div>
                    {objetivosProyecto.length === 0 ? <div className="empty">Sin objetivos definidos.</div> :
                      objetivosProyecto.map(o => (
                        <div key={o.id} className="dash-row" style={{ borderTop: 'none' }}>
                          <span onClick={() => cicloEstadoObjetivo(o)} style={{ cursor: 'pointer', color: o.estado === 'Logrado' ? 'var(--green)' : undefined }}>
                            {o.estado === 'Logrado' ? '✓ ' : ''}{o.descripcion}
                          </span>
                          <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                            <span className="entry-meta">{o.estado}{o.fecha_objetivo ? ' · ' + o.fecha_objetivo : ''}</span>
                            <button className="ghost" style={{ padding: '1px 6px', fontSize: 10 }} disabled={busyId === o.id} onClick={() => borrarObjetivo(o.id)}>×</button>
                          </span>
                        </div>
                      ))
                    }
                    <form className="entry-form" style={{ marginTop: 8, marginBottom: 18 }} onSubmit={e => guardarObjetivo(p.id, e)}>
                      <input placeholder="Nuevo objetivo a mediano plazo" value={formObjetivo.descripcion} onChange={e => setFormObjetivo({ ...formObjetivo, descripcion: e.target.value })} />
                      <input type="date" value={formObjetivo.fecha_objetivo} onChange={e => setFormObjetivo({ ...formObjetivo, fecha_objetivo: e.target.value })} />
                      <button type="submit" disabled={guardando}>+ Añadir</button>
                    </form>

                    <div className="entry-meta" style={{ marginBottom: 6, fontWeight: 600 }}>Etapas y seguimiento</div>
                    {etapasProyecto.length === 0 ? <div className="empty">Sin etapas definidas.</div> :
                      etapasProyecto.map(e => (
                        <div key={e.id} className="dash-row" style={{ borderTop: 'none' }}>
                          <span>{e.nombre_etapa}</span>
                          <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                            <button onClick={() => cicloEstadoEtapa(e)} style={{ fontSize: 11, padding: '2px 8px' }}>{e.estado}</button>
                            <span className="entry-meta">{e.fecha_proxima_revision ? 'revisar: ' + e.fecha_proxima_revision : ''}</span>
                            <button className="ghost" style={{ padding: '1px 6px', fontSize: 10 }} disabled={busyId === e.id} onClick={() => borrarEtapa(e.id)}>×</button>
                          </span>
                        </div>
                      ))
                    }
                    <form className="entry-form" style={{ marginTop: 8 }} onSubmit={e => guardarEtapa(p.id, e)}>
                      <input placeholder="Nueva etapa" value={formEtapa.nombre_etapa} onChange={e => setFormEtapa({ ...formEtapa, nombre_etapa: e.target.value })} />
                      <input type="date" placeholder="Fecha objetivo" value={formEtapa.fecha_objetivo} onChange={e => setFormEtapa({ ...formEtapa, fecha_objetivo: e.target.value })} />
                      <input type="date" placeholder="Próxima revisión" value={formEtapa.fecha_proxima_revision} onChange={e => setFormEtapa({ ...formEtapa, fecha_proxima_revision: e.target.value })} />
                      <button type="submit" disabled={guardando}>+ Añadir</button>
                    </form>
                  </div>
                )}
              </div>
            );
          })
        }
      </div>
    </div>
  );
}

function SuenoTab() {
  const [entradas, setEntradas] = useState(null);

  const [editando, setEditando] = useState(false);
  const [guardando, setGuardando] = useState(false);

  function load() { apiCall('list', { sheet: 'Sueno' }).then(res => setEntradas(Array.isArray(res) ? res : [])); }
  useEffect(load, []);

  if (!entradas) return <div className="empty">Cargando…</div>;

  const conObjetivo = entradas.filter(e => e.horas_objetivo).slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
  const objetivoActual = conObjetivo.length > 0 ? conObjetivo[0] : null;

  const registrosReales = entradas.filter(e => e.horas_dormidas).slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));

  function guardarObjetivo(e) {
    e.preventDefault();
    if (!nuevoObjetivo || guardando) return;
    setGuardando(true);
    apiCall('create', { sheet: 'Sueno', data: { fecha: new Date().toISOString().slice(0, 10), horas_objetivo: nuevoObjetivo, horas_dormidas: '', calidad: '', notas: '' } }).then(() => {
      setNuevoObjetivo('');
      setEditando(false);
      setGuardando(false);
      load();
    });

  return (
    <div className="dashboard-grid">
      <div className="dash-card full">
        <div className="dash-label">🎯 Objetivo de horas de sueño</div>

          <summary className="entry-meta" style={{ cursor: 'pointer' }}>¿Para qué sirve esto?</summary>
          <div className="entry-meta" style={{ marginTop: 6, lineHeight: 1.5 }}>
            Este único valor se usa para calcular tus horas libres reales en la pestaña Proyectos (168 horas de la semana, menos lo que ya tienes en Disponibilidad, menos tu objetivo de sueño × 7). No es un registro diario — es una sola meta que cambias cuando quieras.
          </div>
        </details>
        {!editando ? (
          <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>

            <button className="ghost" onClick={() => { setEditando(true); setNuevoObjetivo(objetivoActual ? objetivoActual.horas_objetivo : ''); }}>Editar</button>
          </div>
        ) : (
          <form className="entry-form" onSubmit={guardarObjetivo}>
            <input type="number" step="0.5" min="0" max="24" placeholder="Horas objetivo por noche" value={nuevoObjetivo} onChange={e => setNuevoObjetivo(e.target.value)} />
            <button type="submit" disabled={guardando}>{guardando ? 'Guardando…' : 'Guardar'}</button>
            <button type="button" className="ghost" onClick={() => setEditando(false)}>Cancelar</button>
          </form>
        )}
      </div>

      <div className="dash-card full">
        <div className="dash-label">⌚ Historial de sueño registrado</div>
        {registrosReales.length === 0 ? (
          <div className="empty">Todavía no hay datos reales de sueño — cuando conectes tu reloj inteligente, aparecerán aquí automáticamente, noche por noche.</div>
        ) : (
          registrosReales.map(e => (
            <div key={e.id} className="dash-row">
              <span>{e.fecha}</span>
              <span className="entry-meta">{e.horas_dormidas} h{e.calidad ? ' · calidad ' + e.calidad + '/5' : ''}{e.notas ? ' · ' + e.notas : ''}</span>
            </div>
          ))
        )}
      </div>
    </div>
  );
}
