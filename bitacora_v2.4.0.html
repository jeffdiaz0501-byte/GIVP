                <button className="ghost" style={{ padding: '2px 8px', fontSize: 10 }} disabled={busyId === a.id} onClick={() => borrarActividadProgramable(a.id)}>{busyId === a.id ? '…' : 'Borrar'}</button>
              </span>
            </div>
          ))
        }
        <form className="entry-form" style={{ marginTop: 14 }} onSubmit={guardarActividadProgramable}>
          <div><label className="entry-meta">Nombre</label><input value={formActividad.nombre} onChange={e => setFormActividad({ ...formActividad, nombre: e.target.value })} /></div>
          <div><label className="entry-meta">Horas objetivo/semana</label><input type="number" step="0.25" min="0" value={formActividad.horas_objetivo_semanales} onChange={e => setFormActividad({ ...formActividad, horas_objetivo_semanales: e.target.value })} /></div>
          <div><label className="entry-meta">Franja preferida</label>
            <select value={formActividad.franja_preferida} onChange={e => setFormActividad({ ...formActividad, franja_preferida: e.target.value })}>
              {['Mañana', 'Tarde', 'Noche'].map(fr => <option key={fr} value={fr}>{fr}</option>)}
            </select>
          </div>
          <div><label className="entry-meta">Días permitidos (ej. sábado, domingo)</label><input value={formActividad.dias_permitidos} onChange={e => setFormActividad({ ...formActividad, dias_permitidos: e.target.value })} /></div>
          <div><label className="entry-meta">Días evitados</label><input value={formActividad.dias_evitados} onChange={e => setFormActividad({ ...formActividad, dias_evitados: e.target.value })} /></div>
          <div><label className="entry-meta">Duración mín. sesión (h)</label><input type="number" step="0.25" min="0.25" value={formActividad.duracion_min_sesion} onChange={e => setFormActividad({ ...formActividad, duracion_min_sesion: e.target.value })} /></div>
          <div><label className="entry-meta">Duración máx. sesión (h)</label><input type="number" step="0.25" min="0.25" value={formActividad.duracion_max_sesion} onChange={e => setFormActividad({ ...formActividad, duracion_max_sesion: e.target.value })} /></div>
          <button type="submit" disabled={guardando} className="full">{guardando ? 'Guardando…' : '+ Añadir actividad'}</button>
        </form>
      </div>

      <div className="dash-card full">
        <div className="dash-label">+ Registrar actividad de ocio</div>
        <form className="entry-form" onSubmit={guardarActividad}>
          <div><label className="entry-meta">Fecha</label><input type="date" value={form.fecha} onChange={e => setForm({ ...form, fecha: e.target.value })} /></div>
          <div><label className="entry-meta">Actividad</label><input value={form.tipo_actividad} onChange={e => setForm({ ...form, tipo_actividad: e.target.value })} /></div>
          <div><label className="entry-meta">Duración (min)</label><input type="number" min="0" value={form.duracion_min} onChange={e => setForm({ ...form, duracion_min: e.target.value })} /></div>
          <div className="full"><label className="entry-meta">Nota</label><input value={form.nota} onChange={e => setForm({ ...form, nota: e.target.value })} /></div>
          <button type="submit" disabled={guardando} className="full">{guardando ? 'Guardando…' : '+ Registrar'}</button>
        </form>
      </div>

      <div className="dash-card full">
        <div className="dash-label">📖 Historial</div>
        {registros.length === 0 ? <div className="empty">Sin actividades registradas todavía.</div> :
          registros.map(r => (
            <div key={r.id} className="dash-row">
              <span>{r.fecha} — {r.tipo_actividad}</span>
              <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span className="entry-meta">{r.duracion_min ? r.duracion_min + ' min' : ''}{r.nota ? ' · ' + r.nota : ''}</span>
                <button className="ghost" style={{ padding: '2px 8px', fontSize: 10 }} disabled={busyId === r.id} onClick={() => borrar(r.id)}>{busyId === r.id ? '…' : 'Borrar'}</button>
              </span>
            </div>
          ))
        }
      </div>
    </div>
  );
}

function OrganizadorAgendaTab() {
  const [proyectos, setProyectos] = useState(null);
  const [disponibilidad, setDisponibilidad] = useState([]);
  const [sueno, setSueno] = useState([]);
  const [actividadesDeporte, setActividadesDeporte] = useState([]);
  const [actividadesOcio, setActividadesOcio] = useState([]);
  const [generando, setGenerando] = useState(false);
  const [resultadoGeneracion, setResultadoGeneracion] = useState(null);
  const [vistaPrevia, setVistaPrevia] = useState(null);
  const [cargandoVista, setCargandoVista] = useState(false);

  function load() {
    apiCall('list', { sheet: 'Proyectos' }).then(res => setProyectos(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Disponibilidad' }).then(res => setDisponibilidad(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Sueno' }).then(res => setSueno(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Actividades_Deporte' }).then(res => setActividadesDeporte(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Actividades_Ocio' }).then(res => setActividadesOcio(Array.isArray(res) ? res : []));
  }
  useEffect(load, []);

  function actualizarPorcentaje(id, valor) {
    apiCall('update', { sheet: 'Proyectos', data: { id, porcentaje_tiempo: valor } }).then(load);
  }

  function verVistaPrevia() {
    if (cargandoVista) return;
    setCargandoVista(true);
    setVistaPrevia(null);
    apiCall('generarEventosProyectos', { soloVista: true }).then(res => { setVistaPrevia(res); setCargandoVista(false); });
  }

  function generarEventos() {
    if (generando) return;
    if (!window.confirm('Esto va a crear eventos nuevos en tu Google Calendar para este mes. ¿Continuar?')) return;
    setGenerando(true);
    setResultadoGeneracion(null);
    apiCall('generarEventosProyectos', {}).then(res => { setResultadoGeneracion(res); setGenerando(false); });
  }

  if (!proyectos) return <div className="empty">Cargando…</div>;

  const horasOcupacionProfesional = disponibilidad.reduce((s, d) => s + (parseFloat(d.horas_semana) || 0), 0);
  const conObjetivoSueno = sueno.filter(e => e.horas_objetivo).slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
  const objetivoSuenoDiario = conObjetivoSueno.length > 0 ? parseFloat(conObjetivoSueno[0].horas_objetivo) || 0 : 0;
  const horasSueno = objetivoSuenoDiario * 7;
  const horasDeporte = actividadesDeporte.filter(a => a.estado === 'Activo').reduce((s, a) => s + (parseFloat(a.horas_objetivo_semanales) || 0), 0);
  const horasOcio = actividadesOcio.filter(a => a.estado === 'Activo').reduce((s, a) => s + (parseFloat(a.horas_objetivo_semanales) || 0), 0);

  const horasComprometidasTotal = horasOcupacionProfesional + horasSueno + horasDeporte + horasOcio;
  const horasLibresSemana = Math.max(0, 168 - horasComprometidasTotal);

  const proyectosActivos = proyectos.filter(p => p.estado === 'Activo');
  const sumaPorcentajes = proyectosActivos.reduce((s, p) => s + (parseFloat(p.porcentaje_tiempo) || 0), 0);

  return (
    <div className="dashboard-grid">
      <div className="dash-card full">
        <div className="dash-label">📅 Organizador de agenda — distribución semanal (168 h)</div>
        <details style={{ marginBottom: 10 }}>
          <summary className="entry-meta" style={{ cursor: 'pointer' }}>¿Cómo se calcula esto?</summary>
          <div className="entry-meta" style={{ marginTop: 6, lineHeight: 1.5 }}>
            De las 168 horas de la semana se reservan, en este orden: Ocupación profesional (Disponibilidad), Sueño, Deporte y Ocio — cada uno con su objetivo editable en su propia pestaña. Lo que sobra son tus horas libres reales, que repartes por % entre tus proyectos activos.
          </div>
        </details>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))', gap: 12, marginBottom: 16 }}>
          <div><div className="entry-meta">Ocupación profesional</div><div style={{ fontSize: 18, fontWeight: 600 }}>{horasOcupacionProfesional.toFixed(1)} h</div></div>
          <div><div className="entry-meta">Sueño</div><div style={{ fontSize: 18, fontWeight: 600 }}>{horasSueno.toFixed(1)} h</div></div>
          <div><div className="entry-meta">Deporte</div><div style={{ fontSize: 18, fontWeight: 600 }}>{horasDeporte.toFixed(1)} h</div></div>
          <div><div className="entry-meta">Ocio</div><div style={{ fontSize: 18, fontWeight: 600 }}>{horasOcio.toFixed(1)} h</div></div>
          <div><div className="entry-meta">Libres para proyectos</div><div style={{ fontSize: 18, fontWeight: 600, color: 'var(--accent)' }}>{horasLibresSemana.toFixed(1)} h</div></div>
        </div>
      </div>

      <div className="dash-card full">
        <div className="dash-label">🎯 Reparto entre proyectos activos</div>
        {sumaPorcentajes > 100 && <div className="entry-meta" style={{ color: 'var(--red)', marginBottom: 12 }}>⚠ La suma de porcentajes pasa de 100% — ajusta alguno de los proyectos activos.</div>}
        {proyectosActivos.length === 0 ? <div className="empty">Sin proyectos activos — ve a Proyectos para crear o activar alguno.</div> :
          proyectosActivos.map(p => {
            const pct = parseFloat(p.porcentaje_tiempo) || 0;
            const horasAsignadas = horasLibresSemana * pct / 100;
            return (
              <div key={p.id} className="dash-row">
                <span>{p.nombre}</span>
                <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <input type="number" min="0" max="100" value={p.porcentaje_tiempo || ''} onChange={e => actualizarPorcentaje(p.id, e.target.value)} style={{ width: 60 }} />
                  <span className="entry-meta">% · {horasAsignadas.toFixed(1)} h/semana</span>
                </span>
              </div>
            );
          })
        }
      </div>

      <div className="dash-card full">
        <div className="dash-label">🗓 Generar en Google Calendar</div>
        <div style={{ marginBottom: 16, display: 'flex', gap: 10, flexWrap: 'wrap' }}>
          <button className="ghost" onClick={verVistaPrevia} disabled={cargandoVista || proyectosActivos.length === 0}>
            {cargandoVista ? 'Calculando…' : '👁 Ver vista previa del mes'}
          </button>
          <button onClick={generarEventos} disabled={generando || proyectosActivos.length === 0}>
            {generando ? 'Generando…' : '📅 Generar eventos de este mes en Google Calendar'}
          </button>
        </div>
        {vistaPrevia && (
          <div style={{ marginBottom: 16, padding: 12, border: '1px solid var(--line)', borderRadius: 8 }}>
            <div className="entry-meta" style={{ marginBottom: 8, fontWeight: 600 }}>Vista previa — nada de esto está creado todavía en tu calendario:</div>
            {vistaPrevia.detalle && vistaPrevia.detalle.length > 0 ? (
              Object.entries(
                vistaPrevia.detalle.reduce((acc, ev) => {
                  const dia = new Date(ev.inicio).toLocaleDateString('es-ES', { weekday: 'short', day: '2-digit', month: '2-digit' });
                  (acc[dia] = acc[dia] || []).push(ev);
                  return acc;
                }, {})
              ).map(([dia, evs]) => (
                <div key={dia} className="dash-row">
                  <span>{dia}</span>
                  <span className="entry-meta">{evs.map(e => e.proyecto + ' (' + new Date(e.inicio).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) + '-' + new Date(e.fin).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) + ')').join(', ')}</span>
                </div>
              ))
            ) : <div className="empty">Sin sesiones calculadas.</div>}
            {vistaPrevia.avisos && vistaPrevia.avisos.length > 0 && (
              <div style={{ color: 'var(--red)', marginTop: 8 }}>{vistaPrevia.avisos.map((a, i) => <div key={i} className="entry-meta">⚠ {a}</div>)}</div>
            )}
          </div>
        )}
        {resultadoGeneracion && (
          <div className="entry-meta">
            {resultadoGeneracion.eventosCreados} evento(s) creado(s) de verdad en tu calendario.
            {resultadoGeneracion.avisos && resultadoGeneracion.avisos.length > 0 && (
              <div style={{ color: 'var(--red)', marginTop: 4 }}>{resultadoGeneracion.avisos.map((a, i) => <div key={i}>⚠ {a}</div>)}</div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function CuentasBancariasTab() {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState({ nombre: '', banco: '', tipo: 'corriente', dia_relave_desde: '', dia_relave_hasta: '', saldo_manual: '', fecha_saldo_manual: '', nota: '', moneda: 'EUR' });
  const [adding, setAdding] = useState(false);
  const [busyId, setBusyId] = useState(null);
  const [uploadingId, setUploadingId] = useState(null);
  const [textoExtraido, setTextoExtraido] = useState({});
  const [showForm, setShowForm] = useState(false);
  const [expandedId, setExpandedId] = useState(null);
  const [historialAbiertoId, setHistorialAbiertoId] = useState(null);
  const [editForm, setEditForm] = useState({});
  const [savingEdit, setSavingEdit] = useState(false);
  const [releves, setReleves] = useState([]);
  const [saldos, setSaldos] = useState([]);
  const [movimientosCuentas, setMovimientosCuentas] = useState([]);
  const [montoSaldo, setMontoSaldo] = useState({});
  const [registrandoSaldo, setRegistrandoSaldo] = useState(null);
  const [reparando, setReparando] = useState(false);
  const [resultadoReparacion, setResultadoReparacion] = useState(null);

  function repararMeses() {
    setReparando(true);
    apiCall('repararMesesReleves', {}).then(res => {
      setReparando(false);
      if (res && !res.error) {
        setResultadoReparacion(`✓ ${res.reparadas} relevé(s) reparado(s)`);
        load();
      }
      setTimeout(() => setResultadoReparacion(null), 6000);
    });
  }

  function load() {
    setLoading(true);
    apiCall('list', { sheet: 'Cuentas_Bancarias' }).then(res => { setItems(Array.isArray(res) ? res : []); setLoading(false); });
    apiCall('list', { sheet: 'Releves_Subidos' }).then(res => setReleves(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Saldos_Registrados' }).then(res => setSaldos(Array.isArray(res) ? res : []));
    apiCall('list', { sheet: 'Transacciones' }).then(res => setMovimientosCuentas(Array.isArray(res) ? res : []));
  }
  useEffect(load, []);

  function registrarSaldo(cuentaId) {
    const monto = montoSaldo[cuentaId];
    if (!monto || registrandoSaldo) return;
    setRegistrandoSaldo(cuentaId);
    apiCall('create', { sheet: 'Saldos_Registrados', data: { cuenta_id: cuentaId, saldo: monto, nota: '' } }).then(() => {
      setMontoSaldo({ ...montoSaldo, [cuentaId]: '' });
      setRegistrandoSaldo(null);
      load();
    });
  }

  function calcularVerificacionSaldos(cuentaNombre, saldosCuenta) {
    const ordenados = saldosCuenta.slice().sort((a, b) => new Date(a.fecha_registro) - new Date(b.fecha_registro));
    return ordenados.map((s, idx) => {
      if (idx === 0) return { ...s, verif: null };
      const anterior = ordenados[idx - 1];
      const movs = movimientosCuentas.filter(m => m.cuenta === cuentaNombre && m.fecha > anterior.fecha_registro && m.fecha <= s.fecha_registro);
      const cambio = movs.reduce((acc, m) => {
        const monto = parseFloat(m.monto) || 0;
        if (m.tipo === 'ingreso') return acc + monto;
        if (m.tipo === 'gasto') return acc - monto;
        if (m.tipo === 'transferencia') return acc + (m.direccion === 'entrada' ? monto : -monto);
        return acc;
      }, 0);
      const calculado = Math.round((parseFloat(anterior.saldo) + cambio) * 100) / 100;
      const coincide = Math.abs(calculado - parseFloat(s.saldo)) < 0.5;
      return { ...s, verif: { calculado, coincide } };
    });
  }

  function addCuenta(e) {
    e.preventDefault();
    if (!form.nombre || adding) return;
    setAdding(true);
    apiCall('create', { sheet: 'Cuentas_Bancarias', data: form }).then(() => {
      setForm({ nombre: '', banco: '', tipo: 'corriente', dia_relave_desde: '', dia_relave_hasta: '', saldo_manual: '', fecha_saldo_manual: '', nota: '', moneda: 'EUR' });
      setAdding(false);
      setShowForm(false);
      load();
    });
  }

  function remove(id) {
    if (busyId) return;
    setBusyId(id);
    apiCall('delete', { sheet: 'Cuentas_Bancarias', id }).then(() => { setBusyId(null); load(); });
  }

  function abrirCuenta(it) {
    if (expandedId === it.id) { setExpandedId(null); return; }
    setExpandedId(it.id);
    setEditForm({ nombre: it.nombre, banco: it.banco, tipo: it.tipo, dia_relave_desde: it.dia_relave_desde, dia_relave_hasta: it.dia_relave_hasta, saldo_manual: it.saldo_manual, fecha_saldo_manual: it.fecha_saldo_manual, nota: it.nota, moneda: it.moneda || 'EUR' });
  }

  function guardarEdicion(id) {
    setSavingEdit(true);
    apiCall('update', { sheet: 'Cuentas_Bancarias', data: { id, ...editForm } }).then(() => { setSavingEdit(false); load(); });
  }

  function subirArchivo(cuentaId, file, forzar) {
    if (!file) return;
    setUploadingId(cuentaId);
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = reader.result.split(',')[1];
      apiCall('subirReleve', { cuentaId, filename: file.name, mimeType: file.type, base64, forzar: !!forzar }).then(res => {
        setUploadingId(null);
        if (res && res.error === 'mes_ya_subido') {
          const meses = ['', 'enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
          const [anio, mesNum] = res.mesDetectado.split('-');
          const nombreMes = meses[parseInt(mesNum, 10)] + ' ' + anio;
          const confirmar = window.confirm(`Ya hay un relevé subido para ${nombreMes} en esta cuenta (${res.releveExistente.movimientos_importados} movimientos). ¿Subir de todas formas? (se añadirá como un relevé más, sin borrar el anterior)`);
          if (confirmar) subirArchivo(cuentaId, file, true);
          return;
        }
        if (res && !res.error) {
          const nuevasSusc = res.nuevasSuscripciones && res.nuevasSuscripciones.length
            ? ` · nuevas suscripciones detectadas: ${res.nuevasSuscripciones.join(', ')}`
            : '';
          const v = res.verificacion;
          const verifTexto = v
            ? ` · saldo ${v.soldeInicial.toFixed(2)}€ → ${v.soldeFinal.toFixed(2)}€ ${v.coincide ? '✓ cuadra' : '✕ NO cuadra (calculado ' + v.calculado.toFixed(2) + '€)'}`
            : '';
          const vt = res.verificacionTotal;
          const verifTotalTexto = vt
            ? (vt.coincide !== null
                ? `\nVerificación independiente contra el total del relevé — Débito: interpretado ${vt.debitCalculado.toFixed(2)}€ vs declarado ${vt.debitDeclarado.toFixed(2)}€ · Crédito: interpretado ${vt.creditCalculado.toFixed(2)}€ vs declarado ${vt.creditDeclarado.toFixed(2)}€ ${vt.coincide ? '✓ coincide exacto' : '✕ NO COINCIDE — revisar'}`
                : `\nTotal calculado por el sistema (este banco no declara un total propio para comparar) — Débito: ${vt.debitCalculado.toFixed(2)}€ · Crédito: ${vt.creditCalculado.toFixed(2)}€`)
            : '';
          let diagTexto = '';
          if (res.movimientosImportados === 0 && res.diagnostico) {
            const d = res.diagnostico;
            diagTexto = `\nDIAGNÓSTICO — banco registrado: "${d.bancoRegistrado}" · líneas totales: ${d.totalLineas} · líneas tipo transacción Bourso: ${d.lineasTransaccionBourso} · líneas fecha sola BNP: ${d.lineasFechaSolaBNP} · líneas fecha sola Bourso: ${d.lineasFechaSolaBourso} · líneas monto: ${d.lineasMonto}`;
          }
          setTextoExtraido({
            ...textoExtraido,
            [cuentaId]: {
              resumen: `✓ ${res.movimientosImportados} movimientos importados (${res.mesDetectado || 'mes no detectado'}) · ${res.totalGastos.toFixed(2)} € gastos · ${res.totalIngresos.toFixed(2)} € ingresos${nuevasSusc}${verifTexto}${verifTotalTexto}${diagTexto}`,
              texto: res.texto,
            },
          });
          load();
        } else if (res && res.error === 'respuesta_invalida') {
          // Confirmado con casos reales: cuando esto pasa, el relevé a veces
          // sí se guardó bien en el Sheet — la respuesta llegó rota, no el
          // procesamiento. Recargar de inmediato para que se vea el estado
          // real en vez de dejar solo un mensaje de error que asusta.
          setTextoExtraido({ ...textoExtraido, [cuentaId]: { resumen: '⚠ La respuesta del servidor llegó incompleta, pero es posible que el relevé sí se haya guardado — revisando el historial…', texto: '' } });
          load();
        } else {
          setTextoExtraido({ ...textoExtraido, [cuentaId]: { resumen: 'Error: ' + ((res && res.message) || 'no se pudo procesar el archivo.'), texto: '' } });
        }
      });
    };
    reader.readAsDataURL(file);
  }

  return (
    <div>
      <button className={`add-toggle-btn ${showForm ? 'cancel' : ''}`} onClick={() => setShowForm(!showForm)}>
        {showForm ? 'Cancelar' : '+ Añadir cuenta'}
      </button>
      <button className="add-toggle-btn" disabled={reparando} onClick={repararMeses} style={{ marginLeft: 8 }}>
        {reparando ? 'Reparando…' : '🔧 Reparar meses corruptos'}
      </button>
      {resultadoReparacion && <div className="entry-meta" style={{ marginTop: 8, color: 'var(--accent)' }}>{resultadoReparacion}</div>}

      {showForm && (
        <form className="entry-form" onSubmit={addCuenta}>
          <input placeholder="Nombre de la cuenta" value={form.nombre} onChange={e => setForm({ ...form, nombre: e.target.value })} />
          <input placeholder="Banco" value={form.banco} onChange={e => setForm({ ...form, banco: e.target.value })} />
          <select value={form.tipo} onChange={e => setForm({ ...form, tipo: e.target.value })}>
            <option value="corriente">Corriente</option>
            <option value="ahorro">Ahorro</option>
          </select>
          <select value={form.moneda} onChange={e => setForm({ ...form, moneda: e.target.value })}>
            <option value="EUR">EUR (€)</option>
            <option value="COP">COP ($)</option>
            <option value="USD">USD ($)</option>
          </select>

          <input type="number" min="1" max="31" placeholder="Día relevé hasta" value={form.dia_relave_hasta} onChange={e => setForm({ ...form, dia_relave_hasta: e.target.value })} />

                  <div className="entry-title">{it.nombre} {it.banco && `· ${it.banco}`}</div>
                  <div className="entry-meta">
                    {it.tipo} · relevé esperado días {it.dia_relave_desde || '?'}-{it.dia_relave_hasta || '?'} · último subido: {it.ultima_fecha_relave || 'nunca'} · {relevesCuenta.length} relevé(s) en historial
                    {ultimoSaldoConocido && (
                      <React.Fragment><br />Saldo conocido: {parseFloat(ultimoSaldoConocido.saldo).toFixed(2)} {simboloMon} (al {ultimoSaldoConocido.fecha_registro})</React.Fragment>

                  <button className="ghost" onClick={() => abrirCuenta(it)}>{isOpen ? 'Cerrar edición' : 'Editar'}</button>

                </div>
              </div>

              <div className="account-upload" style={{ marginTop: 10 }}>
                <input type="file" accept="application/pdf,image/*" disabled={uploadingId === it.id}

                {uploadingId === it.id && <span className="entry-meta">Procesando…</span>}
              </div>

              <div className="account-upload" style={{ marginTop: 8 }}>
                <input type="number" step="0.01" placeholder="Registrar saldo actual (€)" style={{ maxWidth: 200 }}
                  value={montoSaldo[it.id] || ''} onChange={e => setMontoSaldo({ ...montoSaldo, [it.id]: e.target.value })} />
                <button className="ghost" disabled={registrandoSaldo === it.id} onClick={() => registrarSaldo(it.id)}>
                  {registrandoSaldo === it.id ? 'Guardando…' : '+ Registrar saldo de hoy'}
                </button>
              </div>

              {textoExtraido[it.id] && (
                <div style={{ marginTop: 8 }}>
                  <div className="entry-meta" style={{ color: 'var(--accent)', whiteSpace: 'pre-wrap' }}>{textoExtraido[it.id].resumen}</div>
                  {textoExtraido[it.id].texto && (
                    <details>
                      <summary className="entry-meta" style={{ cursor: 'pointer' }}>Ver texto completo extraído</summary>
                      <div className="ocr-preview">{textoExtraido[it.id].texto}</div>
                    </details>
                  )}
                </div>
              )}

              {isOpen && (
                <div className="account-row-editform">
                  <input placeholder="Nombre" value={editForm.nombre || ''} onChange={e => setEditForm({ ...editForm, nombre: e.target.value })} />
                  <input placeholder="Banco" value={editForm.banco || ''} onChange={e => setEditForm({ ...editForm, banco: e.target.value })} />
                  <select value={editForm.tipo || 'corriente'} onChange={e => setEditForm({ ...editForm, tipo: e.target.value })}>
                    <option value="corriente">Corriente</option>
                    <option value="ahorro">Ahorro</option>
                  </select>
                  <select value={editForm.moneda || 'EUR'} onChange={e => setEditForm({ ...editForm, moneda: e.target.value })}>
                    <option value="EUR">EUR (€)</option>
                    <option value="COP">COP ($)</option>
                    <option value="USD">USD ($)</option>
                  </select>
                  <div></div>
                  <input type="number" min="1" max="31" placeholder="Día relevé desde" value={editForm.dia_relave_desde || ''} onChange={e => setEditForm({ ...editForm, dia_relave_desde: e.target.value })} />
                  <input type="number" min="1" max="31" placeholder="Día relevé hasta" value={editForm.dia_relave_hasta || ''} onChange={e => setEditForm({ ...editForm, dia_relave_hasta: e.target.value })} />
                  <input className="full" placeholder="Nota" value={editForm.nota || ''} onChange={e => setEditForm({ ...editForm, nota: e.target.value })} />
                  <button disabled={savingEdit} onClick={() => guardarEdicion(it.id)}>{savingEdit ? 'Guardando…' : 'Guardar cambios'}</button>
                </div>
              )}

              {historialAbierto && (
                <React.Fragment>
                  <div className="releve-history">
                    <div className="entry-meta">Histórico de saldos registrados</div>
                    {(() => {
                      const saldosCuenta = saldos.filter(s => s.cuenta_id === it.id);
                      if (saldosCuenta.length === 0) return <div className="empty" style={{ padding: '6px 0' }}>Ninguno todavía.</div>;
                      const conVerif = calcularVerificacionSaldos(it.nombre, saldosCuenta);
                      return conVerif.slice().reverse().map(s => (
                        <div key={s.id} className={`releve-history-item ${s.verif && !s.verif.coincide ? 'no-coincide' : ''}`}>
                          <span>{s.fecha_registro}</span>
                          <span>{parseFloat(s.saldo).toFixed(2)}€ {s.verif ? (s.verif.coincide ? '✓ cuadra con movimientos' : `✕ esperado ${s.verif.calculado.toFixed(2)}€`) : ''}</span>
                        </div>
                      ));
                    })()}
                  </div>

                  <div className="releve-history">
                    <div className="entry-meta">Meses del año con relevé subido</div>
                    <div className="mes-grid">
                      {['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'].map((nombreMes, idx) => {
                        const anioActual = new Date().getFullYear();
                        const claveMes = anioActual + '-' + String(idx + 1).padStart(2, '0');
                        const subido = relevesCuenta.some(r => String(r.mes).slice(0, 7) === claveMes);
                        return (
                          <div key={idx} className={`mes-chip ${subido ? 'subido' : ''}`} title={subido ? `Relevé de ${nombreMes} ${anioActual} subido` : `Sin relevé de ${nombreMes} ${anioActual}`}>
                            {nombreMes}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <div className="releve-history">
                    <div className="entry-meta">Historial de relevés subidos</div>
                    {relevesCuenta.length === 0 ? <div className="empty" style={{ padding: '6px 0' }}>Ninguno todavía.</div> :
                      relevesCuenta.map(r => {
                        const totalOk = r.coincide_total_operaciones === '' || r.coincide_total_operaciones === undefined ? null : (r.coincide_total_operaciones === true || r.coincide_total_operaciones === 'true');
                        return (
                          <div key={r.id} className={`releve-history-item ${r.coincide === false || r.coincide === 'false' || totalOk === false ? 'no-coincide' : ''}`}>
                            <span>{(r.mes ? String(r.mes).slice(0, 7) : '') || r.periodo || new Date(r.fecha_subida).toLocaleDateString('es-ES')} · {r.movimientos_importados} mov.</span>
                            <span>
                              {parseFloat(r.total_gastos || 0).toFixed(2)}€ gastos · {parseFloat(r.total_ingresos || 0).toFixed(2)}€ ingresos {r.coincide === false || r.coincide === 'false' ? '✕ saldo' : r.saldo_final !== '' ? '✓ saldo' : ''}
                              {totalOk !== null && (totalOk ? ' · ✓ total banco' : ' · ✕ total banco')}
                            </span>
                          </div>
                        );
                      })
                    }
                  </div>
                </React.Fragment>
              )}
            </div>
          );
        })
      }
    </div>
  );
}

function SuscripcionesTab() {
  const [items, setItems] = useState([]);
  const [transacciones, setTransacciones] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState({ nombre: '', categoria: '', monto: '', frecuencia: 'mensual', fecha_proximo_cobro: '', metodo_pago: '' });
  const [adding, setAdding] = useState(false);
  const [busyId, setBusyId] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [expandidoId, setExpandidoId] = useState(null);

  function load() {
    setLoading(true);
    apiCall('list', { sheet: 'Suscripciones' }).then(res => { setItems(Array.isArray(res) ? res : []); setLoading(false); });
    apiCall('list', { sheet: 'Transacciones' }).then(res => setTransacciones(Array.isArray(res) ? res : []));
  }
  useEffect(load, []);

  // Busca transacciones cuya nota contenga el nombre normalizado de la
  // suscripción — la misma lógica que ya usa el sistema para reconocer
  // comercios repetidos, así el conteo coincide con lo que ves en Movimientos.
  function transaccionesDe(nombreSuscripcion) {
    const clave = (nombreSuscripcion || '').toUpperCase();
    if (!clave) return [];
    return transacciones.filter(t => (t.nota || '').toUpperCase().includes(clave)).sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
  }

  function addSuscripcion(e) {
    e.preventDefault();
    if (!form.nombre || adding) return;
    setAdding(true);
    apiCall('create', { sheet: 'Suscripciones', data: { ...form, estado: 'activa' } }).then(() => {
      setForm({ nombre: '', categoria: '', monto: '', frecuencia: 'mensual', fecha_proximo_cobro: '', metodo_pago: '' });
      setAdding(false);
      setShowForm(false);
      load();
    });
  }

  function confirmar(id) {
    if (busyId) return;
    setBusyId(id);
    apiCall('update', { sheet: 'Suscripciones', data: { id, estado: 'activa' } }).then(() => { setBusyId(null); load(); });
  }

  function rechazar(id) {
    if (busyId) return;
    setBusyId(id);
    apiCall('delete', { sheet: 'Suscripciones', id }).then(() => { setBusyId(null); load(); });
  }

  function remove(id) {
    if (busyId) return;
    setBusyId(id);
    apiCall('delete', { sheet: 'Suscripciones', id }).then(() => { setBusyId(null); load(); });
  }

  const pendientes = items.filter(it => it.estado === 'pendiente_confirmacion');
  const confirmadas = items.filter(it => it.estado !== 'pendiente_confirmacion');

  return (
    <div>
      {pendientes.length > 0 && (
        <div className="resumen-section" style={{ marginBottom: 20 }}>
          <div className="entry-meta" style={{ color: 'var(--ochre, var(--red))', marginBottom: 8 }}>
            ⚠ {pendientes.length} suscripción(es) detectada(s) automáticamente — confirma o rechaza cada una
          </div>
          <div className="log">
            {pendientes.map(it => (
              <div key={it.id}>
                <div className="entry" style={{ cursor: 'pointer' }} onClick={() => setExpandidoId(expandidoId === it.id ? null : it.id)}>
                  <div className="entry-main">
                    <div className="entry-title">{it.nombre}</div>
                    <div className="entry-meta">{parseFloat(it.monto || 0).toFixed(2)} € · {it.frecuencia} · {transaccionesDe(it.nombre).length} transacción(es) registrada(s)</div>
                  </div>
                  <div className="entry-actions">
                    <button disabled={busyId === it.id} onClick={e => { e.stopPropagation(); confirmar(it.id); }}>{busyId === it.id ? '…' : 'Confirmar'}</button>
                    <button className="ghost" disabled={busyId === it.id} onClick={e => { e.stopPropagation(); rechazar(it.id); }}>Rechazar</button>
                  </div>
                </div>
                {expandidoId === it.id && (
                  <div className="releve-history" style={{ marginTop: -4, marginBottom: 8 }}>
                    {transaccionesDe(it.nombre).length === 0 ? <div className="empty" style={{ padding: '6px 0' }}>Ninguna transacción encontrada con este nombre.</div> :
                      transaccionesDe(it.nombre).map(t => (
                        <div key={t.id} className="releve-history-item">
                          <span>{t.fecha} · {t.nota.slice(0, 50)}</span>
                          <span>{parseFloat(t.monto || 0).toFixed(2)} €</span>
                        </div>
                      ))
                    }
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      )}

      <button className={`add-toggle-btn ${showForm ? 'cancel' : ''}`} onClick={() => setShowForm(!showForm)}>
        {showForm ? 'Cancelar' : '+ Añadir suscripción'}
      </button>

      {showForm && (
        <form className="entry-form" onSubmit={addSuscripcion}>
          <input placeholder="Nombre" value={form.nombre} onChange={e => setForm({ ...form, nombre: e.target.value })} />
          <input placeholder="Categoría" value={form.categoria} onChange={e => setForm({ ...form, categoria: e.target.value })} />
          <input type="number" step="0.01" placeholder="Monto" value={form.monto} onChange={e => setForm({ ...form, monto: e.target.value })} />
          <select value={form.frecuencia} onChange={e => setForm({ ...form, frecuencia: e.target.value })}>
            <option value="mensual">Mensual</option>
            <option value="anual">Anual</option>
          </select>
          <input type="date" value={form.fecha_proximo_cobro} onChange={e => setForm({ ...form, fecha_proximo_cobro: e.target.value })} />
          <input placeholder="Método de pago" value={form.metodo_pago} onChange={e => setForm({ ...form, metodo_pago: e.target.value })} />
          <button type="submit" disabled={adding}>{adding ? 'Añadiendo…' : 'Añadir suscripción'}</button>
        </form>
      )}

      {loading ? <div className="empty">Cargando…</div> :
        confirmadas.length === 0 ? <div className="empty">Sin suscripciones confirmadas.</div> :
        <div className="log">
          {confirmadas.map(it => (
            <div key={it.id}>
              <div className="entry" style={{ cursor: 'pointer' }} onClick={() => setExpandidoId(expandidoId === it.id ? null : it.id)}>
                <div className="entry-main">
                  <div className="entry-title">{it.nombre}</div>
                  <div className="entry-meta">{it.categoria || 'sin categoría'} · {parseFloat(it.monto || 0).toFixed(2)} € · {it.frecuencia} · {it.estado} · {transaccionesDe(it.nombre).length} transacción(es) registrada(s)</div>
                </div>
                <div className="entry-actions">
                  <button className="ghost" disabled={busyId === it.id} onClick={e => { e.stopPropagation(); remove(it.id); }}>{busyId === it.id ? '…' : 'Borrar'}</button>
                </div>
              </div>
              {expandidoId === it.id && (
                <div className="releve-history" style={{ marginTop: -4, marginBottom: 8 }}>
                  {transaccionesDe(it.nombre).length === 0 ? <div className="empty" style={{ padding: '6px 0' }}>Ninguna transacción encontrada con este nombre.</div> :
                    transaccionesDe(it.nombre).map(t => (
                      <div key={t.id} className="releve-history-item">
                        <span>{t.fecha} · {t.nota.slice(0, 50)}</span>
                        <span>{parseFloat(t.monto || 0).toFixed(2)} €</span>
                      </div>
                    ))
                  }
                </div>
              )}
            </div>
          ))}
        </div>
      }
    </div>
  );
}

function TransaccionesTab() {
  const [items, setItems] = useState([]);
  const [cuentas, setCuentas] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState({ tipo: 'gasto', categoria: '', subcategoria: '', monto: '', cuenta: '', nota: '' });
  const [adding, setAdding] = useState(false);
  const [busyId, setBusyId] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [filtros, setFiltros] = useState({ cuenta: '', categoria: '', mes: '', texto: '' });
  const [asignando, setAsignando] = useState(null);
  const [categoriaRapida, setCategoriaRapida] = useState({});
  const [vinculando, setVinculando] = useState(false);
  const [resultadoVinculo, setResultadoVinculo] = useState(null);
  const [sincronizando, setSincronizando] = useState(false);
  const [resultadoSync, setResultadoSync] = useState(null);
  const [depurando, setDepurando] = useState(false);
  const [posiblesDuplicados, setPosiblesDuplicados] = useState(null);

  function buscarDuplicados() {
    setDepurando(true);
    apiCall('eliminarDuplicados', {}).then(res => {
      setDepurando(false);
      if (res && !res.error) setPosiblesDuplicados(res.detalle || []);
    });
  }

  function vincularTransferencias() {
    setVinculando(true);
    apiCall('vincularTransferencias', {}).then(res => {
      setVinculando(false);
      if (res && !res.error) {
        setResultadoVinculo(`✓ ${res.vinculadas} transferencia(s) vinculada(s)${res.pendientesSalida || res.pendientesEntrada ? ` · ${res.pendientesSalida} salida(s) y ${res.pendientesEntrada} entrada(s) sin pareja` : ''}`);
        load();
      }
      setTimeout(() => setResultadoVinculo(null), 6000);
    });
  }

  function sincronizarCategorias() {
    setSincronizando(true);
    apiCall('sincronizarCategorias', {}).then(res => {
      setSincronizando(false);
      if (res && !res.error) {
        setResultadoSync(`✓ ${res.actualizadas} movimiento(s) recategorizado(s) según tus reglas guardadas`);
        load();
      }
      setTimeout(() => setResultadoSync(null), 6000);
    });
  }


  function asignarCategoria(it, guardarRegla) {
    const val = categoriaRapida[it.id];
    if (!val) return;
    const [categoria, subcategoria] = val.split('|');
    setAsignando(it.id);
    apiCall('update', { sheet: 'Transacciones', data: { id: it.id, categoria, subcategoria: subcategoria || '' } }).then(() => {
      if (guardarRegla && it.nota) {
        const palabra = normalizarComercioFrontend_(it.nota);
        if (palabra) apiCall('create', { sheet: 'Reglas_Categorizacion', data: { palabra_clave: palabra, categoria, subcategoria: subcategoria || '' } });
      }
      setAsignando(null);
      load();
    });
  }

  function load() {
    setLoading(true);
    apiCall('list', { sheet: 'Transacciones' }).then(res => { setItems(Array.isArray(res) ? res : []); setLoading(false); });
    apiCall('list', { sheet: 'Cuentas_Bancarias' }).then(res => setCuentas(Array.isArray(res) ? res : []));
  }
  useEffect(load, []);

  function addTransaccion(e) {
    e.preventDefault();
    if (!form.monto || adding) return;
    setAdding(true);
    apiCall('create', { sheet: 'Transacciones', data: { ...form, fecha: new Date().toISOString().slice(0, 10) } }).then(() => {
      setForm({ tipo: 'gasto', categoria: '', subcategoria: '', monto: '', cuenta: '', nota: '' });
      setAdding(false);
      setShowForm(false);
      load();
    });
  }

  function remove(id) {
    if (busyId) return;
    setBusyId(id);
    apiCall('delete', { sheet: 'Transacciones', id }).then(() => { setBusyId(null); load(); });
  }

  function monedaDeCuenta(nombreCuenta) {
    const c = cuentas.find(c => c.nombre === nombreCuenta);
    return (c && c.moneda) || 'EUR';
  }
  function simboloMoneda(moneda) {
    return moneda === 'EUR' ? '€' : moneda === 'COP' ? 'COP' : moneda === 'USD' ? 'USD' : moneda;
  }

  const meses = [...new Set(items.map(it => (it.fecha || '').slice(0, 7)).filter(Boolean))].sort().reverse();
  const categorias = [...new Set(items.map(it => it.categoria).filter(Boolean))];

  const visibles = items.filter(it => {
    if (filtros.cuenta && it.cuenta !== filtros.cuenta) return false;
    if (filtros.categoria && it.categoria !== filtros.categoria) return false;
    if (filtros.mes && (it.fecha || '').slice(0, 7) !== filtros.mes) return false;
    if (filtros.texto && !((it.nota || '') + (it.categoria || '')).toLowerCase().includes(filtros.texto.toLowerCase())) return false;
    return true;
  }).sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

  // El balance solo suma cuentas en EUR — mezclar monedas distintas en una
  // sola cifra no tendría ningún significado real (2.000.000 COP + 500 EUR
  // no son "2.000.500 de nada"). Las cuentas en otra moneda se resumen aparte.
  const visiblesEUR = visibles.filter(it => monedaDeCuenta(it.cuenta) === 'EUR');
  const balance = visiblesEUR.reduce((acc, it) => {
    const monto = parseFloat(it.monto) || 0;
    if (it.tipo === 'ingreso') return acc + monto;
    if (it.tipo === 'gasto') return acc - monto;
    return acc;
  }, 0);
  const totalTransferencias = visiblesEUR.filter(it => it.tipo === 'transferencia').reduce((acc, it) => acc + (parseFloat(it.monto) || 0), 0);
  const sinCategoria = items.filter(it => !it.categoria && it.tipo !== 'transferencia').length;

  const monedasNoEUR = [...new Set(cuentas.filter(c => c.moneda && c.moneda !== 'EUR').map(c => c.moneda))];
  const balancesPorOtraMoneda = monedasNoEUR.map(moneda => {
    const cuentasDeEsaMoneda = cuentas.filter(c => c.moneda === moneda).map(c => c.nombre);
    const movs = visibles.filter(it => cuentasDeEsaMoneda.includes(it.cuenta));
    const bal = movs.reduce((acc, it) => {
      const monto = parseFloat(it.monto) || 0;
      if (it.tipo === 'ingreso') return acc + monto;
      if (it.tipo === 'gasto') return acc - monto;
      return acc;
    }, 0);
    return { moneda, balance: bal };

      {totalTransferencias > 0 && (
        <div className="entry-meta" style={{ marginBottom: 6 }}>Transferencias entre tus cuentas (no contadas): {totalTransferencias.toFixed(2)} €</div>
      )}
      {sinCategoria > 0 && (
        <div className="entry-meta" style={{ marginBottom: 14, color: 'var(--red)' }}>⚠ {sinCategoria} movimiento(s) sin categoría — asígnala abajo en cada uno</div>
      )}

      <button className={`add-toggle-btn ${showForm ? 'cancel' : ''}`} onClick={() => setShowForm(!showForm)}>
        {showForm ? 'Cancelar' : '+ Añadir movimiento'}
      </button>
      <button className="add-toggle-btn" disabled={vinculando} onClick={vincularTransferencias} style={{ marginLeft: 8 }}>
        {vinculando ? 'Vinculando…' : '🔗 Vincular transferencias'}

      <button className="add-toggle-btn" disabled={depurando} onClick={buscarDuplicados} style={{ marginLeft: 8 }}>

      {resultadoSync && <div className="entry-meta" style={{ marginTop: 8, color: 'var(--accent)' }}>{resultadoSync}</div>}

      {posiblesDuplicados !== null && (

            <option value="gasto">Gasto</option>

            <option value="">Subcategoría</option>

      {loading ? <div className="empty">Cargando…</div> :

function BolsaPosicionesTab() {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [cotizaciones, setCotizaciones] = useState({});
  const [syncStatus, setSyncStatus] = useState(null);
  const [cuentasBolsa, setCuentasBolsa] = useState([]);
  const [form, setForm] = useState({ ticker: '', nombre: '', cantidad: '', precio_promedio_compra: '', moneda: '', cuenta_broker: '' });
  const [adding, setAdding] = useState(false);
  const [busyId, setBusyId] = useState(null);
  const [showForm, setShowForm] = useState(false);

  function load() {
    setLoading(true);
    apiCall('list', { sheet: 'Bolsa_Posiciones' }).then(res => {
      const lista = Array.isArray(res) ? res : [];
      setItems(lista);
      setLoading(false);
      cargarCotizaciones(lista);
    });
    apiCall('list', { sheet: 'Cuentas_Bolsa' }).then(res => setCuentasBolsa(Array.isArray(res) ? res : []));
  }
  useEffect(load, []);

  function cargarCotizaciones(lista) {
    const tickers = [...new Set(lista.map(it => it.ticker).filter(Boolean))];
    if (tickers.length === 0) return;
    setSyncStatus('cargando');
    apiCall('stockQuotes', { tickers }).then(res => {
      if (res && !res.error) {
        setCotizaciones(res);
        setSyncStatus('ok');
      } else {
        setSyncStatus('error');
      }
      setTimeout(() => setSyncStatus(null), 2500);
    });
  }

  function addPosicion(e) {
    e.preventDefault();
    if (!form.ticker || adding) return;
    setAdding(true);
    apiCall('create', { sheet: 'Bolsa_Posiciones', data: form }).then(() => {
      setForm({ ticker: '', nombre: '', cantidad: '', precio_promedio_compra: '', moneda: '', cuenta_broker: '' });
      setAdding(false);
      setShowForm(false);
      load();
    });
  }

  function remove(id) {
    if (busyId) return;
    setBusyId(id);
    apiCall('delete', { sheet: 'Bolsa_Posiciones', id }).then(() => { setBusyId(null); load(); });
  }

  const valorTotal = items.reduce((acc, it) => {
    const q = cotizaciones[it.ticker];
    const precio = q ? q.precio : parseFloat(it.precio_promedio_compra) || 0;
    return acc + precio * (parseFloat(it.cantidad) || 0);
  }, 0);
  const gananciaTotal = items.reduce((acc, it) => {
    const q = cotizaciones[it.ticker];
    if (!q) return acc;
    return acc + (q.precio - (parseFloat(it.precio_promedio_compra) || 0)) * (parseFloat(it.cantidad) || 0);
  }, 0);

  return (
    <div>
      <div className="topbar">
        <span className="entry-meta">Valor total (cotización en vivo)</span>
        <div style={{ display: 'flex', gap: 12, alignItems: 'baseline' }}>
          <span className="entry-amount">{valorTotal.toFixed(2)}</span>
          <button className="ghost" onClick={() => cargarCotizaciones(items)}>
            {syncStatus === 'cargando' ? '⟳ …' : syncStatus === 'ok' ? '✓' : syncStatus === 'error' ? '✕ Error' : '⟳ Sincronizar'}
          </button>
        </div>
      </div>
      <div className="entry-meta" style={{ marginBottom: 16 }}>
        Ganancia/pérdida no realizada: <span style={{ color: gananciaTotal >= 0 ? 'var(--green)' : 'var(--red)', fontFamily: 'IBM Plex Mono, monospace' }}>{gananciaTotal >= 0 ? '+' : ''}{gananciaTotal.toFixed(2)}</span>
      </div>

      {items.length > 0 && (
        <div className="kanban-card-meta" style={{ marginBottom: 16 }}>
          {[...new Set(items.map(it => it.ticker))].map(t => <span key={t} className="chip">{t}</span>)}
        </div>
      )}

      <button className={`add-toggle-btn ${showForm ? 'cancel' : ''}`} onClick={() => setShowForm(!showForm)}>
        {showForm ? 'Cancelar' : '+ Añadir posición'}
      </button>

      {showForm && (
        <form className="entry-form" onSubmit={addPosicion}>
          <input placeholder="Ticker (ej. AAPL)" value={form.ticker} onChange={e => setForm({ ...form, ticker: e.target.value.toUpperCase() })} />
          <input placeholder="Nombre" value={form.nombre} onChange={e => setForm({ ...form, nombre: e.target.value })} />
          <input type="number" step="0.0001" placeholder="Cantidad" value={form.cantidad} onChange={e => setForm({ ...form, cantidad: e.target.value })} />
          <input type="number" step="0.01" placeholder="Precio promedio de compra" value={form.precio_promedio_compra} onChange={e => setForm({ ...form, precio_promedio_compra: e.target.value })} />
          <input placeholder="Moneda" value={form.moneda} onChange={e => setForm({ ...form, moneda: e.target.value })} />
          <select value={form.cuenta_broker} onChange={e => setForm({ ...form, cuenta_broker: e.target.value })}>
            <option value="">Cuenta / broker</option>
            {cuentasBolsa.map(c => <option key={c.id} value={c.nombre}>{c.nombre}</option>)}
          </select>
          <button type="submit" disabled={adding}>{adding ? 'Añadiendo…' : 'Añadir posición'}</button>
        </form>
      )}

      {loading ? <div className="empty">Cargando…</div> :
        items.length === 0 ? <div className="empty">Sin posiciones registradas.</div> :
        <div className="log">
          {items.map(it => {
            const q = cotizaciones[it.ticker];
            const cantidad = parseFloat(it.cantidad) || 0;
            const compra = parseFloat(it.precio_promedio_compra) || 0;
            const ganancia = q ? (q.precio - compra) * cantidad : null;
            return (
              <div key={it.id} className="entry">
                <div className="entry-main">
                  <div className="entry-title">{it.ticker} {it.nombre && `· ${it.nombre}`}</div>
                  <div className="entry-meta">
                    {cantidad} uds · compra {compra.toFixed(2)} {it.moneda || ''}
                    {q ? ` · actual ${q.precio.toFixed(2)} ${q.moneda || ''}` : ' · sin cotización'}
                  </div>
                </div>
                {ganancia !== null && (
                  <span className="entry-amount" style={{ color: ganancia >= 0 ? 'var(--green)' : 'var(--red)' }}>
                    {ganancia >= 0 ? '+' : ''}{ganancia.toFixed(2)}
                  </span>
                )}
                <div className="entry-actions">
                  <button className="ghost" disabled={busyId === it.id} onClick={() => remove(it.id)}>{busyId === it.id ? '…' : 'Borrar'}</button>
                </div>
              </div>
            );
          })}
        </div>
      }
    </div>
  );
}

function normalizarComercioFrontend_(descripcion) {
  let d = (descripcion === null || descripcion === undefined) ? '' : String(descripcion);
  d = d.replace(/^CARTE\s+\d{2}[\/.]\d{2}[\/.]?\d{0,4}\s+/i, '');
  d = d.replace(/\s*CB\*\d+\s*$/i, '');
  d = d.replace(/\s+\d+\s*$/, '');
  return d.trim().toUpperCase();
}

function DonutChart({ datos, size }) {
  const total = datos.reduce((s, [, v]) => s + v, 0) || 1;
  const colores = ['var(--accent)', 'var(--green)', 'var(--red)', '#8b5cf6', '#f59e0b', '#06b6d4', '#ec4899', '#84cc16', '#64748b', '#a855f7'];
  let acumulado = 0;
  const segmentos = datos.map(([nombre, valor], i) => {
    const pct = (valor / total) * 100;
    const desde = acumulado;
    acumulado += pct;
    return `${colores[i % colores.length]} ${desde}% ${acumulado}%`;
  });
  const gradient = `conic-gradient(${segmentos.join(', ')})`;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
      <div style={{ width: size || 140, height: size || 140, borderRadius: '50%', background: gradient, flexShrink: 0, position: 'relative' }}>
        <div style={{ position: 'absolute', top: '18%', left: '18%', width: '64%', height: '64%', borderRadius: '50%', background: 'var(--surface)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column' }}>
          <span style={{ fontSize: 11, color: 'var(--ink-faint)' }}>Total</span>
          <span style={{ fontSize: 14, fontWeight: 600 }}>{total.toFixed(0)} €</span>
        </div>
      </div>
      <div style={{ flex: 1, minWidth: 160 }}>
        {datos.map(([nombre, valor], i) => (
          <div key={nombre} style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4, fontSize: 12 }}>
            <span style={{ width: 9, height: 9, borderRadius: '50%', background: colores[i % colores.length], flexShrink: 0 }}></span>
            <span style={{ flex: 1 }}>{nombre}</span>
            <span className="entry-meta">{((valor / total) * 100).toFixed(0)}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function GraficoLineaMultiple({ series, etiquetas }) {
  if (!etiquetas || etiquetas.length < 2) {
    return <div className="empty">Necesitas al menos 2 periodos para ver la evolución.</div>;
  }
  const W = 640, H = 220, PAD = 30;
  const todosValores = series.flatMap(s => s.puntos);
  const min = Math.min(0, ...todosValores), max = Math.max(...todosValores, 1);
  const rango = (max - min) || 1;
  const x = i => PAD + (i / (etiquetas.length - 1)) * (W - PAD * 2);
  const y = v => H - PAD - ((v - min) / rango) * (H - PAD * 2);
  const yCero = y(0);

  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 220 }}>
        <line x1={PAD} y1={yCero} x2={W - PAD} y2={yCero} stroke="var(--line)" strokeWidth="1" />
        {series.map((s, si) => {
          const lineaPuntos = s.puntos.map((v, i) => `${x(i)},${y(v)}`).join(' ');
          return (
            <g key={si}>
              <polyline points={lineaPuntos} fill="none" stroke={s.color} strokeWidth="2" />
              {s.puntos.map((v, i) => <circle key={i} cx={x(i)} cy={y(v)} r="3" fill={s.color} />)}
            </g>
          );
        })}
        {etiquetas.map((et, i) => (
          <text key={i} x={x(i)} y={H - 8} fontSize="9" fill="var(--ink-faint)" textAnchor="middle">{et.slice(5)}</text>
        ))}
      </svg>
      <div style={{ display: 'flex', gap: 14, marginTop: 6, flexWrap: 'wrap' }}>
        {series.map((s, i) => (
          <span key={i} className="entry-meta" style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
            <span style={{ width: 9, height: 9, borderRadius: '50%', background: s.color }}></span>{s.label}
          </span>
        ))}
      </div>
    </div>
  );
}
